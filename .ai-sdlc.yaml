# .ai-sdlc.yaml — os-santiago/ai-sdlc consumes its own contract (dogfooding).
# Canonical repo → keeps a conservative ceiling (auto-merge-low) since the
# runtime must earn trust here first. Validates via:
#   tools/validate-ai-sdlc-config.sh .ai-sdlc.yaml spec/ai-sdlc.schema.json
spec: "1.0.0"

repo:
  archetype: tooling
  primary_language: shell
  deploys_to: none

autonomy:
  level: auto-merge-low
  merge_requires_checks: true
  freeze_env: AI_SDLC_FREEZE

triggers:
  issue_label: ready-to-implement
  skip_labels:
    - epic
    - wontfix
    - invalid
    - duplicate
    - question
    - dependencies
    - needs-human
  authorized_labelers:
    - Axel-DaMage

verify:
  commands:
    # Full repo check (contract schema + secret scan, workflow/action YAML,
    # spec JSON). Same script backs `npm test` / `npm run build`.
    - bash tools/validate-repo.sh
  required_checks: []
  timeout_seconds: 300

# Supply-chain evidence (issue #92, epic #87): the sbom workflow emits a
# CycloneDX JSON of the npm dependency surface on every PR, and
# ai-sdlc-release attaches it to the release as an attested asset.
# Boolean floor — an org baseline's `true` pins it on org-wide.
security:
  sbom: true

# Ready-queue prioritization (issue #162, epic #147): the sweep scores every
# armed issue — trigger label present, no veto label per spec/labels.md —
# and publishes the ordered dispatch queue as run evidence (step summary +
# JSON artifact). Read-only: it never labels, comments, or dispatches.
prioritize:
  enabled: true
  priority_override: true        # priority tier outranks raw score — P0 always first
  max: 50
  weights:
    # score = priority[tier] + age_per_day×min(age, cap) + epic_linked +
    #         blocking×#(open blocked) + blocked×#(open blockers)
    priority: {P0: 1000, P1: 300, P2: 100, P3: 25}
    unlabeled: 0
    age_per_day: 2               # reward waiting time, capped by age_cap_days
    age_cap_days: 30
    epic_linked: 25              # scc:child label or parent:#N marker → epic momentum
    blocking: 15                 # per open issue this issue blocks
    blocked: -20                 # per open blocker still gating it

# Dependency-update worker (issue #177): scheduled scan → vetted dep PRs.
# This repo's package.json exists for tooling metadata only, so a run is a
# no-op today — the block is the dogfooded contract surface.
dependencies:
  enabled: true
  ecosystems: [npm]
  cadence: daily
  min_release_age_days: 7        # supply-chain age gate — fresh releases flag human
  target: wanted                 # stay inside declared semver ranges
  include_dev: true
  auto_kinds: [patch, minor]     # risk threshold: majors/unknown always flag human
  max_updates: 10
  branch: chore/dep-updates
  labels: [dependencies, ai-sdlc]
  egress_profile: npm-vet        # vetting fetches only registry.npmjs.org + api.osv.dev

review:
  mode: ai
  ai_reviewer:
    # Provider-native model for the GHA review stage — OmniRoute route
    # names (auto/*, devin/*) are Hermes control-plane only (ADR-0001)
    # and fall back to model.primary during contract resolution.
    model: nvidia/nemotron-3-super-120b-a12b
    inline_comments: true
    incremental: true
  max_fix_iterations: 3        # bounded review→fix convergence (issue #28)
  wait_max_minutes: 15         # merge-gate cap on a pending verdict → review_timeout
  external_reviewer: ""        # e.g. coderabbit — empty = AI-only path
  adversarial:
    # Hostile second pass on high-risk diffs (issue #180, epic #151):
    # the trigger threshold is declared HERE — pr diffs classified at or
    # above min_tier get generated injection probes + abuse-case review;
    # findings enter the same review-fix loop as normal findings.
    enabled: true
    min_tier: high             # pr:risk-high | pr:risk-critical
    max_attacks: 16            # cap on generated probes per run
    max_seconds: 600           # engine wall-clock budget for the pass
  risk_labels:
    - pr:risk-low
    - pr:risk-medium
    - pr:risk-high
    - pr:risk-critical
    - pr:risk-accepted
  critical_requires_acceptance: true

merge:
  method: squash
  delete_branch: true
  max_repairs: 3
  pending_max_minutes: 60
  grace_minutes: 10
  # Automerge hardening (issues #119/#120) — defaults are already the
  # secure posture; declared here as the audit record. require_checks:
  # a zero-check rollup is held/escalated, never merged. Provenance:
  # only same-repo heads by the pipeline app or allow_authors merge.
  require_checks: true
  require_pipeline_provenance: true
  pipeline_author: ai-sdlc-runtime[bot]
  allow_authors:
    - dependabot[bot]   # dep-update fast path stays autonomous
  skip_labels:
    - needs-human
    - hold
    - do-not-merge
    - wip
  main_guard:
    # Sentinel (issue #189): halt automerge while a gate workflow's newest
    # completed run on main is red; file one deduped postmortem; clear on
    # green. This repo's gates: the self-dogfood contract suite + actionlint.
    enabled: true
    workflows:
      - ai-sdlc (self)
      - actionlint
    max_age_hours: 72

labels:
  queued: scc:queued
  in-progress: scc:in-progress
  pr-opened: scc:pr-opened
  failed: scc:failed
  not-ready: scc:not-ready     # refinement-hold binding (canonical: needs-refinement)
  no-changes: scc:no-changes
  # Issue-label state machine — machine-checkable matrix (normative:
  # spec/labels.md). The effective forbidden set is veto_pairs ∪ every
  # triggers.skip_labels entry vetoing triggers.issue_label; an observed
  # pair is a pipeline defect — veto + repair + log, never a silent skip.
  state_machine:
    veto_pairs:
      - {winner: needs-human, loser: ready-to-implement}
      - {winner: scc:not-ready, loser: ready-to-implement}
      - {winner: needs-human, loser: scc:not-ready}
      - {winner: scc:queued, loser: ready-to-implement}
      - {winner: scc:in-progress, loser: ready-to-implement}
      - {winner: scc:pr-opened, loser: ready-to-implement}
    owners:
      ready-to-implement: {set_by: [authorized-labeler, refiner], cleared_by: [dispatch, human]}
      scc:not-ready: {set_by: [refiner], cleared_by: [refiner, human]}
      needs-human: {set_by: [admission-gate, escalation, human], cleared_by: [human], clear_guard: policy:accepted}
      scc:in-progress: {set_by: [dispatch], cleared_by: [dispatch]}
      epic: {set_by: [triage, human]}
      duplicate: {set_by: [dedup, human]}
      umbrella: {set_by: [triage, human]}
      scc:child: {set_by: [decomposer]}

model:
  # GHA-native runtime resolves provider_base_url → vars.AI_SDLC_PROVIDER_URL
  # (GitHub Models retired 2026-07-30; current: NVIDIA NIM via MODEL_API_KEY).
  # OmniRoute route names (auto/*, devin/*) are Hermes control-plane only —
  # unreachable from GHA runners by design (ADR-0001).
  primary: nvidia/nemotron-3-super-120b-a12b
  fallback: nvidia/nemotron-3.5-lightning-30b-a3b

# Per-task-class model routing (issue #171; spec/model-routing.md):
# model-only entries keep the default adapter (engine.name = scc); a
# missing model falls back to model.primary.
engines:
  intake:
    model: nvidia/nemotron-3.5-lightning-30b-a3b   # cheap class — mechanical triage
  ci-repair:
    model: nvidia/nemotron-3-super-120b-a12b        # frontier class on the repair loop

engine:
  name: scc
  max_steps: 200
  max_seconds: 900
  flags:
    - --no-commit
    - --audit-log
    - --summary-file
    - --prompt-file

escalation:
  label: needs-human
  contacts:
    - "@Axel-DaMage"
  notify_channels: []
  # Failure-class → notification route map (spec/risk-taxonomy.md "Failure
  # classes and alert routing", issue #175): routes.<class> wins, `default`
  # is the reserved fallback — an unmatched class still pages the default
  # owner, never silently.
  routes:
    contract-error:    {mentions: ["@Axel-DaMage"], labels: ["priority:P0"], channel: issue-comment}
    security:          {mentions: ["@Axel-DaMage"], labels: ["priority:P0"], channel: issue-comment}
    provenance:        {mentions: ["@Axel-DaMage"], labels: ["priority:P0"], channel: issue-comment}
    supply-chain:      {mentions: ["@Axel-DaMage"], labels: ["priority:P1"], channel: issue-comment}
    verify-failure:    {mentions: ["@Axel-DaMage"], labels: ["priority:P1"], channel: issue-comment}
    repairs-exhausted: {mentions: ["@Axel-DaMage"], labels: ["priority:P1"], channel: issue-comment}
    default:           {mentions: ["@Axel-DaMage"], labels: [], channel: issue-comment}

promotion:
  clean_merges_threshold: 3
  window: 30

demotion:
  escalation_threshold: 1
  window: 30
# Release provenance (issues #100/#103): the ai-sdlc-release workflow reads
# these fields to gate SLSA attestation and cosign keyless signing of the
# published git-archive artifact. Defaults are already the secure posture —
# declared here as the audit record.
release:
  provenance: attest         # actions/attest-build-provenance (SLSA L3-class)
  signing: cosign-keyless    # Fulcio cert minted from the runner's OIDC identity
