# gitleaks-gate.toml — baseline ruleset for the ai-sdlc security gate.
#
# The controller supplies this trusted baseline to gitleaks, so a scanned
# change can never redefine the gate that scans it: no change-supplied
# .gitleaks.toml, .gitleaksignore, or inline gitleaks:allow comment is
# consulted. A consumer repository may still govern its own reviewed ruleset.
#
# Extends gitleaks' embedded default config with no overrides: the gate's
# floor is the full default ruleset.
title = "ai-sdlc security gate baseline"

[extend]
useDefault = true
