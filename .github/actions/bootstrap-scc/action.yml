# bootstrap-scc — AI-SDLC engine build + provider config (issue #139)
#
# Collapses the "Build scc engine from source" + "Configure scc engine
# provider" pair copy-pasted into every engine-running stage: shallow-clone
# the pinned engine, npm ci && npm run build, link it, then render
# $HOME/.sc-agent/config.json — the engine's single source of truth on the
# runner (never env/CLI-flag overrides).
#
# The render is the canonical permission profile: full tool autoApprove for
# the headless run, denyPaths hard-walling credentials and SSH material.
# The provider defaults to GitHub Models (GITHUB_TOKEN); a non-empty
# model-api-key input switches to a direct provider key.
name: ai-sdlc bootstrap-scc
description: Build the scc engine from source and render its provider config.json

inputs:
  model:
    description: 'engine model id (provider-native, e.g. openai/gpt-4o)'
    required: true
  provider-base-url:
    description: 'OpenAI-compatible inference base URL (caller resolves input → vars.AI_SDLC_PROVIDER_URL → GitHub Models)'
    default: 'https://models.github.ai/inference'
  model-api-key:
    description: 'MODEL_API_KEY secret — optional direct provider key; empty → GitHub Models via models-token'
    default: ''
  models-token:
    description: 'token backing GitHub Models inference (secrets.GITHUB_TOKEN)'
    default: ''
  src-dir:
    description: 'engine source checkout dir'
    default: '/tmp/scc-src'

runs:
  using: composite
  steps:
    - name: Build scc engine from source
      shell: bash
      env:
        SRC_DIR: ${{ inputs.src-dir }}
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/os-santiago/sc-agent-cli "$SRC_DIR"
        cd "$SRC_DIR" && npm ci && npm run build
        npm link >/dev/null 2>&1 || true
        scc --version

    - name: Configure scc engine provider
      shell: bash
      env:
        MODEL_NAME: ${{ inputs.model }}
        PROVIDER_BASE_URL: ${{ inputs.provider-base-url }}
        MODEL_API_KEY: ${{ inputs.model-api-key }}
        GH_TOKEN_FOR_MODELS: ${{ inputs.models-token }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.sc-agent"
        API_KEY="${MODEL_API_KEY:-$GH_TOKEN_FOR_MODELS}"
        cat > "$HOME/.sc-agent/config.json" <<JSON
        {
          "model": {
            "provider": "openai-compatible",
            "baseUrl": "${PROVIDER_BASE_URL}",
            "apiKey": "${API_KEY}",
            "model": "${MODEL_NAME}",
            "temperature": 0.2,
            "maxTokens": 8192,
            "stream": false
          },
          "permissions": {
            "autoApprove": ["read_file","list_dir","search_text","web_fetch","memory_read","write_file","edit_file","run_shell","git","memory_write"],
            "denyPaths": [".env",".env.*","**/*.key","**/*.pem","**/id_rsa*","**/.ssh/*","**/credentials*"]
          }
        }
        JSON
        KEY_SRC="MODEL_API_KEY"
        [ -z "${MODEL_API_KEY:-}" ] && KEY_SRC="GITHUB_TOKEN (GitHub Models)"
        echo "scc provider → baseUrl=${PROVIDER_BASE_URL} model=${MODEL_NAME} key=${KEY_SRC}"
