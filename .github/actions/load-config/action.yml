# load-config — AI-SDLC contract resolution (issue #22, org layer #44)
#
# Every runtime stage runs this first. It locates the target repo's
# .ai-sdlc.yaml, validates it (spec/ai-sdlc.schema.json + secret scan via
# tools/validate-ai-sdlc-config.sh), resolves it against runtime defaults
# and workflow-input overrides, and emits the resolved contract as step
# outputs plus a contract.json artifact.
#
# Precedence: workflow input (override) > .ai-sdlc.yaml > org baseline
# (spec/org-policy.md, via `org-config`) > runtime defaults.
# Missing/invalid contract → the step fails with an `scc:config-error`
# annotation and writes the reason to "$RUNNER_TEMP/ai-sdlc-contract/error.txt".
name: ai-sdlc load-config
description: Resolve and validate the per-repo .ai-sdlc.yaml contract

inputs:
  repo:
    description: 'owner/repo whose contract is resolved (used for checkout and provenance)'
    default: ${{ github.repository }}
  ref:
    description: 'ref to read the contract from (empty = default branch). Use a trusted ref (base), never a PR head.'
    default: ''
  token:
    description: 'token for the sparse checkout'
    default: ${{ github.token }}
  checkout:
    description: '"true" = sparse-checkout the contract from repo@ref; "false" = read it from `path` (repo already checked out)'
    default: 'false'
  path:
    description: 'directory holding the checked-out repo when checkout=false'
    default: '.'
  config:
    description: 'contract path relative to the repo root'
    default: '.ai-sdlc.yaml'
  overrides:
    description: 'JSON object of dotted contract paths → workflow-input values; null / "" / negative numbers mean "unset"'
    default: '{}'
  org-config:
    description: 'org baseline contract reference `owner/repo[/path][@ref]` — org floor merges per spec/org-policy.md; empty = repo contract + defaults. `token` must read the org repo (e.g. an org-installed AI_SDLC_TOKEN).'
    default: ''
  artifact:
    description: '"true" = upload contract.json as a workflow artifact'
    default: 'true'
  artifact-name:
    description: 'artifact name (default: ai-sdlc-contract-<job>-<run_attempt>)'
    default: ''

outputs:
  path:
    description: 'absolute path of the resolved contract.json'
    value: ${{ steps.resolve.outputs.path }}
  json:
    description: 'resolved contract (compact JSON, includes _sources provenance)'
    value: ${{ steps.resolve.outputs.json }}
  spec:
    value: ${{ steps.resolve.outputs.spec }}
  org_policy:
    description: 'org baseline status: applied | exempt | unavailable | not-applied'
    value: ${{ steps.resolve.outputs.org_policy }}
  autonomy_level:
    value: ${{ steps.resolve.outputs.autonomy_level }}
  trigger_label:
    value: ${{ steps.resolve.outputs.trigger_label }}
  skip_labels:
    description: 'triggers.skip_labels (JSON array)'
    value: ${{ steps.resolve.outputs.skip_labels }}
  authorized_labelers:
    description: 'triggers.authorized_labelers (JSON array)'
    value: ${{ steps.resolve.outputs.authorized_labelers }}
  model_primary:
    value: ${{ steps.resolve.outputs.model_primary }}
  model_fallback:
    description: 'empty when no fallback is configured'
    value: ${{ steps.resolve.outputs.model_fallback }}
  max_seconds:
    value: ${{ steps.resolve.outputs.max_seconds }}
  max_steps:
    value: ${{ steps.resolve.outputs.max_steps }}
  verify_commands:
    description: 'verify.commands, newline-separated'
    value: ${{ steps.resolve.outputs.verify_commands }}
  verify_timeout_seconds:
    value: ${{ steps.resolve.outputs.verify_timeout_seconds }}
  required_checks:
    description: 'verify.required_checks (JSON array)'
    value: ${{ steps.resolve.outputs.required_checks }}
  merge_method:
    value: ${{ steps.resolve.outputs.merge_method }}
  merge_delete_branch:
    value: ${{ steps.resolve.outputs.merge_delete_branch }}
  max_repairs:
    value: ${{ steps.resolve.outputs.max_repairs }}
  pending_max_minutes:
    value: ${{ steps.resolve.outputs.pending_max_minutes }}
  merge_skip_labels:
    description: 'merge.skip_labels (JSON array)'
    value: ${{ steps.resolve.outputs.merge_skip_labels }}
  review_mode:
    description: 'review.mode — ai | human | hybrid'
    value: ${{ steps.resolve.outputs.review_mode }}
  review_model:
    description: 'reviewer model — review.ai_reviewer.model with OmniRoute routes (auto/*, devin/*) falling back to model.primary (ADR-0001)'
    value: ${{ steps.resolve.outputs.review_model }}
  review_max_fix_iterations:
    description: 'review.max_fix_iterations — bounded review→fix convergence per PR'
    value: ${{ steps.resolve.outputs.review_max_fix_iterations }}
  review_wait_max_minutes:
    description: 'review.wait_max_minutes — merge-gate cap on a pending review verdict before review_timeout'
    value: ${{ steps.resolve.outputs.review_wait_max_minutes }}
  review_external_reviewer:
    description: 'review.external_reviewer — external reviewer slug prefix; empty = AI-only path'
    value: ${{ steps.resolve.outputs.review_external_reviewer }}
  escalation_label:
    value: ${{ steps.resolve.outputs.escalation_label }}
  labels:
    description: 'flow-state labels map (JSON object)'
    value: ${{ steps.resolve.outputs.labels }}
  label_queued:
    value: ${{ steps.resolve.outputs.label_queued }}
  label_pr_opened:
    value: ${{ steps.resolve.outputs.label_pr_opened }}
  label_failed:
    value: ${{ steps.resolve.outputs.label_failed }}
  label_not_ready:
    value: ${{ steps.resolve.outputs.label_not_ready }}
  label_no_changes:
    value: ${{ steps.resolve.outputs.label_no_changes }}

runs:
  using: composite
  steps:
    - name: Sparse-checkout contract
      if: inputs.checkout == 'true'
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: .ai-sdlc-contract-src
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: ${{ inputs.config }}
        sparse-checkout-cone-mode: false

    - name: Resolve org baseline ref
      if: inputs.org-config != ''
      id: orgref
      shell: bash
      env:
        ORG_CONFIG: ${{ inputs.org-config }}
      run: |
        spec="$ORG_CONFIG"; ref=""
        if [[ "$spec" == *@* ]]; then ref="${spec##*@}"; spec="${spec%@*}"; fi
        owner="${spec%%/*}"; rest="${spec#*/}"; name="${rest%%/*}"; path=""
        if [[ "$rest" != "$spec" && "$rest" == */* ]]; then path="${rest#*/}"; fi
        repo="$owner/$name"
        if [[ "$spec" != */* ]] || ! [[ "$repo" =~ ^[-A-Za-z0-9_.]+/[-A-Za-z0-9_.]+$ ]]; then
          echo "::error title=ai-sdlc contract (scc:config-error)::org-config must be owner/repo[/path][@ref] — got: $ORG_CONFIG"
          mkdir -p "$RUNNER_TEMP/ai-sdlc-contract"
          echo "malformed org-config input (expected owner/repo[/path][@ref]): $ORG_CONFIG" > "$RUNNER_TEMP/ai-sdlc-contract/error.txt"
          exit 1
        fi
        { echo "repo=$repo"; echo "ref=$ref"; echo "path=${path:-.ai-sdlc.yaml}"; } >> "$GITHUB_OUTPUT"

    - name: Sparse-checkout org baseline
      if: inputs.org-config != ''
      continue-on-error: true
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.orgref.outputs.repo }}
        ref: ${{ steps.orgref.outputs.ref }}
        token: ${{ inputs.token }}
        path: .ai-sdlc-org-src
        fetch-depth: 1
        persist-credentials: false
        sparse-checkout: ${{ steps.orgref.outputs.path }}
        sparse-checkout-cone-mode: false

    - name: Validate + resolve contract
      id: resolve
      shell: bash
      env:
        CONTRACT_ROOT: ${{ inputs.checkout == 'true' && '.ai-sdlc-contract-src' || inputs.path }}
        CONTRACT_FILE: ${{ inputs.config }}
        OVERRIDES: ${{ inputs.overrides }}
        ORG_CONFIG: ${{ inputs.org-config }}
        ORG_ROOT: .ai-sdlc-org-src
        ORG_REPO: ${{ steps.orgref.outputs.repo }}
        ORG_REF: ${{ steps.orgref.outputs.ref }}
        ORG_PATH: ${{ steps.orgref.outputs.path }}
        SOURCE_REPO: ${{ inputs.repo }}
        SOURCE_REF: ${{ inputs.ref }}
        OUT_DIR: ${{ runner.temp }}/ai-sdlc-contract
      run: bash "$GITHUB_ACTION_PATH/resolve.sh"

    - name: Clean sparse checkouts
      if: always() && (inputs.checkout == 'true' || inputs.org-config != '')
      shell: bash
      run: rm -rf .ai-sdlc-contract-src .ai-sdlc-org-src

    - name: Upload contract.json
      if: always() && inputs.artifact == 'true'
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name || format('ai-sdlc-contract-{0}-{1}', github.job, github.run_attempt) }}
        path: |
          ${{ runner.temp }}/ai-sdlc-contract/contract.json
          ${{ runner.temp }}/ai-sdlc-contract/error.txt
        if-no-files-found: ignore
        retention-days: 14
