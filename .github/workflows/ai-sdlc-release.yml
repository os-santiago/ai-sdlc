# ai-sdlc-release — maintainer-dispatched release driver (issue #178)
#
# Two jobs, least-privilege split:
#
#   release    (contents: write only) — compute the plan, annotate + push
#     the tag(s), create the GitHub release, package the `git archive`
#     source tarball, publish it as a run artifact. When the contract
#     enables `security.sbom` (issue #92), a CycloneDX SBOM of the npm
#     dependency surface is emitted into dist/ alongside the tarball and
#     ships as a release asset. dry_run=true (the default) prints the
#     plan to the step summary and mutates nothing.
#
#   provenance (contents: write + id-token: write + attestations: write) —
#     runs only when a release was actually published. Reads the
#     `release.*` contract (issues #100, #103) and, per its posture,
#     cosign sign-blob keyless-signs the tarball under the runner's GitHub
#     OIDC identity (Fulcio cert, Rekor transparency log), attests it via
#     SHA-pinned actions/attest-build-provenance (SLSA L3-class), attaches
#     the artifact + .sig/.crt/.sigstore.json to the release, and exports
#     the attestation bundle (.jsonl) as a release asset for offline
#     verification. The SBOM (when emitted) is an attestation subject too —
#     every shipped asset lands provenanced or the job fails. Any
#     signing/attestation failure fails the job — a release never ships
#     partially-provenanced assets silently.
#
# Consumer verification: tools/verify-release.sh, or manually —
#   cosign verify-blob --signature <art>.sig --certificate <art>.crt \
#     --certificate-identity-regexp 'WORKFLOW_RE' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     <art>
#   gh attestation verify <art> -R <owner>/<repo>
#
# Spec semver sensitivity (AGENTS.md): a BREAKING spec change yields a
# MAJOR spec/v* bump and must carry a migration note — the changelog
# calls it out.
name: ai-sdlc-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'runtime semver bump (auto = compute from conventional commits)'
        type: choice
        options: [auto, major, minor, patch]
        default: auto
      spec_bump:
        description: 'spec/v* bump when spec/ changed (none = skip spec tag)'
        type: choice
        options: [auto, major, minor, patch, none]
        default: auto
      ref:
        description: 'commit-ish to tag'
        type: string
        default: 'main'
      dry_run:
        description: 'plan only — no tag, push, or release'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ai-sdlc-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # tag push + release create
    outputs:
      release_status: ${{ steps.rel.outputs.release_status }}
      release_tag: ${{ steps.rel.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0     # full history + tags: bump is computed from log

      - name: Fetch all tags (release base detection)
        run: git fetch --tags --force origin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22

      - name: Compute release plan / publish
        id: rel
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          BUMP: ${{ inputs.bump }}
          SPEC_BUMP: ${{ inputs.spec_bump }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Resolve the input ref to a SHA — checkout leaves a detached HEAD,
          # so a bare branch name may not exist locally. The SHA is valid both
          # as `git tag` target and as the release target_commitish.
          SHA=$(git rev-parse "origin/$REF" 2>/dev/null || git rev-parse "$REF")
          echo "resolved_ref=$SHA" >> "$GITHUB_OUTPUT"
          args=(--repo "$GITHUB_REPOSITORY" --bump "$BUMP" --spec-bump "$SPEC_BUMP" \
                --ref "$SHA" --json --github-output \
                --changelog-file "$RUNNER_TEMP/release-notes.md")
          [ "$DRY_RUN" = "true" ] || args+=(--publish)
          node scripts/release-manager.js "${args[@]}" | tee "$RUNNER_TEMP/release-plan.json"
          {
            echo '### ai-sdlc release plan'
            echo ''
            echo '```json'
            cat "$RUNNER_TEMP/release-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package source artifact (git archive)
        if: steps.rel.outputs.release_status == 'released'
        run: |
          set -euo pipefail
          TAG="${{ steps.rel.outputs.release_tag }}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="ai-sdlc-${TAG}/" \
            --output="dist/ai-sdlc-${TAG}.tar.gz" "$TAG"
          sha256sum "dist/ai-sdlc-${TAG}.tar.gz" >> "$GITHUB_STEP_SUMMARY"

      # CycloneDX SBOM of the npm dependency surface (issue #92): emitted
      # when the contract's security.sbom floor is on. Lands in dist/ so it
      # rides the run artifact below and ships as an attested release asset.
      - name: Read security.sbom contract posture
        if: steps.rel.outputs.release_status == 'released'
        id: sbom_contract
        run: |
          set -euo pipefail
          npx -y -q js-yaml .ai-sdlc.yaml > "$RUNNER_TEMP/contract.json"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")) || {};
            console.log("enabled=" + String((c.security || {}).sbom === true));
          ' "$RUNNER_TEMP/contract.json" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM (npm surface)
        if: steps.rel.outputs.release_status == 'released' && steps.sbom_contract.outputs.enabled == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/ai-sdlc-${{ steps.rel.outputs.release_tag }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Verify SBOM (CycloneDX JSON, fail-closed)
        if: steps.rel.outputs.release_status == 'released' && steps.sbom_contract.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          F="dist/ai-sdlc-${{ steps.rel.outputs.release_tag }}.cdx.json"
          [ -s "$F" ] || { echo "::error::syft produced no SBOM"; exit 1; }
          node -e '
            const d = require(process.argv[1]);
            if (d.bomFormat !== "CycloneDX") throw new Error("SBOM is not CycloneDX JSON");
            console.log("CycloneDX specVersion=" + d.specVersion +
              " components=" + (d.components || []).length);
          ' "$F"

      - name: Publish artifact to the provenance job
        if: steps.rel.outputs.release_status == 'released'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ai-sdlc-${{ steps.rel.outputs.release_tag }}
          path: dist/
          retention-days: 30

  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    if: needs.release.outputs.release_status == 'released'
    permissions:
      contents: write      # attach signature/cert/attestation assets to the release
      id-token: write      # Sigstore OIDC — cosign keyless identity + attestation
      attestations: write  # store the attestation in the repo attestations API
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ai-sdlc-${{ needs.release.outputs.release_tag }}
          path: dist/

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7 — for .ai-sdlc.yaml (release.* contract)

      - name: Read release contract (signing/provenance posture)
        id: contract
        run: |
          set -euo pipefail
          # release.signing / release.provenance gate this job's steps;
          # the resolved default is the secure posture — 'none' opts out.
          npx -y -q js-yaml .ai-sdlc.yaml > "$RUNNER_TEMP/contract.json"
          node -e '
            const c = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")) || {};
            const r = c.release || {};
            console.log("sign=" + String((r.signing || "cosign-keyless") !== "none"));
            console.log("attest=" + String((r.provenance || "attest") !== "none"));
          ' "$RUNNER_TEMP/contract.json" >> "$GITHUB_OUTPUT"

      - name: Install cosign (keyless OIDC signing)
        if: steps.contract.outputs.sign == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Keyless sign-blob: the runner's OIDC token mints a short-lived Fulcio
      # certificate bound to this workflow's identity; the signature + cert +
      # Rekor bundle land next to the artifact. Signing failure = job failure
      # (issue #103: the workflow fails if signing fails).
      - name: Sign artifact (cosign sign-blob, keyless)
        if: steps.contract.outputs.sign == 'true'
        run: |
          set -euo pipefail
          ART="dist/ai-sdlc-${{ needs.release.outputs.release_tag }}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "${ART}.sig" \
            --output-certificate "${ART}.crt" \
            --bundle "${ART}.sigstore.json" \
            "$ART"
          for f in "${ART}.sig" "${ART}.crt" "${ART}.sigstore.json"; do
            [ -s "$f" ] || { echo "::error::cosign did not produce $f"; exit 1; }
          done

      # SLSA L3-class provenance for the release artifacts (issue #100 shape;
      # SBOM subject added by issue #92). Every subject listed gets an
      # attestation — verify downstream with:
      #   gh attestation verify dist/ai-sdlc-<tag>.tar.gz -R os-santiago/ai-sdlc
      - name: Resolve attestation subjects
        if: steps.contract.outputs.attest == 'true'
        id: subj
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.release_tag }}"
          {
            echo 'paths<<AI_SDLC_SUBJECTS'
            echo "dist/ai-sdlc-${TAG}.tar.gz"
            # The SBOM is a subject when the security.sbom contract emitted it.
            [ -f "dist/ai-sdlc-${TAG}.cdx.json" ] && echo "dist/ai-sdlc-${TAG}.cdx.json"
            echo 'AI_SDLC_SUBJECTS'
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: steps.contract.outputs.attest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subj.outputs.paths }}

      - name: Attach artifact + signatures to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release.outputs.release_tag }}"
          # Globs cover the tarball plus .sig/.crt/.sigstore.json when the
          # contract enabled signing, and the .cdx.json SBOM when
          # security.sbom emitted one; the tarball always matches.
          shopt -s nullglob
          files=(dist/"ai-sdlc-${TAG}".tar.gz* dist/"ai-sdlc-${TAG}".cdx.json)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no release artifacts under dist/"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

      # Attach the attestation bundle itself so consumers can verify offline:
      #   gh attestation verify <art> -R <owner>/<repo> \
      #     --bundle <art>.attestation.jsonl --custom-trusted-root <(gh attestation trusted-root)
      - name: Export attestation bundle to the release
        if: steps.contract.outputs.attest == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          ART="dist/ai-sdlc-${TAG}.tar.gz"
          mkdir -p attest && cd attest
          # Bounded retry: the attestation store can lag the attest step.
          for attempt in 1 2 3; do
            gh attestation download "../$ART" -R "$GITHUB_REPOSITORY" && break
            [ "$attempt" -lt 3 ] || { echo "::error::attestation bundle never exported"; exit 1; }
            sleep 10
          done
          shopt -s nullglob
          bundles=(./*.jsonl)
          [ "${#bundles[@]}" -gt 0 ] || { echo "::error::no attestation bundle exported"; exit 1; }
          mv "${bundles[0]}" "ai-sdlc-${TAG}.tar.gz.attestation.jsonl"
          gh release upload "$TAG" "ai-sdlc-${TAG}.tar.gz.attestation.jsonl" --clobber
