name: quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console-deployment-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned fixture dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/console-fixture-venv"
          "$RUNNER_TEMP/console-fixture-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/console-fixture-venv/bin" >> "$GITHUB_PATH"
      - name: Validate actual conditional deployment and owned rollback in disposable kind
        run: python3 tools/verify_console_deployment.py --provider docker --installed-deployer --output "$RUNNER_TEMP/console-deployment"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: console-deployment-kind
          path: |
            ${{ runner.temp }}/console-deployment/report.json
            ${{ runner.temp }}/console-deployment/console-runtime-report.json
            ${{ runner.temp }}/console-deployment/test.log
          if-no-files-found: error
  build-foundation-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Acquire the pinned node image before the bounded startup test
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          image = json.loads(Path('runtime/k8s/deploy/konflux/upstream.lock.json').read_text())['nodeImage']
          subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', image], check=True, timeout=180)
          PY
      - name: Verify original node mount custody using published production migrator
        run: >-
          python3 tools/verify_build_foundation_node.py --provider docker
          --migrator-image quay.io/os-santiago/ai-sdlc@sha256:9b25dfae825ed5a27308f9a2792da8476a560e66b918cc5d34869f306dbdba1d
          --output "$RUNNER_TEMP/build-foundation-node.json"
      - name: Verify public registry node files in an offline disposable container
        run: python3 tools/verify_registry_node_files.py --provider docker --output "$RUNNER_TEMP/registry-node-files"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: registry-node-files
          path: ${{ runner.temp }}/registry-node-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: build-foundation-node
          path: ${{ runner.temp }}/build-foundation-node.json
          if-no-files-found: error
  build-custody-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@802e89cd7394b98352d79117a8b463bbfc2fdacf
        with:
          go-version-file: runtime/k8s/go.mod
          cache-dependency-path: runtime/k8s/go.sum
      - name: Build production installation binary
        working-directory: runtime/k8s
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/build-migrator" ./components/migrator/cmd
      - name: Verify bounded custody initialization and non-destructive reapply
        run: python3 tools/verify_build_install.py --provider docker --binary "$RUNNER_TEMP/build-migrator" --output "$RUNNER_TEMP/build-custody-report.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: build-custody-install
          path: ${{ runner.temp }}/build-custody-report.json
          if-no-files-found: error
  codex-wrapper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate wrapper HTTP boundary and tool-call protocol
        run: |
          python3 -m unittest discover -s runtime/k8s/tools -p 'test_*.py' -v
          python3 -m unittest discover -s tools -p 'test_model_fixture_*.py' -v
  contract:
    runs-on: ubuntu-latest
    # Execution's real PostgreSQL/expiry tests exceeded the 15m package limit.
    # Bound the package at 20m and leave job time for setup and other packages.
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: ai_sdlc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@802e89cd7394b98352d79117a8b463bbfc2fdacf
        with:
          go-version-file: runtime/k8s/go.mod
          cache-dependency-path: runtime/k8s/go.sum
      - name: Install contract validator
        run: |
          python3 -m venv "$RUNNER_TEMP/contract-venv"
          "$RUNNER_TEMP/contract-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/contract-venv/bin" >> "$GITHUB_PATH"
      - name: Validate portable examples and fail-closed validator behavior
        run: bash tools/test-contracts.sh
      - name: Build, vet, and test runtime with a fresh PostgreSQL database
        working-directory: runtime/k8s
        env:
          AI_SDLC_TEST_DATABASE_URL: postgres://postgres:local-ci-only@localhost:5432/ai_sdlc_test?sslmode=disable
        run: |
          set -o pipefail
          go build ./...
          go vet ./...
          go test -json -count=1 -p 1 -timeout=20m ./... | tee "$RUNNER_TEMP/runtime-tests.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: runtime-test-timings
          path: ${{ runner.temp }}/runtime-tests.jsonl
          if-no-files-found: warn
  security-log-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test scripts/security-log.test.js
