# chart — lint, package and test the runtime Helm chart; on main pushes, publish and sign it.
#
# The package job packages runtime/k8s/deploy/helm/ai-sdlc-k8s-runtime at its
# deterministic published version (Chart.yaml version + "+<12-digit
# revision>", OCI tag with "_"), lints and renders the packaged archive, and
# checks the documented Secret contract (docs/operations/helm-chart-secret-contract.md).
#
# On push to main only, the publish job pushes the packaged archive to
# oci://quay.io/os-santiago/ai-sdlc-k8s-runtime, the same namespace as the
# runtime images. It holds no OIDC token. If that public repository does not
# exist yet (creating it is an owner action), it skips with a notice instead
# of failing or pushing to a private repository adopters cannot pull.
#
# The sign job, the only job that may request an OIDC token, re-reads the
# pushed manifest anonymously, checks that its single chart layer is exactly
# the archive the package job built, then signs the manifest digest keyless
# with cosign (GitHub OIDC -> Fulcio -> Rekor). Like the containers workflow's
# sign job it runs no third-party action and no repository code: only the
# first-party artifact download, a checksum-pinned cosign binary and inline
# checks. Tags are never signed. See docs/operations/helm-chart-install.md.
name: chart
on:
  pull_request:
    paths:
      - 'runtime/k8s/deploy/helm/ai-sdlc-k8s-runtime/**'
      - 'docs/operations/helm-chart-*.md'
      - 'tools/chart_release.py'
      - 'tools/test_helm_chart_*.py'
      - 'tools/test_helm.py'
      - 'tools/test_release_helm.py'
      - 'tools/install.py'
      - 'tools/install-tools.lock.json'
      - 'install.sh'
      - '.github/workflows/chart.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/k8s/deploy/helm/ai-sdlc-k8s-runtime/**'
      - 'docs/operations/helm-chart-*.md'
      - 'tools/chart_release.py'
      - 'tools/test_helm_chart_*.py'
      - 'tools/test_helm.py'
      - 'tools/test_release_helm.py'
      - 'tools/install.py'
      - 'tools/install-tools.lock.json'
      - 'install.sh'
      - '.github/workflows/chart.yml'
permissions:
  contents: read
concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install verified client tools and test dependencies
        run: |
          ./install.sh tools > "$RUNNER_TEMP/install-tools.json"
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/chart-venv/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os, pathlib
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AI_SDLC_TEST_HELM=' + tools['helm'] + '\n')
          PY
      - name: Package the chart at its deterministic version
        run: |
          python3 tools/chart_release.py package --helm "$AI_SDLC_TEST_HELM" \
            --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/chart"
          echo "AI_SDLC_TEST_CHART_PACKAGE=$RUNNER_TEMP/chart" >> "$GITHUB_ENV"
      - name: Lint and render the packaged chart; check the Secret contract
        run: |
          python3 -m unittest discover -s tools -p 'test_helm_chart_*.py' -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: chart-package
          path: |
            ${{ runner.temp }}/chart/*.tgz
            ${{ runner.temp }}/chart/chart-release.json
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      published: ${{ steps.push.outputs.published || 'false' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: chart-package
          path: ${{ runner.temp }}/chart
      - name: Check that the public chart repository exists
        id: repository
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          url = 'https://quay.io/api/v1/repository/os-santiago/ai-sdlc-k8s-runtime'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  public = json.load(response).get('is_public') is True
          except urllib.error.HTTPError as error:
              if error.code not in (401, 403, 404):
                  raise
              public = False
          if not public:
              message = ('Chart publication skipped: the public Quay repository quay.io/os-santiago/ai-sdlc-k8s-runtime '
                         'does not exist or is not public. Owner action: create it as a public repository and give the '
                         'CI robot write permission (docs/operations/helm-chart-install.md#owner-action).')
              print('::notice title=Chart not published::' + message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(message + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + ('true' if public else 'false') + '\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.repository.outputs.ready == 'true'
        with:
          path: source
      - name: Install the verified Helm client
        if: steps.repository.outputs.ready == 'true'
        run: |
          ./source/install.sh tools > "$RUNNER_TEMP/install-tools.json"
          python3 - <<'PY'
          import json, os, pathlib
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('HELM=' + tools['helm'] + '\n')
          PY
      - name: Push the packaged chart and record its manifest digest
        id: push
        if: steps.repository.outputs.ready == 'true'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
          CHART_DIR: ${{ runner.temp }}/chart
        run: |
          set -euo pipefail
          printf '%s' "$QUAY_TOKEN" | "$HELM" registry login quay.io --username "$QUAY_USERNAME" --password-stdin
          archive="$(python3 -c 'import json,os,sys; r=json.load(open(os.path.join(os.environ["CHART_DIR"],"chart-release.json"))); sys.stdout.write(r["archive"])')"
          "$HELM" push "$CHART_DIR/$archive" oci://quay.io/os-santiago 2>&1 | tee "$RUNNER_TEMP/push.log"
          "$HELM" registry logout quay.io
          python3 - <<'PY'
          import json, os, pathlib, re
          record = json.loads(pathlib.Path(os.environ['CHART_DIR'], 'chart-release.json').read_text())
          log = pathlib.Path(os.environ['RUNNER_TEMP'], 'push.log').read_text()
          digests = re.findall(r'(?m)^Digest: (sha256:[0-9a-f]{64})\s*$', log)
          assert len(digests) == 1, 'helm push reported no single manifest digest'
          assert record['revision'] == os.environ['GITHUB_SHA']
          assert record['repository'] == 'quay.io/os-santiago/ai-sdlc-k8s-runtime'
          identity = {'chart': record['chart'], 'version': record['version'], 'tag': record['tag'],
                      'repository': record['repository'], 'revision': record['revision'],
                      'digest': digests[0]}
          pathlib.Path(os.environ['RUNNER_TEMP'], 'chart-identity.json').write_text(json.dumps(identity) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('published=true\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.repository.outputs.ready == 'true'
        with:
          name: chart-identity
          path: ${{ runner.temp }}/chart-identity.json
          if-no-files-found: error
          retention-days: 30
  sign:
    # Sign only the reviewed main publication. This job holds the OIDC token,
    # so it runs no third-party action and no repository code: the first-party
    # artifact download, a checksum-pinned cosign binary and inline checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.published == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # Sigstore OIDC for cosign keyless signing; this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: chart-package
          path: ${{ runner.temp }}/chart
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: chart-identity
          path: ${{ runner.temp }}/identity
      - name: Check the pushed manifest is exactly the packaged chart
        id: identity
        env:
          CHART_DIR: ${{ runner.temp }}/chart
          IDENTITY: ${{ runner.temp }}/identity/chart-identity.json
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request
          identity = json.loads(pathlib.Path(os.environ['IDENTITY']).read_text())
          record = json.loads(pathlib.Path(os.environ['CHART_DIR'], 'chart-release.json').read_text())
          assert set(identity) == {'chart', 'version', 'tag', 'repository', 'revision', 'digest'}
          assert identity['chart'] == 'ai-sdlc-k8s-runtime'
          assert identity['repository'] == 'quay.io/os-santiago/ai-sdlc-k8s-runtime'
          assert identity['revision'] == os.environ['GITHUB_SHA']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\+' + os.environ['GITHUB_SHA'][:12], identity['version'])
          assert identity['tag'] == identity['version'].replace('+', '_')
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', identity['digest'])
          assert {key: record[key] for key in ('chart', 'version', 'tag', 'repository', 'revision')} == \
              {key: identity[key] for key in ('chart', 'version', 'tag', 'repository', 'revision')}
          archive = pathlib.Path(os.environ['CHART_DIR'], record['archive'])
          assert archive.name == 'ai-sdlc-k8s-runtime-' + record['version'] + '.tgz'
          data = archive.read_bytes()
          assert len(data) == record['size'] and hashlib.sha256(data).hexdigest() == record['sha256']
          # Anonymous pull: the published repository must be public, and the tag
          # must resolve to the recorded digest whose only layer is this archive.
          name = 'os-santiago/ai-sdlc-k8s-runtime'
          with urllib.request.urlopen('https://quay.io/v2/auth?service=quay.io&scope=repository:' + name + ':pull', timeout=30) as response:
              token = json.load(response)['token']
          request = urllib.request.Request('https://quay.io/v2/' + name + '/manifests/' + identity['tag'], headers={
              'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.oci.image.manifest.v1+json'})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read(1024 * 1024 + 1)
          assert len(raw) <= 1024 * 1024
          assert 'sha256:' + hashlib.sha256(raw).hexdigest() == identity['digest'], 'tag does not resolve to the pushed digest'
          manifest = json.loads(raw)
          assert manifest['config']['mediaType'] == 'application/vnd.cncf.helm.config.v1+json'
          assert len(manifest['layers']) == 1
          layer = manifest['layers'][0]
          assert layer['mediaType'] == 'application/vnd.cncf.helm.chart.content.v1.tar+gzip'
          assert layer['digest'] == 'sha256:' + record['sha256'] and layer['size'] == record['size']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('chart=' + identity['repository'] + '@' + identity['digest'] + '\n')
          PY
      - name: Install the checksum-pinned cosign
        env:
          # Same pin as tools/install-tools.lock.json (test_helm_chart_package.py checks it).
          COSIGN_URL: https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-amd64
          COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/bin/cosign" "$COSIGN_URL"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Authenticate cosign to Quay to store signatures
        # The robot token reaches only the pinned cosign, through stdin.
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_ROBOT_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_ROBOT_TOKEN }}
        run: printf '%s' "$QUAY_TOKEN" | cosign login quay.io --username "$QUAY_USERNAME" --password-stdin
      - name: Sign the chart digest (cosign keyless)
        env:
          CHART: ${{ steps.identity.outputs.chart }}
        run: cosign sign --yes "$CHART"
      - name: Verify the signature as an adopter would
        env:
          CHART: ${{ steps.identity.outputs.chart }}
        run: |
          cosign verify "$CHART" \
            --certificate-identity "https://github.com/os-santiago/ai-sdlc/.github/workflows/chart.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-trigger push \
            --certificate-github-workflow-sha "$GITHUB_SHA" > /dev/null
