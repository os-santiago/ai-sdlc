name: containers
on:
  pull_request:
    paths: ['runtime/k8s/**', '.github/workflows/containers.yml']
  push:
    branches: [main, 'build/**']
    paths: ['runtime/k8s/**', '.github/workflows/containers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [intake, admission-controller, orchestrator, worker, release-manager, relay, verifier, migrator, model-mailbox, artifact-builder]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - name: Authenticate to Quay for trusted publication
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/'))
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}
      - name: Build component
        id: build
        uses: docker/build-push-action@562e51947939164e4fe808a6eab5101977e509e0
        with:
          context: runtime/k8s
          file: runtime/k8s/components/${{ matrix.component }}/Containerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/')) }}
          tags: quay.io/os-santiago/ai-sdlc:${{ matrix.component }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/os-santiago/ai-sdlc
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.component }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Record immutable image identity
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/'))
        env:
          COMPONENT: ${{ matrix.component }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          digest = os.environ['DIGEST']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
          component = os.environ['COMPONENT']
          pathlib.Path(component + '.json').write_text(json.dumps({
              'component': component, 'digest': digest,
              'repository': 'quay.io/os-santiago/ai-sdlc',
              'revision': os.environ['GITHUB_SHA'], 'platform': 'linux/amd64'
          }) + '\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/build/'))
        with:
          name: ${{ matrix.component == 'artifact-builder' && 'supply-chain-image' || 'image' }}-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 30
