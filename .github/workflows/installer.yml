  push:
    branches: [main]
    paths: ['examples/*.local-install.json', 'spec/local-install.schema.json', 'install.sh', 'tools/install*', 'tools/*upgrade*.py', 'tools/validate_feedback_browser_guard.py', 'tools/test_feedback_browser_guard.py', 'tools/*diagnostic*.py', 'tools/*tool_budget*.py', 'tools/*approval_window*.py', 'tools/browser_approval_state.py', 'tools/test_browser_approval.py', 'tools/review_repair_*.py', 'tools/review_feedback_source.py', 'tools/test_review_repair_*.py', 'tools/*reviewer*upgrade*.py', 'tools/*build_foundation*.py', 'tools/build_runtime*.py', 'tools/bootstrap*.py', 'tools/test_bootstrap*.py', 'tools/test_build_runtime*.py', 'tools/candidate_install.py', 'tools/prepared_*.py', 'tools/provenance_runtime_install.py', 'tools/test_prepared_configuration.py', 'tools/supply_chain_install.py', 'tools/managed_registry*.py', 'tools/validate_managed_registry.py', 'tools/*konflux*.py', 'tools/saferus_build_fixture.py', 'tools/test_saferus_build_fixture.py', 'runtime/k8s/internal/artifact/**', 'runtime/k8s/components/artifact-builder/**', 'tools/offline*', 'tools/verify_model_mailbox.py', 'tools/verify_workspace_bundle.py', 'tools/test_workspace_writer.py', 'tools/verify_executor.py', 'tools/verify_executor_tool_budget.py', 'tools/verify_reviewer.py', 'runtime/k8s/internal/reviewresult/**', 'tools/verify_pod_transport.py', 'tools/verify_workspace_transport.py', 'tools/verify_workload_resources.py', 'tools/verify_lifecycle_model.py', 'tools/verify_candidate_runtime.py', 'tools/verify_candidate_credentials.py', 'runtime/k8s/internal/execution/**', 'runtime/k8s/tools/**', 'runtime/k8s/internal/candidate/**', 'runtime/k8s/internal/verification/**', 'tools/verify_verification_recipe.py', 'tools/verify_verification_flow.py', 'tools/prepare_verification_fixture.py', 'tools/fixtures/**', 'runtime/k8s/internal/verificationflow/**', 'runtime/k8s/components/verifier/**', 'tools/verify_generative_pilot.py', 'tools/test_generative_pilot.py', 'runtime/k8s/internal/podtransport/**', 'runtime/k8s/internal/modelbroker/**', 'runtime/k8s/internal/store/**', 'tools/model_fixture_environment.py', 'tools/test_model_fixture_*.py', 'tools/fixture_images.py', 'tools/test_fixture_images.py', 'runtime/k8s/internal/executor/**', 'runtime/k8s/internal/engine/**', 'runtime/k8s/components/worker/**', 'runtime/k8s/internal/workspacebundle/**', 'runtime/k8s/internal/modelmailbox/**', 'runtime/k8s/components/model-mailbox/**', 'runtime/k8s/go.mod', 'runtime/k8s/go.sum', 'tools/test_offline_probe.js', 'tools/github_client.py', 'tools/github_merge_policy.py', 'tools/github_merge_install.py', 'runtime/k8s/internal/mergegate/**', 'tools/network_probe.py', 'tools/verify_release_network.py', 'tools/test_verify_release_network.py', 'tools/test_*install*.py', 'tools/test_helm.py', 'tools/test_release_helm.py', 'tools/release_runtime_install.py', 'tools/release_target*.py', 'tools/initial_activation.py', 'tools/test_initial_activation*.py', 'tools/test_release_target*.py', 'tools/*shadow_intake.py', 'tools/verify_local_install.py', 'runtime/k8s/deploy/**', '.github/workflows/installer.yml']
permissions:
  contents: read
jobs:
  helm-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install verified client tools and test dependencies
        run: |
          ./install.sh tools > "$RUNNER_TEMP/install-tools.json"
          python3 -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/installer-venv/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os, pathlib
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AI_SDLC_TEST_HELM=' + tools['helm'] + '\n')
          PY
      - name: Validate installer boundaries and Helm resources
        run: |
          node --test tools/test_offline_probe.js
          python3 -m unittest discover -s tools -p 'test_*install*.py' -v
          python3 -m unittest discover -s tools -p 'test_runtime_upgrade*.py' -v
          python3 -m unittest discover -s tools -p 'test_upgrade_*.py' -v
          python3 -m unittest discover -s tools -p 'test_diagnostic*.py' -v
          python3 -m unittest discover -s tools -p 'test_tool_budget*.py' -v
          python3 -m unittest discover -s tools -p 'test_approval_window.py' -v
          python3 -m unittest discover -s tools -p 'test_browser_approval.py' -v
          python3 -m unittest discover -s tools -p 'test_reviewer_upgrade.py' -v
          python3 -m unittest discover -s tools -p 'test_review_feedback_upgrade.py' -v
          python3 -m unittest discover -s tools -p 'test_review_repair_*.py' -v
          python3 -m unittest discover -s tools -p 'test_feedback_browser_guard.py' -v
          python3 -m unittest discover -s tools -p 'test_lifecycle_diagnostics.py' -v
          python3 -m unittest discover -s tools -p test_helm.py -v
          python3 -m unittest discover -s tools -p test_provenance_helm.py -v
          python3 -m unittest discover -s tools -p test_release_helm.py -v
          python3 -m unittest discover -s tools -p 'test_release_target*.py' -v
          python3 -m unittest discover -s tools -p 'test_initial_activation*.py' -v
          python3 -m unittest discover -s tools -p test_verify_release_network.py -v
          python3 -m unittest discover -s tools -p test_bootstrap_prepare.py -v
          python3 -m unittest discover -s tools -p test_prepared_configuration.py -v
          python3 -m unittest discover -s tools -p test_build_foundation_state.py -v
          python3 -m unittest discover -s tools -p test_build_foundation_node.py -v
          python3 -m unittest discover -s tools -p test_build_foundation_fixture.py -v
          python3 -m unittest discover -s tools -p test_build_foundation_resources.py -v
          python3 -m unittest discover -s tools -p test_verify_shadow_intake.py -v
          python3 -m unittest discover -s tools -p test_workspace_writer.py -v
          python3 -m unittest discover -s tools -p test_fixture_images.py -v
          python3 -m unittest discover -s tools -p 'test_model_fixture_*.py' -v
          python3 -m unittest discover -s tools -p 'test_konflux*.py' -v
          python3 -m unittest discover -s tools -p 'test_saferus_build_fixture.py' -v
      - name: Install and reconcile the same local desired state twice
        run: |
          sudo ./install.sh host --configure-host
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(pathlib.Path('examples/homedir.local-install.json').read_text())
          config.update(cluster='ai-sdlc', repository='os-santiago/ai-sdlc', provider='docker',
                        profile='maintenance', images=str(pathlib.Path('runtime/k8s/deploy/local/images.lock.json').resolve()))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'local-install.json').write_text(json.dumps(config))
          PY
          ./install.sh plan --config "$RUNNER_TEMP/local-install.json"
          ./install.sh local --config "$RUNNER_TEMP/local-install.json" --timeout 10m
          python3 tools/verify_local_install.py --provider docker
          ./install.sh local --config "$RUNNER_TEMP/local-install.json" --timeout 10m
          ./install.sh status --config "$RUNNER_TEMP/local-install.json"
      - name: Verify original foundation resources through the Kubernetes API
        run: |
          python3 tools/verify_build_foundation_resources.py --cluster ai-sdlc \
            --output "$RUNNER_TEMP/build-foundation-resources"
      - name: Verify browser residual-work denial on the owned kind cluster
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          state = pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc'
          k = [tools['kubectl'], '--kubeconfig', str(state / 'kubeconfig'), '--context', 'kind-ai-sdlc', '--request-timeout=10s']
          cluster = json.loads(subprocess.check_output(k + ['get', 'namespace', 'kube-system', '-o', 'json'], timeout=15))['metadata']['uid']
          images = json.loads(pathlib.Path('runtime/k8s/deploy/local/images.lock.json').read_text())
          subprocess.run([sys.executable, 'tools/validate_feedback_browser_guard.py', '--kubectl', tools['kubectl'],
                          '--kubeconfig', str(state / 'kubeconfig'), '--context', 'kind-ai-sdlc', '--cluster-uid', cluster,
                          '--image', images['image']['repository'] + '@' + images['components']['worker']['digest'],
                          '--output', str(pathlib.Path(os.environ['RUNNER_TEMP'], 'feedback-browser-guard'))], check=True, timeout=300)
          PY
      - name: Preserve browser residual-work evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: feedback-browser-guard
          path: ${{ runner.temp }}/feedback-browser-guard/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve foundation resource evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-foundation-resource-conformance
          path: ${{ runner.temp }}/build-foundation-resources/
          retention-days: 14
      - name: Verify and reconcile the offline executor runtime
        run: |
          ./install.sh sandbox --config "$RUNNER_TEMP/local-install.json"
          ./install.sh sandbox --config "$RUNNER_TEMP/local-install.json"
  kind-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Independent kind scenarios run in parallel, each on its own disposable
    # cluster; the installer job above keeps the install/reconcile coverage.
    strategy:
      fail-fast: false
      matrix:
        group: [executor, transport, review]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: ai_sdlc_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare disposable kind, offline runtime and fixture images
        run: |
          ./install.sh tools > "$RUNNER_TEMP/install-tools.json"
          python3 -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/installer-venv/bin" >> "$GITHUB_PATH"
          sudo ./install.sh host --configure-host
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(pathlib.Path('examples/homedir.local-install.json').read_text())
          config.update(cluster='ai-sdlc', repository='os-santiago/ai-sdlc', provider='docker',
                        profile='maintenance', images=str(pathlib.Path('runtime/k8s/deploy/local/images.lock.json').resolve()))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'local-install.json').write_text(json.dumps(config))
          PY
          ./install.sh local --config "$RUNNER_TEMP/local-install.json" --timeout 10m
          ./install.sh sandbox --config "$RUNNER_TEMP/local-install.json"
          # Export canonical OCI directly to kind; Docker save may synthesize a
          # different manifest for the same config. The host copy renders fixtures.
          docker buildx create --name ai-sdlc-fixtures --driver docker-container
          for component in model-mailbox worker; do
            docker buildx build --builder ai-sdlc-fixtures --provenance=false --load \
              --output "type=oci,name=localhost/ai-sdlc-${component}:conformance,dest=$RUNNER_TEMP/${component}.oci" \
              -f "runtime/k8s/components/${component}/Containerfile" -t "localhost/ai-sdlc-${component}:conformance" runtime/k8s
            docker exec -i ai-sdlc-control-plane ctr -n k8s.io images import --local --digests - < "$RUNNER_TEMP/${component}.oci"
          done
          git init -q "$RUNNER_TEMP/homedir-source"
          git -C "$RUNNER_TEMP/homedir-source" fetch -q --depth 1 https://github.com/os-santiago/homedir.git 0622cdaeb59a11a27bd5f3d7e18183c401a5e412
      - name: Verify the bounded mailbox with SCC in the offline runtime
        if: matrix.group == 'executor'
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          subprocess.run([sys.executable, 'tools/verify_model_mailbox.py', '--kubectl', tools['kubectl'],
                          '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig'),
                          '--mailbox-image', 'localhost/ai-sdlc-model-mailbox:conformance'], check=True)
          PYTHON
      - name: Round-trip pinned Homedir source through the offline workspace helper
        if: matrix.group == 'executor'
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          subprocess.run([sys.executable, 'tools/verify_workspace_bundle.py', '--kubectl', tools['kubectl'],
                          '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig'),
                          '--mailbox-image', 'localhost/ai-sdlc-model-mailbox:conformance',
                          '--source-repository', str(pathlib.Path(os.environ['RUNNER_TEMP'], 'homedir-source')),
                          '--source-sha', '0622cdaeb59a11a27bd5f3d7e18183c401a5e412'], check=True)
          PYTHON
      - name: Verify the fixed SCC executor and adversarial source configuration
        if: matrix.group == 'executor'
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys, tarfile
          sys.path.insert(0, 'tools')
          from fixture_images import register_digest
          from verify_executor import VARIANTS, verify
          from verify_workspace_bundle import source_bundle
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          worker_tag = 'localhost/ai-sdlc-worker:conformance'
          mailbox_tag = 'localhost/ai-sdlc-model-mailbox:conformance'
          worker = register_digest('docker', 'ai-sdlc-control-plane', worker_tag)
          mailbox = register_digest('docker', 'ai-sdlc-control-plane', mailbox_tag)
          for component, reference in (('worker', worker), ('model-mailbox', mailbox)):
              with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'], component + '.oci')) as exported:
                  member = exported.getmember('index.json')
                  if not member.isfile() or member.size > 65536:
                      raise ValueError('Invalid fixture OCI index')
                  manifests = json.load(exported.extractfile(member))['manifests']
              if len(manifests) != 1 or reference.rsplit('@', 1)[1] != manifests[0]['digest']:
                  raise ValueError('Imported fixture descriptor differs from OCI export')
          print(json.dumps({'fixtureImages': {'worker': worker, 'mailbox': mailbox}}), flush=True)
          source = source_bundle(pathlib.Path(os.environ['RUNNER_TEMP'], 'homedir-source'),
                                 '0622cdaeb59a11a27bd5f3d7e18183c401a5e412')
          kubectl = [tools['kubectl'], '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig')]
          for variant in VARIANTS:
              print(json.dumps(verify(kubectl, 'docker', mailbox_tag, mailbox, worker, source, variant)), flush=True)
          PYTHON
      - name: Reject false success from untrusted candidate validation
        if: matrix.group == 'executor'
        run: |
          AI_SDLC_TEST_ORACLE_IMAGE="$(docker image inspect localhost/ai-sdlc-worker:conformance --format '{{.Id}}')"
          export AI_SDLC_TEST_ORACLE_IMAGE
          export AI_SDLC_TEST_ORACLE_PROVIDER=docker
          export AI_SDLC_TEST_HOMEDIR_SOURCE="$RUNNER_TEMP/homedir-source"
          python3 -m unittest discover -s tools -p test_generative_pilot.py -v
      - uses: actions/setup-go@802e89cd7394b98352d79117a8b463bbfc2fdacf
        if: matrix.group != 'executor'
        with:
          go-version-file: runtime/k8s/go.mod
          cache-dependency-path: runtime/k8s/go.sum
      - name: Verify separate SCC tool and model-call budgets
        if: matrix.group == 'executor'
        run: |
          executor_image="$(docker image inspect localhost/ai-sdlc-worker:conformance --format '{{.Id}}')"
          python3 tools/verify_executor_tool_budget.py --provider docker --image "$executor_image" > "$RUNNER_TEMP/executor-tool-budget-report.json"
      - name: Build the isolated Kubernetes transport test driver
        if: matrix.group == 'transport' || matrix.group == 'review'
        working-directory: runtime/k8s
        run: |
          CGO_ENABLED=0 go test -c ./internal/podtransport -o "$RUNNER_TEMP/pod-transport.test"
          CGO_ENABLED=0 go test -c ./internal/execution -o "$RUNNER_TEMP/execution.test"
          CGO_ENABLED=0 go test -c ./internal/verificationflow -o "$RUNNER_TEMP/verifier.test"
      - name: Verify actual Kubernetes handoff, RBAC denial and Pod replacement
        if: matrix.group == 'transport'
        env:
          AI_SDLC_TEST_SOURCE_TOKEN: ${{ github.token }}
          AI_SDLC_TEST_DATABASE_URL: postgres://postgres:local-ci-only@127.0.0.1:5432/ai_sdlc_test?sslmode=disable
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          from fixture_images import register_digest
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          worker = register_digest('docker', 'ai-sdlc-control-plane', 'localhost/ai-sdlc-worker:conformance')
          mailbox = register_digest('docker', 'ai-sdlc-control-plane', 'localhost/ai-sdlc-model-mailbox:conformance')
          arguments = ['--kubectl', tools['kubectl'],
                       '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig'),
                       '--worker-image', worker, '--mailbox-image', mailbox,
                       '--test-binary', str(pathlib.Path(os.environ['RUNNER_TEMP'], 'pod-transport.test')),
                       '--source-repository', str(pathlib.Path(os.environ['RUNNER_TEMP'], 'homedir-source')),
                       '--source-sha', '0622cdaeb59a11a27bd5f3d7e18183c401a5e412']
          for fixture in ('pod_transport', 'workspace_transport', 'workload_resources', 'lifecycle_model'):
              selected = arguments.copy()
              if fixture == 'lifecycle_model':
                  selected[selected.index('--test-binary') + 1] = str(pathlib.Path(os.environ['RUNNER_TEMP'], 'execution.test'))
              extra = [] if fixture in ('workload_resources', 'lifecycle_model') else ['--provider', 'docker', '--render-image', 'localhost/ai-sdlc-model-mailbox:conformance']
              scenarios = ('success', 'three-turns', 'provider-failure', 'cancel-provider', 'no-change', 'no-change-store-failure') if fixture == 'lifecycle_model' else ('success',)
              for scenario in scenarios:
                  scenario_args = ['--scenario', scenario] if fixture == 'lifecycle_model' else []
                  result = subprocess.run([sys.executable, f'tools/verify_{fixture}.py'] + selected + extra + scenario_args,
                                          capture_output=True, text=True, timeout=180)
                  if result.returncode:
                      # Fixture diagnostics are sanitized at their source; retain a
                      # bounded tail so integration failures are actually reviewable.
                      print(result.stdout[-8000:], end='')
                      print(result.stderr[-8000:], end='', file=sys.stderr)
                      raise SystemExit(result.returncode)
                  print(result.stdout, end='')
                  suffix = '' if scenario == 'success' else '-' + scenario
                  pathlib.Path(os.environ['RUNNER_TEMP'], f'{fixture}{suffix}-report.json').write_text(result.stdout)
          from verify_candidate_credentials import verify as verify_credentials
          credential_report = verify_credentials([tools['kubectl'], '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig')], worker)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-credentials-report.json').write_text(json.dumps(credential_report, indent=2))
          selected = arguments.copy()
          selected[selected.index('--test-binary') + 1] = str(pathlib.Path(os.environ['RUNNER_TEMP'], 'execution.test'))
          index = selected.index('--source-repository')
          del selected[index:index+2]
          for scenario in ('success', 'crash-after-model-start'):
              result = subprocess.run([sys.executable, 'tools/verify_candidate_runtime.py'] + selected + ['--scenario', scenario], capture_output=True, text=True, timeout=240)
              if result.returncode:
                  print(result.stderr[-8000:], file=sys.stderr)
                  raise SystemExit(result.returncode)
              print(result.stdout, end='')
              pathlib.Path(os.environ['RUNNER_TEMP'], f'candidate-runtime-{scenario}-report.json').write_text(result.stdout)
          PYTHON
      - name: Verify independent read-only SCC reviewer and verdict rejection
