name: installer
on:
  pull_request:
    paths: ['install.sh', 'tools/install*', 'tools/test_install.py', 'tools/test_helm.py', 'tools/verify_local_install.py', 'runtime/k8s/deploy/**', '.github/workflows/installer.yml']
  push:
    branches: [main]
    paths: ['install.sh', 'tools/install*', 'tools/test_install.py', 'tools/test_helm.py', 'tools/verify_local_install.py', 'runtime/k8s/deploy/**', '.github/workflows/installer.yml']
permissions:
  contents: read
jobs:
  helm-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install verified client tools and test dependencies
        run: |
          ./install.sh tools > "$RUNNER_TEMP/install-tools.json"
          python3 -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/installer-venv/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os, pathlib
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AI_SDLC_TEST_HELM=' + tools['helm'] + '\n')
          PY
      - name: Validate installer boundaries and Helm resources
        run: python3 -m unittest discover -s tools -p 'test_*install*.py' -v && python3 -m unittest discover -s tools -p test_helm.py -v
      - name: Install and reconcile the same local desired state twice
        run: |
          ./install.sh local --provider docker --timeout 10m
          python3 tools/verify_local_install.py --provider docker
          ./install.sh status --provider docker
