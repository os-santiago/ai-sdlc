name: installer
on:
  pull_request:
    paths: ['examples/*.local-install.json', 'spec/local-install.schema.json', 'install.sh', 'tools/install*', 'tools/offline*', 'tools/verify_model_mailbox.py', 'tools/verify_workspace_bundle.py', 'tools/verify_executor.py', 'tools/fixture_images.py', 'runtime/k8s/internal/executor/**', 'runtime/k8s/internal/engine/**', 'runtime/k8s/components/worker/**', 'runtime/k8s/internal/workspacebundle/**', 'runtime/k8s/internal/modelmailbox/**', 'runtime/k8s/components/model-mailbox/**', 'runtime/k8s/go.mod', 'runtime/k8s/go.sum', 'tools/test_offline_probe.js', 'tools/github_client.py', 'tools/network_probe.py', 'tools/test_*install*.py', 'tools/test_helm.py', 'tools/*shadow_intake.py', 'tools/verify_local_install.py', 'runtime/k8s/deploy/**', '.github/workflows/installer.yml']
  push:
    branches: [main]
    paths: ['examples/*.local-install.json', 'spec/local-install.schema.json', 'install.sh', 'tools/install*', 'tools/offline*', 'tools/verify_model_mailbox.py', 'tools/verify_workspace_bundle.py', 'tools/verify_executor.py', 'tools/fixture_images.py', 'runtime/k8s/internal/executor/**', 'runtime/k8s/internal/engine/**', 'runtime/k8s/components/worker/**', 'runtime/k8s/internal/workspacebundle/**', 'runtime/k8s/internal/modelmailbox/**', 'runtime/k8s/components/model-mailbox/**', 'runtime/k8s/go.mod', 'runtime/k8s/go.sum', 'tools/test_offline_probe.js', 'tools/github_client.py', 'tools/network_probe.py', 'tools/test_*install*.py', 'tools/test_helm.py', 'tools/*shadow_intake.py', 'tools/verify_local_install.py', 'runtime/k8s/deploy/**', '.github/workflows/installer.yml']
permissions:
  contents: read
jobs:
  helm-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install verified client tools and test dependencies
        run: |
          ./install.sh tools > "$RUNNER_TEMP/install-tools.json"
          python3 -m venv "$RUNNER_TEMP/installer-venv"
          "$RUNNER_TEMP/installer-venv/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/installer-venv/bin" >> "$GITHUB_PATH"
          python3 - <<'PY'
          import json, os, pathlib
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('AI_SDLC_TEST_HELM=' + tools['helm'] + '\n')
          PY
      - name: Validate installer boundaries and Helm resources
        run: |
          node --test tools/test_offline_probe.js
          python3 -m unittest discover -s tools -p 'test_*install*.py' -v
          python3 -m unittest discover -s tools -p test_helm.py -v
          python3 -m unittest discover -s tools -p test_verify_shadow_intake.py -v
      - name: Install and reconcile the same local desired state twice
        run: |
          sudo ./install.sh host --configure-host
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(pathlib.Path('examples/homedir.local-install.json').read_text())
          config.update(cluster='ai-sdlc', repository='os-santiago/ai-sdlc', provider='docker',
                        profile='maintenance', images=str(pathlib.Path('runtime/k8s/deploy/local/images.lock.json').resolve()))
          pathlib.Path(os.environ['RUNNER_TEMP'], 'local-install.json').write_text(json.dumps(config))
          PY
          ./install.sh plan --config "$RUNNER_TEMP/local-install.json"
          ./install.sh local --config "$RUNNER_TEMP/local-install.json" --timeout 10m
          python3 tools/verify_local_install.py --provider docker
          ./install.sh local --config "$RUNNER_TEMP/local-install.json" --timeout 10m
          ./install.sh status --config "$RUNNER_TEMP/local-install.json"
      - name: Verify and reconcile the offline executor runtime
        run: |
          ./install.sh sandbox --config "$RUNNER_TEMP/local-install.json"
          ./install.sh sandbox --config "$RUNNER_TEMP/local-install.json"
      - name: Verify the bounded mailbox with SCC in the offline runtime
        run: |
          docker build -f runtime/k8s/components/model-mailbox/Containerfile -t localhost/ai-sdlc-model-mailbox:conformance runtime/k8s
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          image = 'localhost/ai-sdlc-model-mailbox:conformance'
          subprocess.run([tools['kind'], 'load', 'docker-image', image, '--name', 'ai-sdlc'], check=True)
          subprocess.run([sys.executable, 'tools/verify_model_mailbox.py', '--kubectl', tools['kubectl'],
                          '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig'),
                          '--mailbox-image', image], check=True)
          PYTHON
      - name: Round-trip pinned Homedir source through the offline workspace helper
        run: |
          git init -q "$RUNNER_TEMP/homedir-source"
          git -C "$RUNNER_TEMP/homedir-source" fetch -q --depth 1 https://github.com/os-santiago/homedir.git 0622cdaeb59a11a27bd5f3d7e18183c401a5e412
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          subprocess.run([sys.executable, 'tools/verify_workspace_bundle.py', '--kubectl', tools['kubectl'],
                          '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig'),
                          '--mailbox-image', 'localhost/ai-sdlc-model-mailbox:conformance',
                          '--source-repository', str(pathlib.Path(os.environ['RUNNER_TEMP'], 'homedir-source')),
                          '--source-sha', '0622cdaeb59a11a27bd5f3d7e18183c401a5e412'], check=True)
          PYTHON
      - name: Verify the fixed SCC executor and adversarial source configuration
        run: |
          docker build -f runtime/k8s/components/worker/Containerfile -t localhost/ai-sdlc-worker:conformance runtime/k8s
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'tools')
          from fixture_images import register_digest
          from verify_executor import VARIANTS, verify
          from verify_workspace_bundle import source_bundle
          tools = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'install-tools.json').read_text())
          worker_tag = 'localhost/ai-sdlc-worker:conformance'
          mailbox_tag = 'localhost/ai-sdlc-model-mailbox:conformance'
          subprocess.run([tools['kind'], 'load', 'docker-image', worker_tag, '--name', 'ai-sdlc'], check=True)
          worker = register_digest('docker', 'ai-sdlc-control-plane', worker_tag)
          mailbox = register_digest('docker', 'ai-sdlc-control-plane', mailbox_tag)
          source = source_bundle(pathlib.Path(os.environ['RUNNER_TEMP'], 'homedir-source'),
                                 '0622cdaeb59a11a27bd5f3d7e18183c401a5e412')
          kubectl = [tools['kubectl'], '--kubeconfig', str(pathlib.Path.home() / '.local/state/ai-sdlc/ai-sdlc/kubeconfig')]
          for variant in VARIANTS:
              print(json.dumps(verify(kubectl, 'docker', mailbox_tag, mailbox, worker, source, variant)), flush=True)
          PYTHON
