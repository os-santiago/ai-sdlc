name: installer
on:
  pull_request:
    paths: ['examples/*.local-install.json', 'spec/local-install.schema.json', 'install.sh', 'tools/install*', 'tools/*upgrade*.py', 'tools/validate_feedback_browser_guard.py', 'tools/test_feedback_browser_guard.py', 'tools/*diagnostic*.py', 'tools/*tool_budget*.py', 'tools/*approval_window*.py', 'tools/browser_approval_state.py', 'tools/test_browser_approval.py', 'tools/review_repair_*.py', 'tools/review_feedback_source.py', 'tools/test_review_repair_*.py', 'tools/*reviewer*upgrade*.py', 'tools/*build_foundation*.py', 'tools/build_runtime*.py', 'tools/bootstrap*.py', 'tools/test_bootstrap*.py', 'tools/test_build_runtime*.py', 'tools/candidate_install.py', 'tools/prepared_*.py', 'tools/provenance_runtime_install.py', 'tools/test_prepared_configuration.py', 'tools/supply_chain_install.py', 'tools/managed_registry*.py', 'tools/validate_managed_registry.py', 'tools/*konflux*.py', 'tools/saferus_build_fixture.py', 'tools/test_saferus_build_fixture.py', 'runtime/k8s/internal/artifact/**', 'runtime/k8s/components/artifact-builder/**', 'tools/offline*', 'tools/verify_model_mailbox.py', 'tools/verify_workspace_bundle.py', 'tools/test_workspace_writer.py', 'tools/verify_executor.py', 'tools/verify_executor_tool_budget.py', 'tools/verify_reviewer.py', 'runtime/k8s/internal/reviewresult/**', 'tools/verify_pod_transport.py', 'tools/verify_workspace_transport.py', 'tools/verify_workload_resources.py', 'tools/verify_lifecycle_model.py', 'tools/verify_candidate_runtime.py', 'tools/verify_candidate_credentials.py', 'runtime/k8s/internal/execution/**', 'runtime/k8s/tools/**', 'runtime/k8s/internal/candidate/**', 'runtime/k8s/internal/verification/**', 'tools/verify_verification_recipe.py', 'tools/verify_verification_flow.py', 'tools/prepare_verification_fixture.py', 'tools/fixtures/**', 'runtime/k8s/internal/verificationflow/**', 'runtime/k8s/components/verifier/**', 'tools/verify_generative_pilot.py', 'tools/test_generative_pilot.py', 'runtime/k8s/internal/podtransport/**', 'runtim