# ai-sdlc-intake — reusable intake stage (issue #8)
#
# Resolves the repo contract (.ai-sdlc.yaml, issue #22), validates DoR on a
# labeled issue and hands off to implementation. Trigger label and skip
# labels come from the contract; inputs are override-only.
# Caller usage (in the consuming repo):
#
#   name: ai-sdlc
#   on:
#     issues: { types: [labeled] }
#   jobs:
#     intake:
#       uses: os-santiago/ai-sdlc/.github/workflows/ai-sdlc-intake.yml@main
#       with:
#         repo: ${{ github.repository }}
#         issue_number: ${{ github.event.issue.number }}
#       secrets:   # explicit map — pass only what this stage declares (#137)
#         AI_SDLC_TOKEN: ${{ secrets.AI_SDLC_TOKEN }}                    # optional cross-repo token
#         AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}                  # optional — App pair preferred
#         AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
#         AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}          # optional ledger signing
name: ai-sdlc-intake

on:
  workflow_call:
    inputs:
      repo:
        description: 'owner/repo being processed'
        type: string
        required: true
      issue_number:
        description: 'issue to validate and queue'
        type: number
        required: true
      trigger_label:
        description: 'label that arms dispatch — override; empty = .ai-sdlc.yaml triggers.issue_label'
        type: string
        default: ''
      org_config:
        description: 'org baseline contract ref owner/repo[/path][@ref] — org floor per spec/org-policy.md; empty = repo contract + defaults'
        type: string
        default: ''
      runtime_ref:
        description: 'ref of os-santiago/ai-sdlc to fetch runtime scripts (intake-refiner.js, dup-detector.js, epic-decomposer.js) from — pin to the same ref as this workflow'
        type: string
        default: 'main'
    outputs:
      dispatch:
        description: '"true" when the issue passes DoR and is queued'
        value: ${{ jobs.intake.outputs.dispatch }}
      ledger_head:
        description: 'sealed run-ledger chain head — pass to the next stage as ledger_head (issue #196)'
        value: ${{ jobs.intake.outputs.ledger_head }}
    secrets:
      AI_SDLC_TOKEN:
        description: 'PAT/App token — needed when GITHUB_TOKEN lacks cross-repo issue access'
        required: false
      AI_SDLC_APP_ID:
        description: 'ai-sdlc GitHub App id — mints a per-run installation token for labels/comments; optional (falls back to AI_SDLC_TOKEN/GITHUB_TOKEN, issue #26)'
        required: false
      AI_SDLC_APP_PRIVATE_KEY:
        description: 'ai-sdlc GitHub App private key (PEM) — pairs with AI_SDLC_APP_ID'
        required: false
      AI_SDLC_LEDGER_KEY:
        description: 'run-ledger signing key (PEM; Ed25519/RSA) — seals stage evidence; absent = unsigned seal (issue #196)'
        required: false

env:
  GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
  REPO: ${{ inputs.repo }}
  ISSUE: ${{ inputs.issue_number }}

permissions:
  issues: write
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # One intake pass per issue at a time — refinement's upsert and the
      # hold→re-arm transitions must not race a second event (edit, reply,
      # re-label) mid-flight. Queued, never cancelled: a re-arm event must
      # run to completion or the restored trigger never reaches DoR.
      group: ai-sdlc-intake-${{ inputs.repo }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    outputs:
      dispatch: ${{ steps.dor.outputs.dispatch }}
      ledger_head: ${{ steps.seal.outputs.head || steps.ledger.outputs.head }}
    steps:
      # Pre-dispatch authorization gate (issue #172): one engaged channel —
      # vars.AI_SDLC_KILL/AI_SDLC_OFF, or an open ai-sdlc:off issue in the
      # control/target repo — fails this step and every later step skips.
      # Fail-closed: an unreadable channel denies too.
      - name: Autonomy gate — org kill-switch
        id: kill
        uses: os-santiago/ai-sdlc/.github/actions/autonomy-gate@main
        with:
          repo: ${{ inputs.repo }}
          kill-var: ${{ vars.AI_SDLC_KILL }}
          off-var: ${{ vars.AI_SDLC_OFF }}
          control-repo: ${{ vars.AI_SDLC_CONTROL_REPO }}

      - name: Resolve contract (.ai-sdlc.yaml)
        id: contract
        uses: os-santiago/ai-sdlc/.github/actions/load-config@main
        with:
          repo: ${{ inputs.repo }}
          checkout: 'true'
          token: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          org-config: ${{ inputs.org_config }}
          overrides: >-
            {"triggers.issue_label": ${{ toJSON(inputs.trigger_label) }}}

      - name: Mint ai-sdlc App installation token
        id: app-token
        if: ${{ !cancelled() }}
        uses: os-santiago/ai-sdlc/.github/actions/mint-app-token@main
        continue-on-error: true
        with:
          repo: ${{ inputs.repo }}
          app-id: ${{ secrets.AI_SDLC_APP_ID }}
          app-private-key: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
          require-creds: 'false'
          scope: 'none'

      - name: Contract error → not-ready + comment (no dispatch)
        if: failure() && steps.contract.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ERR="$(head -c 3000 "$RUNNER_TEMP/ai-sdlc-contract/error.txt" 2>/dev/null || echo 'unknown error — see workflow logs')"
          gh issue edit "$ISSUE" -R "$REPO" --add-label "scc:not-ready" || true
          cat > comment.md <<EOF
          🛡️ **AI-SDLC intake — \`scc:config-error\`:** the repo contract could not be resolved, so this issue was **not dispatched**.

          \`\`\`
          ${ERR}
          \`\`\`

          Fix \`.ai-sdlc.yaml\` (validate locally with \`tools/validate-ai-sdlc-config.sh\`), then re-apply the trigger label.
          EOF
          gh issue comment "$ISSUE" -R "$REPO" --body-file comment.md

      # Conversational refinement (issue #197): spec-completeness check →
      # one upserted comment (clarifying questions when under-specified,
      # derived acceptance criteria when ready) + the refinement-hold
      # label. Runs BEFORE the DoR gate so a hold strips the trigger first
      # (labels.md F2) and the armed check stays honest. Idempotent by
      # content fingerprint — an edit or author reply re-triggers it.
      # Trusted code only: canonical refiner from the runtime repo pin —
      # never from the consumer repo (same posture as ai-sdlc-classify).
      - name: Fetch intake refiner (trusted runtime pin)
        id: refine-fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: scripts/intake-refiner.js
          ref: ${{ inputs.runtime_ref }}
          dest: ${{ runner.temp }}/ai-sdlc-refine
          label: intake refiner
          fallback: skipping refinement

      - name: Refine spec (conversational intake)
        id: refine
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          FETCHED: ${{ steps.refine-fetch.outputs.fetched }}
          TRIGGER: ${{ steps.contract.outputs.trigger_label }}
          SKIP_LABELS: ${{ steps.contract.outputs.skip_labels }}
          NOT_READY: ${{ steps.contract.outputs.label_not_ready }}
          LABELS_MAP: ${{ steps.contract.outputs.labels }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ai-sdlc-refine"
          mkdir -p "$WORK"
          if [ "$FETCHED" != "true" ]; then
            { echo "status=skipped"; echo "fingerprint="; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Labels that veto trigger restoration: contract skip labels ∪
          # active run-state bindings (labels.md F4/F5).
          VETO=$(jq -nc --argjson s "$SKIP_LABELS" --argjson m "$LABELS_MAP" \
            '($s + [$m["queued"], $m["in-progress"], $m["pr-opened"]] | map(select(. != null))) | unique')

          # Fail-open: refinement is additive intelligence, not a dispatch
          # gate — a refiner error must not wedge an otherwise DoR-ready
          # issue (the R1–R6 check below still gates dispatch).
          if ! node "$WORK/scripts/intake-refiner.js" \
              --repo "$REPO" --issue "$ISSUE" \
              --trigger "$TRIGGER" --hold "$NOT_READY" \
              --skip-labels "$SKIP_LABELS" --veto-labels "$VETO" \
              --apply --json --github-output > "$WORK/refine.out" 2>"$WORK/refine.err"; then
            echo "::warning::intake refiner failed ($(head -c 200 "$WORK/refine.err")) — continuing to DoR"
            { echo "status=error"; echo "fingerprint="; } >> "$GITHUB_OUTPUT"
          fi
          cat "$WORK/refine.out" || true

      # Duplicate detection (issue #161, epic #147): deterministic,
      # embedding-free similarity — normalized token Jaccard weighted
      # toward titles + marker-key matching (postmortem signatures,
      # epic-child keys) — scores the issue against the open backlog and
      # reports likely duplicates in ONE fingerprinted upsert comment.
      # Advisory only: never closes an issue, never applies the
      # `duplicate` label (spec/labels.md T10 — `dedup`/`human` own that
      # transition). Fail-open like the refiner: additive intelligence,
      # not a dispatch gate.
      # Trusted code only: canonical detector from the runtime repo
      # pin — never from the consumer repo (same trust boundary as
      # classify/refine).
      - name: Fetch dup detector (trusted runtime pin)
        id: dup-fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: scripts/dup-detector.js
          ref: ${{ inputs.runtime_ref }}
          dest: ${{ runner.temp }}/ai-sdlc-dup
          label: dup detector
          fallback: skipping dedup scan

      - name: Duplicate scan (backlog dedup)
        id: dup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          FETCHED: ${{ steps.dup-fetch.outputs.fetched }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ai-sdlc-dup"
          mkdir -p "$WORK"
          if [ "$FETCHED" != "true" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! node "$WORK/scripts/dup-detector.js" \
              --repo "$REPO" --issue "$ISSUE" \
              --apply --json --github-output > "$WORK/dup.out" 2>"$WORK/dup.err"; then
            echo "::warning::dup scan failed ($(head -c 200 "$WORK/dup.err")) — continuing to DoR"
            echo "status=error" >> "$GITHUB_OUTPUT"
          fi
          cat "$WORK/dup.out" || true

      # Epic intake (issue #198): the `epic` label is terminal — never
      # dispatched (spec/labels.md T10) — so instead of the DoR gate the
      # issue is decomposed into bounded `scc:child` sub-issues, each filed
      # with acceptance criteria + a parent marker, and the epic body gets a
      # live checklist. Idempotent on re-runs via the marker index.
      - name: Epic decomposition (epic-labeled issues)
        id: epic
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue view "$ISSUE" -R "$REPO" --json number,title,body,labels > issue.json
          if ! jq -e '[.labels[].name | ascii_downcase] | index("epic")' issue.json >/dev/null; then
            echo "is_epic=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "is_epic=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=ai-sdlc intake::issue #$ISSUE carries 'epic' — decomposing into scc:child sub-issues instead of DoR dispatch"

      # Trusted code only: the decomposer is fetched from the runtime
      # pin (inputs.runtime_ref), never from the consumer checkout —
      # same trust boundary as classify/verify.
      - name: Fetch epic decomposer (trusted runtime pin)
        id: epic-fetch
        if: steps.epic.outputs.is_epic == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: scripts/epic-decomposer.js
          ref: ${{ inputs.runtime_ref }}
          dest: ${{ runner.temp }}/ai-sdlc-epic-decomposer
          label: epic decomposer
          fallback: skipping decomposition

      - name: Decompose epic into scc:child sub-issues
        id: epic-decompose
        if: steps.epic.outputs.is_epic == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          FETCHED: ${{ steps.epic-fetch.outputs.fetched }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ai-sdlc-epic-decomposer"; mkdir -p "$WORK"
          if [ "$FETCHED" != "true" ]; then
            exit 0
          fi
          node "$WORK/scripts/epic-decomposer.js" --repo "$REPO" --issue "$ISSUE" --json --github-output || true

      # The DoR gate is decision logic (issue #127): canonical script at
      # the runtime pin, fail-closed — an unavailable gate denies dispatch
      # rather than waving an unvetted issue through.
      - name: Fetch DoR gate (trusted runtime pin)
        id: dor-fetch
        if: steps.epic.outputs.is_epic != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: scripts/dor-check.js
          ref: ${{ inputs.runtime_ref }}
          dest: ${{ runner.temp }}/ai-sdlc-dor
          label: DoR gate
          fallback: dispatch denied (gate unavailable)
          required: 'true'

      - name: Validate DoR (R1–R6)
        id: dor
        if: steps.epic.outputs.is_epic != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          TRIGGER: ${{ steps.contract.outputs.trigger_label }}
          SKIP_LABELS: ${{ steps.contract.outputs.skip_labels }}
          NOT_READY: ${{ steps.contract.outputs.label_not_ready }}
          REFINE_STATUS: ${{ steps.refine.outputs.status }}
          REFINE_FP: ${{ steps.refine.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # issue.json may already exist — the epic step fetches it first.
          [ -f issue.json ] || gh issue view "$ISSUE" -R "$REPO" --json number,title,body,labels > issue.json
          node "$RUNNER_TEMP/ai-sdlc-dor/scripts/dor-check.js" --issue issue.json

      - name: Outcome → label + comment
        if: steps.dor.outputs.armed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          PASS: ${{ steps.dor.outputs.dispatch }}
          FAILED: ${{ steps.dor.outputs.failed }}
          DORSHA: ${{ steps.dor.outputs.dor_sha }}
          TRIGGER: ${{ steps.contract.outputs.trigger_label }}
          QUEUED: ${{ steps.contract.outputs.label_queued }}
          NOT_READY: ${{ steps.contract.outputs.label_not_ready }}
        run: |
          set -euo pipefail
          # Ensure outcome labels exist before applying — gh issue edit
          # hard-fails on a missing label on a fresh consumer repo.
          gh label create "$QUEUED" -R "$REPO" --color 0E8A16 --description "AI-SDLC: queued for implementation" --force || true
          gh label create "$NOT_READY" -R "$REPO" --color D93F0B --description "AI-SDLC: Definition-of-Ready failed" --force || true
          if [ "$PASS" = "true" ]; then
            gh issue edit "$ISSUE" -R "$REPO" --add-label "$QUEUED"
            # DoR surface pin (issue #122): stamp the evaluated title+body
            # hash as a trusted-author marker — implement refuses to run the
            # engine when its dispatch-time fetch hashes differently.
            MARKER=""
            if [ -n "$DORSHA" ]; then
              MARKER=$'\n'"<!-- ai-sdlc:dor sha256=$DORSHA -->"
            fi
            gh issue comment "$ISSUE" -R "$REPO" --body "✅ **AI-SDLC intake:** DoR passed — queued for implementation (approved surface \`${DORSHA:0:12}\`). Follow the opened PR for progress.$MARKER"
          else
            gh issue edit "$ISSUE" -R "$REPO" --add-label "$NOT_READY"
            gh issue comment "$ISSUE" -R "$REPO" --body "🛡️ **AI-SDLC intake:** Definition-of-Ready failed: \`$FAILED\` — see spec/definition-of-ready.md. Refine and re-apply \`$TRIGGER\`."
          fi

      # Tamper-evident run evidence (issue #196): one hash-chained entry +
      # sealed head, uploaded as an artifact. Never fails the job.
      - name: Run ledger — append stage record
        id: ledger
        if: always()
        continue-on-error: true
        uses: os-santiago/ai-sdlc/.github/actions/run-ledger@main
        with:
          op: append
          stage: intake
          repo: ${{ inputs.repo }}
          issue: ${{ inputs.issue_number }}
          engine: ${{ steps.contract.outputs.engine_name }}
          data: ${{ toJSON(steps.dor.outputs) }}

      - name: Run ledger — seal + publish
        id: seal
        if: always() && steps.ledger.outputs.head != ''
        continue-on-error: true
        uses: os-santiago/ai-sdlc/.github/actions/seal-ledger@main
        with:
          stage: intake
          signing-key: ${{ secrets.AI_SDLC_LEDGER_KEY }}
          artifact-name: ai-sdlc-ledger-intake-${{ inputs.issue_number }}-${{ github.run_attempt }}
