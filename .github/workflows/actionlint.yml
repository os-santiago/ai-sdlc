# CI gate: invalid workflow files must fail PR checks instead of landing on
# main and producing phantom 0-job failed runs (issue #15).
name: actionlint

on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        # Pinned release + SHA-256 live in the script (single source of truth
        # shared with local/pre-PR runs — issue #44).
        run: bash tools/actionlint.sh -color
