# CI gate: invalid workflow files must fail PR checks instead of landing on
# main and producing phantom 0-job failed runs (issue #15).
name: actionlint

on:
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        env:
          # Pinned release: https://github.com/rhysd/actionlint/releases/tag/v1.7.12
          ACTIONLINT_VERSION: 1.7.12
          # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the release's
          # published actionlint_1.7.12_checksums.txt.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball"
          ./actionlint -color
