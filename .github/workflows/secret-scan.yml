# secret-scan — gitleaks over git history and incoming diffs (issue #125,
# epic #89)
#
# Repo self-scan only — NOT a reusable ai-sdlc-* stage; consumer repos run
# their own secret scanning under their own contract. Complementary to the
# contract check in tools/validate-ai-sdlc-config.sh, which scans only the
# .ai-sdlc.yaml *content* for secret-shaped literals — a point-in-time
# check that cannot see keys committed and later deleted, or secrets in
# any other file. gitleaks covers the complementary surface: every commit
# diff, forever.
#
# Scope per trigger:
#   pull_request / push → only the incoming commits (base..head /
#   before..sha) — a cheap diff gate.
#   schedule (weekly, Sunday ~03:00 UTC) + workflow_dispatch → full
#   history, catching anything landed before the gate existed or via a
#   path that skipped it.
#
# Fail-closed: gitleaks exits non-zero on any finding; the job annotates
# each location (::warning, secrets redacted) and then fails. The scan
# itself failing to run also fails the job — a scanner that didn't run is
# indistinguishable from a clean scan otherwise. Findings already triaged
# as `false-positive`/`historical-revoked` are suppressed by fingerprint
# in .gitleaksignore and registered in docs/security/baseline-scan.md —
# a NEW commit carrying the same secret produces a NEW fingerprint and
# still fails, which is the desired behavior.
#
# Install: pinned gitleaks release + SHA-256 verification via
# tools/gitleaks.sh (same convention as tools/actionlint.sh — issue #44).
#
# GitHub-side secret scanning + push protection are repo-settings toggles
# (admin scope, cannot ship in YAML) — documented in
# docs/security-scanning.md.
#
# Cost: binary download + checksum verify + a `git log` scan — ~seconds;
# bounded at timeout-minutes: 10.
name: secret-scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '7 3 * * 0'          # weekly Sunday ~03:00 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # Full history: the diff scan needs the base commit present and
          # the scheduled sweep scans everything.
          fetch-depth: 0

      - name: Scan git history for secrets
        env:
          # pull_request → PR base; push → previous head; schedule /
          # dispatch → empty = full-history scan.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPORT: ${{ runner.temp }}/gitleaks-report.json
        run: |
          set -euo pipefail
          args=(git . --redact --report-format json --report-path "$REPORT")
          # A zero `before` (branch creation, force-push) has no range to
          # diff — fall back to full history rather than scanning nothing.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            args+=(--log-opts "$BASE_SHA..$HEAD_SHA")
          fi
          status=0
          bash tools/gitleaks.sh "${args[@]}" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "gitleaks: no findings"
            exit 0
          fi
          # Annotate every non-suppressed finding inline, then fail closed.
          # The report carries fingerprints but never the secret (--redact).
          if [ -s "$REPORT" ]; then
            jq -r '.[] | "::warning file=\(.File),line=\(.StartLine)::gitleaks `\(.RuleID)` finding \(.Fingerprint) — triage in docs/security/baseline-scan.md"' "$REPORT"
          else
            echo "::error::gitleaks failed before producing a report (exit $status) — treating as fail-closed"
          fi
          exit "$status"
