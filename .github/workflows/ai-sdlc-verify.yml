# ai-sdlc-verify — post-merge verification (issue #9)
#
# Runs the repo's verify commands after a merge lands. Commands come from
# the resolved .ai-sdlc.yaml contract (`verify.commands`, issue #22); the
# `verify_commands` input is override-only.
# On failure files an issue (or reverts, when revert_on_failure=true).
name: ai-sdlc-verify

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      base:
        type: string
        default: 'main'
      verify_commands:
        description: 'newline-separated commands — override; empty = .ai-sdlc.yaml verify.commands'
        type: string
        default: ''
      revert_on_failure:
        description: 'git revert the merge commit on verify failure'
        type: boolean
        default: false
      setup_commands:
        description: 'newline-separated dependency install (e.g. npm ci)'
        type: string
        default: ''
      runtime_ref:
        description: 'ref of os-santiago/ai-sdlc to fetch trusted runtime scripts (postmortem.js, alert-router.js) from — pin to the same ref as this workflow'
        type: string
        default: 'main'
      org_config:
        description: 'org baseline contract ref owner/repo[/path][@ref] — org floor per spec/org-policy.md; empty = repo contract + defaults'
        type: string
        default: ''
      pr_number:
        description: 'merged PR number — recorded on the ledger entry and used to recover the ai-sdlc:ledger-head marker (0 = none)'
        type: number
        default: 0
      ledger_head:
        description: 'upstream run-ledger chain head — seeds this stage entry prev; empty = recover the marker on pr_number (issue #196)'
        type: string
        default: ''
    outputs:
      ledger_head:
        description: 'sealed run-ledger chain head for this verify run (issue #196)'
        value: ${{ jobs.verify.outputs.ledger_head }}
    secrets:
      AI_SDLC_TOKEN:
        required: false
      AI_SDLC_LEDGER_KEY:
        description: 'run-ledger signing key (PEM; Ed25519/RSA) — seals stage evidence; absent = unsigned seal (issue #196)'
        required: false

env:
  GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
  REPO: ${{ inputs.repo }}

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ledger_head: ${{ steps.seal.outputs.head || steps.ledger.outputs.head }}
    steps:
      # Pre-dispatch authorization gate (issue #172): verify can revert a
      # merge and file issues — autonomous mutations that must also halt
      # while the kill-switch is engaged. Fail-closed: an unreadable
      # channel denies too.
      - name: Autonomy gate — org kill-switch
        id: kill
        uses: os-santiago/ai-sdlc/.github/actions/autonomy-gate@ai-sdlc/issue-139-actions
        with:
          repo: ${{ inputs.repo }}
          kill-var: ${{ vars.AI_SDLC_KILL }}
          off-var: ${{ vars.AI_SDLC_OFF }}
          control-repo: ${{ vars.AI_SDLC_CONTROL_REPO }}

      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          token: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          # A contents:write token must not sit in .git/config while
          # repo-supplied verify/setup commands execute (issue #124 — every
          # other stage already pins persist-credentials: false). Steps that
          # write authenticate explicitly (gh via GH_TOKEN; the revert push
          # via a scoped extraheader below).
          persist-credentials: false

      - name: Resolve contract (.ai-sdlc.yaml)
        id: contract
        uses: os-santiago/ai-sdlc/.github/actions/load-config@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          path: '.'
          org-config: ${{ inputs.org_config }}
          overrides: >-
            {"verify.commands": ${{ toJSON(inputs.verify_commands) }}}

      # No cache: npm — the target repo may carry no lockfile (setup-node
      # would fail); verify commands bring their own install step anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve verify commands
        id: cmds
        env:
          COMMANDS: ${{ steps.contract.outputs.verify_commands }}
          SETUP: ${{ inputs.setup_commands }}
        run: |
          set -euo pipefail
          if [ -n "$SETUP" ]; then echo "$SETUP" | while IFS= read -r c; do [ -n "$c" ] && eval "$c"; done; fi
          printf '%s\n' "$COMMANDS" > verify.cmds
          if ! grep -q '[^[:space:]]' verify.cmds; then
            echo "::warning title=ai-sdlc verify::no verify commands resolved (input, .ai-sdlc.yaml verify.commands and defaults are all empty)"
          fi
          cat verify.cmds

      - name: Run verify commands
        id: run
        run: |
          set +e
          failed=0
          : > failed.cmds
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            if ! eval "$cmd"; then failed=1; echo "$cmd" >> failed.cmds; fi
            echo "::endgroup::"
          done < verify.cmds
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      # Alert routing (issue #175): a post-merge verify failure classifies as
      # `verify-failure` and resolves WHO is notified via escalation.routes in
      # the resolved contract — the router comes from the trusted runtime pin.
      - name: Fetch alert router (trusted runtime pin)
        if: steps.run.outputs.failed == '1'
        id: route-fetch
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@ai-sdlc/issue-139-actions
        with:
          files: scripts/alert-router.js
          ref: ${{ inputs.runtime_ref }}
          dest: ${{ runner.temp }}/ai-sdlc-alert
          label: alert router
          fallback: report proceeds unrouted

      - name: Route verify-failure alert
        if: steps.run.outputs.failed == '1'
        id: route
        env:
          CONTRACT: ${{ steps.contract.outputs.path }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          FETCHED: ${{ steps.route-fetch.outputs.fetched }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/ai-sdlc-alert"
          mkdir -p "$W"
          if [ "$FETCHED" != "true" ]; then
            exit 0
          fi
          jq '.escalation // {}' "$CONTRACT" > "$W/escalation.json" 2>/dev/null || echo '{}' > "$W/escalation.json"
          node "$W/scripts/alert-router.js" --escalation "$W/escalation.json" \
            --repo "$REPO" --class verify-failure --reason "post-merge verify commands failed on $SHA" \
            --github-output --json | tee "$W/route.json" || true

      # Canonical postmortem filer (issue #191): trusted code from the
      # runtime pin — never the consumer checkout.
      - name: Fetch postmortem filer (trusted runtime pin)
        if: steps.run.outputs.failed == '1'
        id: pm-fetch
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@ai-sdlc/issue-139-actions
        with:
          files: scripts/postmortem.js
          ref: ${{ inputs.runtime_ref }}
          dest: ${{ runner.temp }}/ai-sdlc-postmortem
          label: postmortem filer
          fallback: filing without dedup

      - name: Report on failure
        if: steps.run.outputs.failed == '1'
        env:
          PM_FETCHED: ${{ steps.pm-fetch.outputs.fetched }}
          REVERT: ${{ inputs.revert_on_failure }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUNTIME_REF: ${{ inputs.runtime_ref }}
          REOPEN_MIN: ${{ steps.contract.outputs.postmortem_reopen_min }}
          DEDUP_DAYS: ${{ steps.contract.outputs.postmortem_dedup_window_days }}
          ALERT_MENTIONS: ${{ steps.route.outputs.alert_mentions }}
          ALERT_LABELS: ${{ steps.route.outputs.alert_labels }}
          ALERT_MARKER: ${{ steps.route.outputs.alert_marker }}
        run: |
          set -euo pipefail
          # Route-declared labels classify the failure — create them first so
          # a missing label can never abort the issue filing itself.
          jq -r '.[]?' <<<"${ALERT_LABELS:-[]}" | while IFS= read -r lbl; do
            gh label create "$lbl" -R "$REPO" --force || true
          done
          ROUTE_LABELS=$(jq -r 'map("," + .) | join("")' <<<"${ALERT_LABELS:-[]}")
          NOTIFY=""
          [ -n "${ALERT_MENTIONS:-}" ] && NOTIFY=$(printf '\n\ncc %s' "$ALERT_MENTIONS")
          MARKER=""
          [ -n "${ALERT_MARKER:-}" ] && MARKER=$(printf '\n\n%s' "$ALERT_MARKER")
          REVERTED=""
          if [ "$REVERT" = "true" ]; then
            git config user.name "ai-sdlc[bot]"; git config user.email "ai-sdlc[bot]@users.noreply.github.com"
            # Checkout is persist-credentials: false (issue #124) — the push
            # carries its own scoped credential via extraheader, same idiom
            # as ai-sdlc-ci-repair.yml. GH_TOKEN is masked, and so is AUTH.
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            if git revert --no-edit "$SHA" \
               && git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
                    push origin "HEAD:refs/heads/${{ inputs.base }}"; then
              REVERTED="1"
            fi
          fi

          # Canonical postmortem lifecycle (issue #191, spec/postmortem-lifecycle.md):
          # the same failure signature must never file a duplicate issue — an
          # open canonical gets a recurrence comment; a closed one inside the
          # dedup window accumulates post-close comments and reopens at
          # postmortem.reopen_min. The filer is fetched from the trusted
          # runtime ref — never the consumer checkout.
          WORK="$RUNNER_TEMP/ai-sdlc-postmortem"; mkdir -p "$WORK"
          if [ "$PM_FETCHED" = "true" ]; then
            LOCATION="$(paste -sd';' failed.cmds 2>/dev/null | head -c 200)"; LOCATION="${LOCATION:-verify.commands}"
            if [ -n "$REVERTED" ]; then
              TITLE="verify: post-merge checks failed — reverted $SHA"
              BODY="Post-merge verify failed on \`$SHA\`; change reverted. See workflow run for logs."
            else
              TITLE="verify: post-merge checks failed on $SHA"
              BODY="Post-merge verify commands failed on \`$SHA\`. See workflow run for logs; revert_on_failure is disabled."
            fi
            node "$WORK/scripts/postmortem.js" --repo "$REPO" \
              --component verify --class post-merge-verify-failure \
              --location "$LOCATION" \
              --title "$TITLE" --body "${BODY}${NOTIFY}${MARKER}" --context-file failed.cmds \
              --occurrence-id "verify-$SHA" --run-url "$RUN_URL" \
              --reopen-min "${REOPEN_MIN:-2}" --dedup-window-days "${DEDUP_DAYS:-90}" \
              --labels "ai-sdlc,postmortem,priority:P1${ROUTE_LABELS}" --json || true
          else
            # Filer unavailable at the pinned ref — fail open to the legacy
            # one-shot filing so the failure is never lost silently.
            echo "::warning title=ai-sdlc verify::postmortem filer unavailable at os-santiago/ai-sdlc@$RUNTIME_REF ($(head -c 160 "$WORK/fetch.err" 2>/dev/null)) — filing without dedup"
            if [ -n "$REVERTED" ]; then
              gh issue create -R "$REPO" --title "verify: post-merge checks failed — reverted $SHA" --body "Post-merge verify failed on \`$SHA\`; change reverted. See workflow run for logs.${NOTIFY}${MARKER}" --label "ai-sdlc,priority:P1${ROUTE_LABELS}"
            else
              gh issue create -R "$REPO" --title "verify: post-merge checks failed on $SHA" --body "Post-merge verify commands failed on \`$SHA\`. See workflow run for logs; revert_on_failure is disabled.${NOTIFY}${MARKER}" --label "ai-sdlc,priority:P1${ROUTE_LABELS}"
            fi
          fi
          exit 1

      # Tamper-evident run evidence (issue #196): the verify outcome is hashed
      # into a chain entry seeded from the last published ledger head on the
      # merged PR (recover-prev), sealed and uploaded. Never fails the job.
      - name: Run ledger — append stage record
        id: ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/run-ledger
        with:
          op: append
          stage: verify
          repo: ${{ inputs.repo }}
          pr: ${{ inputs.pr_number }}
          prev: ${{ inputs.ledger_head }}
          engine: ${{ steps.contract.outputs.engine_name }}
          recover-prev: 'true'
          token: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          data: >-
            {"failed":${{ toJSON(steps.run.outputs.failed) }},"base":${{ toJSON(inputs.base) }},"sha":${{ toJSON(github.sha) }}}

      - name: Run ledger — seal + publish
        id: seal
        if: always() && steps.ledger.outputs.head != ''
        continue-on-error: true
        uses: os-santiago/ai-sdlc/.github/actions/seal-ledger@ai-sdlc/issue-139-actions
        with:
          stage: verify
          signing-key: ${{ secrets.AI_SDLC_LEDGER_KEY }}
          artifact-name: ai-sdlc-ledger-verify-${{ github.run_attempt }}
