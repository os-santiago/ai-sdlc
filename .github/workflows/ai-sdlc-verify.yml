# ai-sdlc-verify — post-merge verification (issue #9)
#
# Runs the repo's verify commands after a merge lands. Reads
# `.ai-sdlc.yaml` `verify.commands` when present, else the explicit input.
# On failure files an issue (or reverts, when revert_on_failure=true).
name: ai-sdlc-verify

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      base:
        type: string
        default: 'main'
      verify_commands:
        description: 'newline-separated commands; overrides .ai-sdlc.yaml'
        type: string
        default: ''
      revert_on_failure:
        description: 'git revert the merge commit on verify failure'
        type: boolean
        default: false
      setup_commands:
        description: 'newline-separated dependency install (e.g. npm ci)'
        type: string
        default: ''
    secrets:
      AI_SDLC_TOKEN:
        required: false

env:
  GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
  REPO: ${{ inputs.repo }}

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          token: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve verify commands
        id: cmds
        env:
          EXPLICIT: ${{ inputs.verify_commands }}
          SETUP: ${{ inputs.setup_commands }}
        run: |
          set -euo pipefail
          if [ -n "$SETUP" ]; then echo "$SETUP" | while IFS= read -r c; do [ -n "$c" ] && eval "$c"; done; fi
          if [ -n "$EXPLICIT" ]; then
            echo "$EXPLICIT" > verify.cmds
          elif [ -f .ai-sdlc.yaml ]; then
            python3 - <<'PY'
          import re, sys
          txt = open('.ai-sdlc.yaml').read()
          m = re.search(r'^\s*verify:\s*\n(?:\s+commands:\s*\n((?:\s+-\s+.+\n)+))?', txt, re.M)
          cmds = []
          if m and m.group(1):
              cmds = [l.split('- ', 1)[1].strip() for l in m.group(1).splitlines() if '- ' in l]
          open('verify.cmds', 'w').write('\n'.join(cmds))
          PY
          else
            : > verify.cmds
          fi
          cat verify.cmds

      - name: Run verify commands
        id: run
        run: |
          set +e
          failed=0
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            eval "$cmd" || failed=1
            echo "::endgroup::"
          done < verify.cmds
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Report on failure
        if: steps.run.outputs.failed == '1'
        env:
          REVERT: ${{ inputs.revert_on_failure }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REVERT" = "true" ]; then
            git config user.name "ai-sdlc[bot]"; git config user.email "ai-sdlc[bot]@users.noreply.github.com"
            git revert --no-edit "$SHA" && git push origin "${{ inputs.base }}"
            gh issue create -R "$REPO" --title "verify: post-merge checks failed — reverted $SHA" --body "Post-merge verify failed on \`$SHA\`; change reverted. See workflow run for logs." --label "ai-sdlc,priority:P1"
          else
            gh issue create -R "$REPO" --title "verify: post-merge checks failed on $SHA" --body "Post-merge verify commands failed on \`$SHA\`. See workflow run for logs; revert_on_failure is disabled." --label "ai-sdlc,priority:P1"
          fi
          exit 1
