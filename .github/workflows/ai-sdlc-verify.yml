# ai-sdlc-verify — post-merge verification (issue #9)
#
# Runs the repo's verify commands after a merge lands. Commands come from
# the resolved .ai-sdlc.yaml contract (`verify.commands`, issue #22); the
# `verify_commands` input is override-only.
# On failure files an issue (or reverts, when revert_on_failure=true).
name: ai-sdlc-verify

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      base:
        type: string
        default: 'main'
      verify_commands:
        description: 'newline-separated commands — override; empty = .ai-sdlc.yaml verify.commands'
        type: string
        default: ''
      revert_on_failure:
        description: 'git revert the merge commit on verify failure'
        type: boolean
        default: false
      setup_commands:
        description: 'newline-separated dependency install (e.g. npm ci)'
        type: string
        default: ''
      org_config:
        description: 'org baseline contract ref owner/repo[/path][@ref] — org floor per spec/org-policy.md; empty = repo contract + defaults'
        type: string
        default: ''
    secrets:
      AI_SDLC_TOKEN:
        required: false

env:
  GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
  REPO: ${{ inputs.repo }}

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          token: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve contract (.ai-sdlc.yaml)
        id: contract
        uses: os-santiago/ai-sdlc/.github/actions/load-config@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          path: '.'
          org-config: ${{ inputs.org_config }}
          overrides: >-
            {"verify.commands": ${{ toJSON(inputs.verify_commands) }}}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Resolve verify commands
        id: cmds
        env:
          COMMANDS: ${{ steps.contract.outputs.verify_commands }}
          SETUP: ${{ inputs.setup_commands }}
        run: |
          set -euo pipefail
          if [ -n "$SETUP" ]; then echo "$SETUP" | while IFS= read -r c; do [ -n "$c" ] && eval "$c"; done; fi
          printf '%s\n' "$COMMANDS" > verify.cmds
          if ! grep -q '[^[:space:]]' verify.cmds; then
            echo "::warning title=ai-sdlc verify::no verify commands resolved (input, .ai-sdlc.yaml verify.commands and defaults are all empty)"
          fi
          cat verify.cmds

      - name: Run verify commands
        id: run
        run: |
          set +e
          failed=0
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            eval "$cmd" || failed=1
            echo "::endgroup::"
          done < verify.cmds
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Report on failure
        if: steps.run.outputs.failed == '1'
        env:
          REVERT: ${{ inputs.revert_on_failure }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REVERT" = "true" ]; then
            git config user.name "ai-sdlc[bot]"; git config user.email "ai-sdlc[bot]@users.noreply.github.com"
            git revert --no-edit "$SHA" && git push origin "${{ inputs.base }}"
            gh issue create -R "$REPO" --title "verify: post-merge checks failed — reverted $SHA" --body "Post-merge verify failed on \`$SHA\`; change reverted. See workflow run for logs." --label "ai-sdlc,priority:P1"
          else
            gh issue create -R "$REPO" --title "verify: post-merge checks failed on $SHA" --body "Post-merge verify commands failed on \`$SHA\`. See workflow run for logs; revert_on_failure is disabled." --label "ai-sdlc,priority:P1"
          fi
          exit 1
