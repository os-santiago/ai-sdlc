# ai-sdlc-review-fix — reusable bounded review-fix stage (issue #28/#140)
#
# The fix job of the former monolithic ai-sdlc-review.yml: when the review
# stage returns `action=fix-dispatched`, this stage stamps the attempt
# marker, checks out the PR head, runs the bounded engine fix pass, pushes
# the result (which re-triggers `pull_request: synchronize` → re-review)
# or escalates to needs-human at budget exhaustion.
# Normally orchestrated by ai-sdlc-review.yml — also directly callable.
name: ai-sdlc-review-fix

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      base:
        description: 'ref to read .ai-sdlc.yaml from (advisory — falls back to default engine)'
        type: string
        default: 'main'
      runtime_ref:
        description: 'ref of os-santiago/ai-sdlc to fetch runtime scripts/actions from'
        type: string
        default: 'main'
      provider_base_url:
        description: 'OpenAI-compatible inference base URL; empty → vars.AI_SDLC_PROVIDER_URL → GitHub Models default'
        type: string
        default: ''
      fix_attempt:
        description: 'fix attempt number (from the review stage fix_attempt output)'
        type: string
        required: true
      max_fix:
        description: 'resolved fix budget (review.max_fix_iterations)'
        type: string
        required: true
      head_ref:
        description: 'PR head branch to push to'
        type: string
        required: true
      head_sha:
        description: 'PR head SHA the blocking verdict consumed'
        type: string
        required: true
      resolved_model:
        description: 'resolved reviewer model id'
        type: string
        default: ''
      findings_json:
        description: 'bounded findings JSON from the verdict record'
        type: string
        default: '[]'
      engine_name:
        description: 'resolved engine adapter id — recorded on the ledger entry'
        type: string
        default: ''
      escalation_label:
        description: 'resolved escalation label applied when the fix produces no push'
        type: string
        default: 'needs-human'
      max_seconds:
        description: 'resolved engine wall-clock budget'
        type: string
        required: true
      max_steps:
        description: 'resolved engine tool-step budget'
        type: string
        required: true
    secrets:
      AI_SDLC_APP_ID:
        description: 'ai-sdlc GitHub App id (fail-closed when unset; issue #26)'
        required: true
      AI_SDLC_APP_PRIVATE_KEY:
        description: 'ai-sdlc GitHub App private key (PEM)'
        required: true
      AI_SDLC_LEDGER_KEY:
        description: 'run-ledger signing key (PEM); absent = unsigned seal'
        required: false
      MODEL_API_KEY:
        description: 'optional direct provider key; absent → GitHub Models via GITHUB_TOKEN'
        required: false

env:
  REPO: ${{ inputs.repo }}
  PR: ${{ inputs.pr_number }}

# GITHUB_TOKEN only powers GitHub Models inference (GH_TOKEN_FOR_MODELS);
# every git/gh call uses the minted ai-sdlc App installation token.
permissions:
  models: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      # Serialized with the review job: two fix passes on one PR must never
      # race pushes to the same head branch.
      group: ai-sdlc-review-${{ inputs.repo }}-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Verify credentials + mint ai-sdlc App token
        id: app-token
        uses: os-santiago/ai-sdlc/.github/actions/mint-app-token@main
        with:
          repo: ${{ inputs.repo }}
          app-id: ${{ secrets.AI_SDLC_APP_ID }}
          app-private-key: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
          purpose: pushes/PRs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'

      # Contract is read from the PR base (trusted ref), advisory — a broken
      # contract degrades to the default engine rather than blocking a fix
      # pass the review stage already dispatched.
      - name: Resolve contract (.ai-sdlc.yaml)
        id: contract
        # Advisory: resolution only feeds stage-engine selection here — a
        # failed read falls back to the default engine, never blocks a fix.
        continue-on-error: true
        uses: os-santiago/ai-sdlc/.github/actions/load-config@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          checkout: 'true'
          token: ${{ steps.app-token.outputs.token }}
          required: 'false'

      # Stage dispatch (issue #206): the fix pass is part of the review
      # stage — it runs whichever adapter `engines.review` selects.
      - name: Fetch stage-engine bundle (trusted runtime pin)
        id: stage-engine-fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: |
            scripts/engine_adapter.js
            scripts/gha/stage-engine-resolver.js
            config/engine_adapters.json
          ref: ${{ inputs.runtime_ref || 'main' }}
          dest: ${{ runner.temp }}/ai-sdlc-engine
          label: stage-engine resolver
          fallback: defaulting to scc

      - name: Resolve stage engine (.ai-sdlc.yaml engines)
        id: stage-engine
        env:
          FETCHED: ${{ steps.stage-engine-fetch.outputs.fetched }}
          STAGE: review
          REQUIRED: 'false'
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/ai-sdlc-engine"
          if [ "$FETCHED" != "true" ]; then
            { echo "engine=scc"; echo "engine_source=default"; echo "engine_binary=scc"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$DEST/scripts/gha/stage-engine-resolver.js" --stage "$STAGE" \
            --contract "${CONTRACT_PATH:-$RUNNER_TEMP/ai-sdlc-contract/contract.json}" \
            --registry "$DEST/config/engine_adapters.json" --required "$REQUIRED"

      - name: Mark fix attempt on PR
        # Stamped at DISPATCH, not at completion: the merge gate holds
        # `review-fix-running` only while a fix marker exists, and a fix job
        # that dies before pushing is detected as stalled rather than
        # mistaken for never-dispatched.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ATTEMPT: ${{ inputs.fix_attempt }}
          MAX_FIX: ${{ inputs.max_fix }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ai-sdlc-review-fix"
          mkdir -p "$WORK"
          export WORK
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          # shellcheck disable=SC2016  # literal Markdown backticks
          printf '<!-- ai-sdlc:review-fix attempt=%s sha=%s -->\n🛠️ **AI-SDLC review-fix — attempt %s/%s** dispatched on head `%s` (findings from the blocking verdict). Outcome is recorded when the run finishes; the push re-triggers `pull_request: synchronize` → re-review. Run: %s\n' \
            "$ATTEMPT" "$HEAD_SHA" "$ATTEMPT" "$MAX_FIX" "${HEAD_SHA:0:8}" "$RUN_URL" > "$WORK/attempt-start.md"
          gh pr comment "$PR" -R "$REPO" --body-file "$WORK/attempt-start.md"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      # Injection defense (issue #181): findings are engine-emitted text
      # (T2) — fetched from the trusted runtime pin, never the PR head.
      - name: Fetch injection-defense sanitizer (trusted runtime pin)
        id: sanitize-fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: scripts/injection_defense.js
          ref: main
          dest: ${{ runner.temp }}/ai-sdlc-review-fix
          label: injection_defense.js
          fallback: falling back to inline fencing

      # The stage's decision logic lives in the runtime pin (issue #127) —
      # same dest as the sanitizer fetch so the sibling require inside
      # review-fix-prompt.js resolves.
      - name: Fetch review-fix stage scripts (trusted runtime pin)
        id: stage-fetch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: |
            scripts/review-fix-prompt.js
            scripts/review-fix-record.js
          ref: ${{ inputs.runtime_ref || 'main' }}
          dest: ${{ runner.temp }}/ai-sdlc-review-fix
          label: review-fix stage scripts
          fallback: fix pass cannot proceed
          required: 'true'

      - name: Build fix prompt (findings as untrusted data, injection defense)
        id: fixprompt
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ATTEMPT: ${{ inputs.fix_attempt }}
          MAX_FIX: ${{ inputs.max_fix }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
          FINDINGS: ${{ inputs.findings_json }}
        run: |
          set -euo pipefail
          # Injection defense (issue #181): findings are engine-emitted text
          # (T2) — sanitized before re-entering a prompt. Fetched from the
          # trusted runtime pin, never from the PR head.

          node "$WORK/scripts/review-fix-prompt.js"

      - name: Bootstrap scc engine (build + provider config)
        if: steps.stage-engine.outputs.engine == 'scc'
        uses: os-santiago/ai-sdlc/.github/actions/bootstrap-scc@main
        with:
          model: ${{ inputs.resolved_model }}
          provider-base-url: ${{ inputs.provider_base_url || vars.AI_SDLC_PROVIDER_URL || 'https://models.github.ai/inference' }}
          model-api-key: ${{ secrets.MODEL_API_KEY }}
          models-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Quarantine hostile findings content
        if: steps.fixprompt.outputs.sanitize_verdict == 'blocked'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASONS: ${{ steps.fixprompt.outputs.sanitize_reasons }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create needs-human -R "$REPO" --force || true
          gh pr edit "$PR" -R "$REPO" --add-label needs-human || true
          gh pr comment "$PR" -R "$REPO" --body "🛡️ **AI-SDLC injection defense — review findings quarantined.** The findings text was blocked by the sanitization stage before the fix pass could run (${REASONS:-hostile content}). The engine did not run; human review required. Run: $RUN_URL" || true

      - name: Run stage engine headless fix (bounded)
        id: engine
        if: steps.fixprompt.outputs.sanitize_verdict != 'blocked'
        env:
          STAGE_ENGINE: ${{ steps.stage-engine.outputs.engine }}
          MODEL: ${{ inputs.resolved_model }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          MAX_STEPS: ${{ inputs.max_steps }}
        run: |
          set +e
          if [ "${STAGE_ENGINE:-scc}" != "scc" ]; then
            # Stage dispatch (issue #206): non-scc adapter selected for the
            # review stage — invoke through the registry argv contract.
            # Exit code is already adapter-mapped by the resolver.
            ENGINE_DIR="$RUNNER_TEMP/ai-sdlc-engine"
            node "$ENGINE_DIR/scripts/gha/stage-engine-resolver.js" \
              --stage review \
              --contract "$RUNNER_TEMP/ai-sdlc-contract/contract.json" \
              --registry "$ENGINE_DIR/config/engine_adapters.json" \
              --required false \
              --run \
              --model "$MODEL" \
              --prompt-file "$WORK/fix-prompt.md" \
              --manifest "$WORK/engine-manifest.json"
            code=$?
          else
          # scc exit contract: 0 ok · 10 no-changes · 20 provider · 21 auth · 22 budget · 23 livelock
          scc chat -yq \
            --prompt-file "$WORK/fix-prompt.md" \
            --no-commit \
            --audit-log "$WORK/scc-audit.jsonl" \
            --summary-file "$WORK/scc-manifest.json" \
            --max-seconds "$MAX_SECONDS" \
            --max-steps "$MAX_STEPS"
          code=$?
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0  # never fail the job here — outcome recorded below

      - name: Commit + push to PR head
        id: push
        if: steps.engine.outputs.exit_code == '0'
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ inputs.head_ref }}
          ATTEMPT: ${{ inputs.fix_attempt }}
          MAX_FIX: ${{ inputs.max_fix }}
        run: |
          set -euo pipefail
          git config user.name "ai-sdlc[bot]"
          git config user.email "ai-sdlc[bot]@users.noreply.github.com"
          git add -A -- . ':!.github/workflows'
          if git diff --cached --quiet; then
            echo "outcome=no-changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "fix(review): ai-sdlc review-fix attempt $ATTEMPT/$MAX_FIX for PR #$PR"
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          # Plain (non-force) push: rejected if the head moved since the guard ran.
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
               push origin "HEAD:refs/heads/$HEAD_REF"; then
            echo "outcome=pushed" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=push-rejected" >> "$GITHUB_OUTPUT"
          fi

      - name: Record attempt on PR
        id: record
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ATTEMPT: ${{ inputs.fix_attempt }}
          MAX_FIX: ${{ inputs.max_fix }}
          HEAD_SHA: ${{ inputs.head_sha }}
          ENGINE_CODE: ${{ steps.engine.outputs.exit_code }}
          PUSH_OUTCOME: ${{ steps.push.outputs.outcome }}
          COMMIT: ${{ steps.push.outputs.commit }}
          SANITIZE: ${{ steps.fixprompt.outputs.sanitize_verdict }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          node "$WORK/scripts/review-fix-record.js"
          gh pr comment "$PR" -R "$REPO" --body-file "$WORK/attempt-comment.md"

      - name: Escalate to human
        id: escalate
        if: always() && steps.record.outputs.outcome != 'pushed'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ATTEMPT: ${{ inputs.fix_attempt }}
          MAX_FIX: ${{ inputs.max_fix }}
          OUTCOME: ${{ steps.record.outputs.outcome }}
          ESCALATION: ${{ inputs.escalation_label }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016  # literal Markdown backticks
          printf '⚠️ **AI-SDLC review-fix escalated** — cause: fix attempt %s/%s produced no pushable change (outcome: `%s`) — nothing will re-trigger the convergence loop.\n\nHuman review required; remove `%s` (or push a fix) to hand control back.\n' \
            "$ATTEMPT" "$MAX_FIX" "${OUTCOME:-unknown}" "$ESCALATION" > "$WORK/escalation-comment.md"
          gh label create "$ESCALATION" -R "$REPO" --color B60205 \
            --description "AI-SDLC escalation: human action required" >/dev/null 2>&1 || true
          gh label create "$ESCALATION" -R "$REPO" --color D93F0B --description "AI-SDLC: escalated to human review" --force || true
          gh pr edit "$PR" -R "$REPO" --add-label "$ESCALATION"
          gh pr comment "$PR" -R "$REPO" --body-file "$WORK/escalation-comment.md"

      - name: Redact run artifacts (output-side redaction)
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          SAN="$RUNNER_TEMP/ai-sdlc-review-fix/scripts/injection_defense.js"
          [ -f "$SAN" ] || exit 0
          cd "$RUNNER_TEMP/ai-sdlc-review-fix"
          node "$SAN" --redact \
            scc-audit.jsonl scc-manifest.json review-fix-manifest.json \
            fix-prompt.md 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: ai-sdlc-review-fix-${{ inputs.pr_number }}-attempt-${{ inputs.fix_attempt }}
          path: |
            ${{ runner.temp }}/ai-sdlc-review-fix/review-fix-manifest.json
            ${{ runner.temp }}/ai-sdlc-review-fix/fix-prompt.md
            ${{ runner.temp }}/ai-sdlc-review-fix/scc-audit.jsonl
            ${{ runner.temp }}/ai-sdlc-review-fix/scc-manifest.json
            ${{ runner.temp }}/ai-sdlc-review-fix/engine-manifest.json
            ${{ runner.temp }}/ai-sdlc-review-fix/injection-audit.jsonl
          if-no-files-found: ignore
          retention-days: 14

      # Tamper-evident run evidence (issue #196): fix-attempt outcome hashed
      # into a chain entry seeded from the last published ledger head on the
      # PR (recover-prev), sealed and uploaded. Never fails the job.
      - name: Run ledger — append stage record
        id: ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/run-ledger
        with:
          op: append
          stage: review-fix
          repo: ${{ inputs.repo }}
          pr: ${{ inputs.pr_number }}
          engine: ${{ inputs.engine_name }}
          recover-prev: 'true'
          token: ${{ steps.app-token.outputs.token }}
          data: >-
            {"attempt":${{ toJSON(inputs.fix_attempt) }},"consumed_sha":${{ toJSON(inputs.head_sha) }},"engine_exit":${{ toJSON(steps.engine.outputs.exit_code) }},"outcome":${{ toJSON(steps.record.outputs.outcome) }},"commit":${{ toJSON(steps.push.outputs.commit) }}}
          data-files: |
            ${{ runner.temp }}/ai-sdlc-review-fix/review-fix-manifest.json

      - name: Run ledger — seal + publish
        id: seal
        if: always() && steps.ledger.outputs.head != ''
        continue-on-error: true
        uses: os-santiago/ai-sdlc/.github/actions/seal-ledger@main
        with:
          stage: review-fix
          signing-key: ${{ secrets.AI_SDLC_LEDGER_KEY }}
          artifact-name: ai-sdlc-ledger-review-fix-${{ inputs.pr_number }}-${{ github.run_attempt }}
