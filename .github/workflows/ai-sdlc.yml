# Self-dogfooding caller: this repo consumes its own reusable runtime.
# An issue labeled `ready-to-implement` → DoR intake → implement → PR.
# Every pull_request open/sync → AI review + bounded review-fix convergence.
# pull_request (and pushes to main) also run the contract↔schema gate —
# load-config resolves .ai-sdlc.yaml from the BASE ref in every stage, so
# contract drift is invisible to the runtime until merge, then fails
# repo-wide (issue #255). The merge ref is the only pre-merge look at it.
# Engine inference defaults to GitHub Models (GITHUB_TOKEN, `models: read`);
# repo secret MODEL_API_KEY switches to a direct provider — opt-in by label.
name: ai-sdlc (self)

on:
  issues:
    # labeled arms dispatch; opened/edited feed conversational refinement
    # (issue #197 — a spec edit must re-run the intake check).
    types: [labeled, opened, edited]
  issue_comment:
    # An author reply is part of the spec — it re-triggers refinement.
    types: [created]
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  contract:
    # Same-repo heads only: the suite executes repo code (node --test), so it
    # must never run on untrusted fork content — same posture as `review`.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # pull_request checks out the merge ref — exactly what would land on
      # main; push checks out the pushed head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '22'
      - name: Validate repo (contract ↔ schema + suite)
        run: bash tools/validate-repo.sh

  intake:
    # Armed: the trigger label event. Refinement: every other issue event —
    # opened/edited plus author replies (issue_comment on non-PR issues);
    # the refiner fingerprint no-ops when the spec source didn't move.
    # `epic` is a terminal label — intake decomposes it into scc:child
    # sub-issues instead of dispatching (issue #198, spec/labels.md T10).
    if: >-
      github.event.label.name == 'ready-to-implement' ||
      github.event.label.name == 'epic' ||
      (github.event_name == 'issues' && github.event.action != 'labeled') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
    uses: ./.github/workflows/ai-sdlc-intake.yml
    with:
      repo: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
    # Explicit per-stage secret map (issue #137): pass only what the callee
    # declares in its workflow_call secrets block — auditable, and the
    # pattern consumers copy. All four are optional for intake (App pair +
    # PAT fallback + ledger signer).
    secrets:
      AI_SDLC_TOKEN: ${{ secrets.AI_SDLC_TOKEN }}
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}

  implement:
    needs: intake
    if: needs.intake.outputs.dispatch == 'true'
    uses: ./.github/workflows/ai-sdlc-implement.yml
    with:
      repo: ${{ github.repository }}
      issue_number: ${{ github.event.issue.number }}
      # Chain the implement ledger entry to the intake head (issue #196).
      ledger_head: ${{ needs.intake.outputs.ledger_head }}
    # Implement declares App pair (required) + ledger signer + model key.
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}

  classify:
    # Deterministic pr:risk-* labeling on every diff event — runs for ALL
    # same-repo PRs, not just pipeline-managed ones (spec/risk-taxonomy.md:
    # applied at PR creation, recomputed on new pushes). Fork heads carry
    # no secrets, so the event filter lives here (same posture as review).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ai-sdlc-classify.yml
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
    # Classify declares only the App pair (required) — no engine, no ledger.
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}

  ai-sdlc-security:
    # Deterministic supply-chain gate (issue #91, epic #87): secrets +
    # dependency audit + license observations on every same-repo PR head —
    # emits the required check `ai-sdlc-security` (verify.required_checks).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ai-sdlc-security.yml
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
      # runtime_ref = the same ref the called workflow resolves from
      # (docs/security-scanning.md — "pin to the same ref as this
      # workflow"): on pull_request, github.sha is the merge commit. The
      # evaluator is fail-closed (`required: true`), so a stage script that
      # only exists on the PR head — e.g. the PR introducing
      # scripts/security-gate.js itself — must be fetched from the merge
      # ref or the gate 404s on main and can never go green. Same-repo
      # heads only (the if above), so this never executes fork content.
      runtime_ref: ${{ github.sha }}
    # Security declares App pair (required) + ledger signer.
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}

  review:
    # Fork heads carry no secrets — the called workflow would fail its auth
    # check rather than skip cleanly, so the event filter lives here.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ai-sdlc-review.yml
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ github.event.pull_request.number }}
    # Review declares App pair (required) + ledger signer + model key.
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
