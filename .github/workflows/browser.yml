name: browser-component
on:
  pull_request:
    paths: ['runtime/k8s/components/browser-verifier/**', 'runtime/k8s/deploy/local/browser-runtime/**', 'tools/*browser*.py', 'tools/fixtures/browser/**', 'tools/install_images.py', 'tools/test_install_images.py', '.github/workflows/browser.yml']
  push:
    branches: [main]
    paths: ['runtime/k8s/components/browser-verifier/**', 'runtime/k8s/deploy/local/browser-runtime/**', 'tools/*browser*.py', 'tools/fixtures/browser/**', 'tools/install_images.py', 'tools/test_install_images.py', '.github/workflows/browser.yml']
permissions:
  contents: read
jobs:
  isolated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213
      - name: Prepare owned disposable installation
        run: |
          ./install.sh tools > "$RUNNER_TEMP/tools.json"
          python3 -m venv "$RUNNER_TEMP/browser-tests"
          "$RUNNER_TEMP/browser-tests/bin/pip" install -r tools/quality-requirements.txt
          echo "$RUNNER_TEMP/browser-tests/bin" >> "$GITHUB_PATH"
          sudo ./install.sh host --configure-host
          python3 - <<'PY'
          import json, os, pathlib
          config=json.loads(pathlib.Path('examples/homedir.local-install.json').read_text())
          config.update(cluster='ai-sdlc-browser-ci',repository='os-santiago/ai-sdlc',provider='docker',profile='maintenance',images=str(pathlib.Path('runtime/k8s/deploy/local/images.lock.json').resolve()))
          pathlib.Path(os.environ['RUNNER_TEMP'],'install.json').write_text(json.dumps(config))
          PY
          ./install.sh local --config "$RUNNER_TEMP/install.json" --timeout 10m
          ./install.sh sandbox --config "$RUNNER_TEMP/install.json"
      - name: Validate closed inputs and publication compatibility
        run: |
          python3 -m unittest discover -s tools -p 'test_browser*.py' -v
          python3 -m unittest discover -s tools -p test_install_images.py -v
          python3 -m unittest discover -s tools -p test_offline_install.py -v
      - name: Build exact source browser and load its OCI identity
        run: |
          docker buildx build --provenance=false --output "type=oci,name=localhost/ai-sdlc-browser-verifier:conformance,dest=$RUNNER_TEMP/browser.oci" \
            -f runtime/k8s/components/browser-verifier/Containerfile runtime/k8s
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0,'tools')
          import browser_runtime, fixture_images
          root=pathlib.Path.home()/'.local/state/ai-sdlc/ai-sdlc-browser-ci'
          uid=json.loads((root/'ownership.json').read_text())['clusterUID']
          tools=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'tools.json').read_text())
          kubectl=[tools['kubectl'],'--kubeconfig',str(root/'kubeconfig'),'--request-timeout=10s']
          browser_runtime.install(kubectl,'docker','ai-sdlc-browser-ci',uid)
          browser_runtime.install(kubectl,'docker','ai-sdlc-browser-ci',uid)
          with pathlib.Path(os.environ['RUNNER_TEMP'],'browser.oci').open('rb') as stream:
              subprocess.run(['docker','exec','-i','ai-sdlc-browser-ci-control-plane','ctr','-n','k8s.io','images','import','--local','--digests','-'],stdin=stream,check=True,timeout=180)
          image=fixture_images.register_digest('docker','ai-sdlc-browser-ci-control-plane','localhost/ai-sdlc-browser-verifier:conformance')
          subprocess.run([sys.executable,'tools/verify_browser_component.py','--provider','docker','--kubectl',tools['kubectl'],'--kubeconfig',str(root/'kubeconfig'),'--cluster-uid',uid,'--image',image,'--report',str(pathlib.Path(os.environ['RUNNER_TEMP'],'browser-report.json'))],check=True,timeout=450)
          PY
      - name: Retain bounded component evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-component-evidence
          path: ${{ runner.temp }}/browser-report.json
          if-no-files-found: warn
          retention-days: 14
