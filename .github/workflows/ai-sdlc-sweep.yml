# ai-sdlc-sweep — scheduled stall-sweep over the merge gate (issue #29)
#
# The automerge gate is event-driven; a missed event or a PR that went green
# while nothing was listening would stall silently. This sweep re-feeds every
# open pipeline PR to the SAME gate (ai-sdlc-automerge.yml) on a schedule, so
# no pipeline PR stays open unresolved: it is merged, or it carries
# `needs-human` with a cause. The decision table lives only in the gate.
#
# Pipeline PR = open, base `main`, and head branch matching PIPELINE_BRANCH_RE
# or labeled PIPELINE_LABEL. Drafts and skip-labeled PRs are dropped before
# the bound is applied (the gate would skip them anyway) so human-owned PRs
# can't starve the scan. Cost: see docs/runtime.md § Stall-sweep.
#
# The `sentinel` job is the poll-side of the main-guard (issue #189): it
# evaluates the base branch on every sweep even when no PRs are open, so a
# red→green recovery lifts the halt (closes the sentinel issue) without
# waiting for the next PR event. The merge-blocking side lives in the gate.
#
# The `prioritize` job is the ready-queue scorer (issue #162, epic #147):
# every sweep ranks the armed issues — trigger label present, no veto label
# per spec/labels.md — by the `prioritize.*` rubric in .ai-sdlc.yaml and
# publishes the ordered dispatch queue as run evidence (step summary + JSON
# artifact). Read-only: it never labels, comments, or dispatches.
name: ai-sdlc-sweep

on:
  schedule:
    - cron: '7,37 * * * *'
  issues:
    # Label-contradiction repair is also event-driven (issue #200): a label
    # that just landed may have created a forbidden pair — repair it now
    # instead of waiting for the next scheduled pass.
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'sweep only this PR (blank = all pipeline PRs)'
        type: string
        default: ''
      max_prs:
        description: 'PRs fed to the gate per run (capped at 20)'
        type: number
        default: 20
      issue_number:
        description: 'repair only this issue (blank = all open issues)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ai-sdlc-sweep
  cancel-in-progress: false

jobs:
  sentinel:
    # Main-guard poll (issue #189): files/clears the halt latch on every
    # sweep — including runs that feed zero PRs to the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .ai-sdlc.yaml
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Trusted code only: canonical sentinel from the runtime pin.
      - name: Fetch main-guard sentinel (trusted runtime pin)
        id: mainguard-fetch
        uses: os-santiago/ai-sdlc/.github/actions/fetch-runtime-file@main
        with:
          files: scripts/main-guard.js
          ref: main
          dest: ${{ runner.temp }}/ai-sdlc-main-guard
          label: main-guard
          fallback: skipping (fail-open)

      - name: Evaluate main-guard sentinel
        env:
          FETCHED: ${{ steps.mainguard-fetch.outputs.fetched }}
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ai-sdlc-main-guard"; mkdir -p "$WORK"
          ENABLED="$(yq -r '.merge.main_guard.enabled // true' .ai-sdlc.yaml)"
          WFS="$(yq -r '[(.merge.main_guard.workflows // ["ci"])[]] | join(",")' .ai-sdlc.yaml)"
          MAXAGE="$(yq -r '.merge.main_guard.max_age_hours // 72' .ai-sdlc.yaml)"
          # Trusted code only: canonical sentinel from the runtime pin —
          # fetched by the step above; unavailable → skip cleanly (fail-open).
          if [ "$FETCHED" != "true" ]; then
            exit 0
          fi
          EXTRA=()
          [ "$ENABLED" = "false" ] && EXTRA+=(--disabled)
          node "$WORK/scripts/main-guard.js" --repo "$REPO" --base main \
            --gate-workflows "$WFS" --max-age-hours "$MAXAGE" \
            --apply --json "${EXTRA[@]}" \
            || echo "::warning title=main-guard::sentinel evaluation failed — fail-open"

  discover:
    # PR stall-sweep — skipped on `issues` events (label-repair owns those).
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      prs: ${{ steps.find.outputs.prs }}
      count: ${{ steps.find.outputs.count }}
      max_repairs: ${{ steps.cfg.outputs.max_repairs }}
      pending_max_minutes: ${{ steps.cfg.outputs.pending_max_minutes }}
      merge_method: ${{ steps.cfg.outputs.merge_method }}
    steps:
      # Pre-dispatch authorization gate (issue #172): one engaged channel —
      # vars.AI_SDLC_KILL/AI_SDLC_OFF, or an open ai-sdlc:off issue in the
      # control/target repo — fails the sweep before any PR is fed to the
      # merge gate. Fail-closed: an unreadable channel denies too.
      - name: Autonomy gate — org kill-switch
        id: kill
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
        uses: os-santiago/ai-sdlc/.github/actions/autonomy-gate@main
        with:
          repo: ${{ github.repository }}
          kill-var: ${{ vars.AI_SDLC_KILL }}
          off-var: ${{ vars.AI_SDLC_OFF }}
          control-repo: ${{ vars.AI_SDLC_CONTROL_REPO }}

      - uses: actions/checkout@v4
        with:
          sparse-checkout: .ai-sdlc.yaml
          sparse-checkout-cone-mode: false

      - name: Read merge settings from .ai-sdlc.yaml
        id: cfg
        run: |
          set -euo pipefail
          {
            echo "max_repairs=$(yq -r ".merge.max_repairs // 3" .ai-sdlc.yaml)"
            echo "pending_max_minutes=$(yq -r ".merge.pending_max_minutes // 60" .ai-sdlc.yaml)"
            echo "merge_method=$(yq -r ".merge.method // \"squash\"" .ai-sdlc.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Enumerate pipeline PRs
        id: find
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ONLY_PR: ${{ inputs.pr_number }}
          MAX_PRS: ${{ inputs.max_prs || 20 }}
          PIPELINE_BRANCH_RE: '^(feat|fix)/issue-[0-9]+'
          PIPELINE_LABEL: 'ai-sdlc'
          SKIP_LABELS: 'needs-human,hold,do-not-merge,wip'
        run: |
          set -euo pipefail
          MAX=$(( MAX_PRS > 20 ? 20 : MAX_PRS ))
          gh pr list -R "$REPO" --state open --base main --limit 100 \
            --json number,headRefName,isDraft,labels,updatedAt > prs.json
          jq -c --arg re "$PIPELINE_BRANCH_RE" --arg lbl "$PIPELINE_LABEL" \
                --arg skip "$SKIP_LABELS" --arg only "$ONLY_PR" --argjson max "$MAX" '
            ($skip | split(",")) as $skips
            | map(select(($only == "") or (.number | tostring) == $only))
            | map(. + {names: [.labels[].name]})
            | map(select((.headRefName | test($re)) or (.names | index($lbl))))
            | map(select((.isDraft | not) and ([.names[] | select(. as $n | $skips | index($n))] | length == 0)))
            | sort_by(.updatedAt)
            | .[:$max]
            | map(.number)' prs.json > selected.json
          echo "prs=$(cat selected.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length selected.json)" >> "$GITHUB_OUTPUT"
          {
            echo "### ai-sdlc stall-sweep"
            echo "open PRs scanned: $(jq length prs.json) · fed to gate (cap $MAX): $(jq -r 'map("#\(.)") | join(", ") | if . == "" then "none" else . end' selected.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: discover
    if: needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.discover.outputs.prs) }}
    uses: ./.github/workflows/ai-sdlc-automerge.yml
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ matrix.pr }}
      max_repairs: ${{ fromJSON(needs.discover.outputs.max_repairs) }}
      pending_max_minutes: ${{ fromJSON(needs.discover.outputs.pending_max_minutes) }}
      merge_method: ${{ needs.discover.outputs.merge_method }}
    # Explicit per-stage secret map (issue #137): the gate declares the App
    # pair (required) + the optional ledger signer — nothing else.
    secrets:
      AI_SDLC_APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
      AI_SDLC_APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
      AI_SDLC_LEDGER_KEY: ${{ secrets.AI_SDLC_LEDGER_KEY }}

  label-repair:
    # Issue-label contradiction repair (issue #200; spec/labels.md →
    # "Forbidden combinations" / "Drift rule"): a skip/blocker label
    # coexisting with the dispatch trigger is a pipeline defect — veto,
    # strip the loser, post the audit comment. Event-driven on
    # `issues.labeled` (repairs only that issue) and bound-swept on
    # schedule/dispatch (≤200 open issues per run).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .ai-sdlc.yaml
            scripts/label-contradiction.js
          sparse-checkout-cone-mode: false

      - name: Fetch repair script from the runtime repo (when not vendored)
        # Consumer repos carry only .ai-sdlc.yaml — pull the canonical
        # script from the runtime repo. A vendored copy always wins, so a
        # fork/PR can override it.
        if: ${{ hashFiles('scripts/label-contradiction.js') == '' }}
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scripts
          gh api 'repos/os-santiago/ai-sdlc/contents/scripts/label-contradiction.js?ref=main' \
            -H 'Accept: application/vnd.github.raw' > scripts/label-contradiction.js

      - name: Repair label contradictions on open issues
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          ONLY_ISSUE: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -f .ai-sdlc.yaml ]; then
            yq -o=json "." .ai-sdlc.yaml > contract.json
          else
            echo '{}' > contract.json   # no contract → canonical-name defaults
          fi
          ARGS=(--repo "$REPO" --contract contract.json --apply --json --github-output)
          if [ "$EVENT" = "issues" ]; then
            ARGS+=(--issue "$EVENT_ISSUE")
          elif [ -n "$ONLY_ISSUE" ]; then
            ARGS+=(--issue "$ONLY_ISSUE")
          else
            ARGS+=(--sweep --max 200)
          fi
          node scripts/label-contradiction.js "${ARGS[@]}" | tee repairs.json
          node - <<'NODE'
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("repairs.json", "utf8"));
            const repairs = r.repairs || (r.contradictions ? [r] : []);
            const fixed = typeof r.repaired === "number" ? r.repaired : (r.repaired ? 1 : 0);
            const lines = [
              "### ai-sdlc label-contradiction repair",
              `issues scanned: ${r.scanned ?? 1} · contradictions: ${r.contradictions || 0} · repaired: ${fixed}`,
              ...repairs.map((x) => `- #${x.issue}: removed \`${(x.removed || []).join("`, `")}\` — vetoed by \`${(x.vetoes || []).join("`, `")}\`${x.escalated ? " · escalated needs-human (label-drift-loop)" : ""}${x.error ? ` · ERROR: ${x.error}` : ""}`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          NODE

  prioritize:
    # Ready-queue scoring (issue #162, epic #147): ranks every armed issue —
    # trigger label present, no veto label per spec/labels.md — by the
    # `prioritize.*` rubric in .ai-sdlc.yaml and publishes the ordered queue
    # as run evidence (step summary + artifact + queue_head output). The
    # artifact IS the dispatch order for queue consumers: head first, with
    # priority labels able to override raw score (P0 always first when
    # prioritize.priority_override is on). Read-only, runs on every sweep
    # trigger — including issues.labeled, where a just-armed issue is
    # scored in place. Disabled contracts emit an empty queue, exit clean.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .ai-sdlc.yaml
            scripts/prioritize-queue.js
            scripts/label-contradiction.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fetch scorer from the runtime repo (when not vendored)
        # Consumer repos carry only .ai-sdlc.yaml — pull the canonical
        # scripts from the runtime repo (vendored copies always win).
        # label-contradiction.js is a hard dependency: the veto set the
        # scorer filters on is derived there (spec/labels.md single source).
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p scripts
          for f in prioritize-queue.js label-contradiction.js; do
            if [ ! -f "scripts/$f" ]; then
              gh api "repos/os-santiago/ai-sdlc/contents/scripts/$f?ref=main" \
                -H 'Accept: application/vnd.github.raw' > "scripts/$f"
            fi
            node --check "scripts/$f"
          done

      - name: Score the ready queue
        id: score
        env:
          GH_TOKEN: ${{ secrets.AI_SDLC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -f .ai-sdlc.yaml ]; then
            yq -o=json "." .ai-sdlc.yaml > contract.json
          else
            echo '{}' > contract.json   # no contract → stage disabled, empty queue
          fi
          node scripts/prioritize-queue.js --repo "$REPO" --contract contract.json \
            --format both --out ready-queue --json --github-output | tee queue.json
          [ ! -f ready-queue.md ] || cat ready-queue.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: ai-sdlc-ready-queue-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ready-queue.json
            ready-queue.md
          if-no-files-found: ignore
          retention-days: 30
