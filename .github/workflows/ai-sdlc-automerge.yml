# ai-sdlc-automerge — reusable merge gate (issue #9)
#
# Ports the Hermes pr_merger decision table (spec/risk-taxonomy.md):
#   green+mergeable → squash+delete-branch; failing checks → bounded repair
#   signal; pending > cap or conflicts → needs-human escalation.
# Plus the review gate (issue #28): a pending AI-review verdict on the head
# SHA holds the merge only up to review.wait_max_minutes (default 15), then
# merges with `review_timeout` recorded — review infra can never deadlock
# the pipeline. A blocked verdict holds while the bounded fix pass runs.
# Caller: on check_run.completed / pull_request events, or per PR from the
# scheduled stall-sweep (ai-sdlc-sweep.yml). Repair budget, pending cap,
# merge method, skip labels and the escalation label come from the resolved
# .ai-sdlc.yaml contract (issue #22); inputs are override-only.
name: ai-sdlc-automerge

on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: true
      pr_number:
        type: number
        required: true
      max_repairs:
        description: 'repair rounds before escalation — override; -1 = .ai-sdlc.yaml merge.max_repairs'
        type: number
        default: -1
      pending_max_minutes:
        description: 'pending-checks cap before escalation — override; -1 = .ai-sdlc.yaml merge.pending_max_minutes'
        type: number
        default: -1
      merge_method:
        description: 'squash | merge | rebase — override; empty = .ai-sdlc.yaml merge.method'
        type: string
        default: ''
      review_wait_minutes:
        description: 'pending-review cap before merging with review_timeout — override; -1 = .ai-sdlc.yaml review.wait_max_minutes'
        type: number
        default: -1
      base:
        description: 'ref to read .ai-sdlc.yaml from'
        type: string
        default: 'main'
      org_config:
        description: 'org baseline contract ref owner/repo[/path][@ref] — org floor per spec/org-policy.md; empty = repo contract + defaults'
        type: string
        default: ''
    outputs:
      action:
        description: 'merged | repair-signaled | escalated | held | skipped'
        value: ${{ jobs.gate.outputs.action }}
    secrets:
      AI_SDLC_APP_ID:
        description: 'ai-sdlc GitHub App id — mints the per-run installation token used for all gh auth (fail-closed when unset; issue #26)'
        required: true
      AI_SDLC_APP_PRIVATE_KEY:
        description: 'ai-sdlc GitHub App private key (PEM) — pairs with AI_SDLC_APP_ID'
        required: true

env:
  REPO: ${{ inputs.repo }}
  PR: ${{ inputs.pr_number }}

# Every gh call uses the minted ai-sdlc App installation token — the
# gate's GITHUB_TOKEN carries no scopes (fail-closed, issue #26).
permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ai-sdlc-merge-${{ inputs.repo }}-${{ inputs.pr_number }}
      cancel-in-progress: true
    outputs:
      action: ${{ steps.eval.outputs.action }}
    steps:
      - name: Verify ai-sdlc App credentials
        id: creds
        env:
          APP_ID: ${{ secrets.AI_SDLC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          case "$REPO" in */*) ;; *)
            echo "::error title=ai-sdlc auth::repo input '$REPO' is not owner/name" >&2
            exit 1 ;;
          esac
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_PRIVATE_KEY:-}" ]; then
            echo "::error title=ai-sdlc auth::AI_SDLC_APP_ID and AI_SDLC_APP_PRIVATE_KEY must be configured — the ai-sdlc GitHub App is the only pipeline identity for merges/labels (fail-closed: no PAT or GITHUB_TOKEN fallback). Install the App on $REPO and add the org secrets; see docs/runtime.md (issue #26)."
            exit 1
          fi
          {
            echo "owner=${REPO%%/*}"
            echo "repo_name=${REPO##*/}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint ai-sdlc App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AI_SDLC_APP_ID }}
          private-key: ${{ secrets.AI_SDLC_APP_PRIVATE_KEY }}
          owner: ${{ steps.creds.outputs.owner }}
          repositories: ${{ steps.creds.outputs.repo_name }}

      - name: Resolve contract (.ai-sdlc.yaml)
        id: contract
        uses: os-santiago/ai-sdlc/.github/actions/load-config@main
        with:
          repo: ${{ inputs.repo }}
          ref: ${{ inputs.base }}
          checkout: 'true'
          token: ${{ steps.app-token.outputs.token }}
          org-config: ${{ inputs.org_config }}
          # review.* inputs are applied inline in the step env below, not via
          # overrides: the pinned @main action may predate the review.* keys,
          # and an unknown override path hard-fails contract resolution.
          overrides: >-
            {"merge.max_repairs": ${{ inputs.max_repairs }},
             "merge.pending_max_minutes": ${{ inputs.pending_max_minutes }},
             "merge.method": ${{ toJSON(inputs.merge_method) }}}

      - name: Evaluate merge gate
        id: eval
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PENDING_MAX: ${{ steps.contract.outputs.pending_max_minutes }}
          MAX_REPAIRS: ${{ steps.contract.outputs.max_repairs }}
          SKIP_LABELS: ${{ steps.contract.outputs.merge_skip_labels }}
          ESCALATION: ${{ steps.contract.outputs.escalation_label }}
          REVIEW_MODE: ${{ steps.contract.outputs.review_mode || 'ai' }}
          REVIEW_WAIT: ${{ (inputs.review_wait_minutes != -1 && toJSON(inputs.review_wait_minutes)) || steps.contract.outputs.review_wait_max_minutes || '15' }}
          EXT: ${{ steps.contract.outputs.review_external_reviewer }}
        run: |
          set -euo pipefail
          # GitHub computes `mergeable` lazily; an idle PR often reports
          # UNKNOWN on first read. Re-poll a few times before deciding.
          for _ in 1 2 3 4; do
            gh pr view "$PR" -R "$REPO" --json number,title,isDraft,mergeable,mergeStateStatus,headRefOid,baseRefName,labels,createdAt,comments,commits > pr.json
            [ "$(jq -r .mergeable pr.json)" != "UNKNOWN" ] && break
            sleep 5
          done
          # `gh pr checks --json` exposes `bucket` (pass|fail|pending|skipping|cancel),
          # not `conclusion`. "no checks reported" is the only tolerated error —
          # any other failure must not degrade into a no-checks merge.
          rc=0; gh pr checks "$PR" -R "$REPO" --json name,state,bucket > checks.json 2> checks.err || rc=$?
          if [ "$rc" -ne 0 ]; then
            if grep -qi 'no checks reported' checks.err; then echo '[]' > checks.json
            else cat checks.err >&2; exit 1; fi
          fi
          # Review verdict markers — trusted authors only (issue #28): a
          # forged comment must never steer the merge gate.
          gh api --paginate "repos/$REPO/issues/$PR/comments?per_page=100" \
            --jq '.[] | select(.user.type == "Bot" or ((.author_association // "") | IN("OWNER","MEMBER","COLLABORATOR")))
                  | {body: (.body // ""), created_at}' \
            | jq -s . > trusted-comments.json
          echo '[]' > ext-reviews.json
          if [ -n "$EXT" ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" \
              --jq '.[] | {login: (.user.login // ""), state}' \
              | jq -s . > ext-reviews.json || echo '[]' > ext-reviews.json
          fi
          node - <<'NODE'
          const fs = require('fs');
          const pr = JSON.parse(fs.readFileSync('pr.json', 'utf8'));
          const checks = JSON.parse(fs.readFileSync('checks.json', 'utf8') || '[]');
          const labels = (pr.labels || []).map(l => l.name);
          const SKIP = [...JSON.parse(process.env.SKIP_LABELS || '[]'), process.env.ESCALATION].filter(Boolean);
          const out = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);

          // Decision table (spec/risk-taxonomy.md):
          let action = 'skipped', reason = '';
          if (pr.isDraft) { action = 'skipped'; reason = 'draft'; }
          else if (labels.some(l => SKIP.includes(l))) { action = 'skipped'; reason = 'skip-label'; }
          else if (pr.baseRefName !== 'main') { action = 'skipped'; reason = 'non-main-base'; }
          else if (labels.includes('pr:risk-critical') && !labels.includes('pr:risk-accepted')) { action = 'held'; reason = 'risk-critical-unaccepted'; }
          else if (pr.mergeable === 'CONFLICTING') { action = 'escalated'; reason = 'conflict'; }
          else {
            const failing = checks.filter(c => c.bucket === 'fail' || c.bucket === 'cancel');
            const pending = checks.filter(c => c.bucket === 'pending');
            const ageMin = (Date.now() - new Date(pr.createdAt)) / 60000;
            // Repair signals carry a per-head-SHA marker so repeated polls
            // (scheduled sweep) neither spam nor loop forever.
            const MARK = /<!-- ai-sdlc:repair-signal sha=([0-9a-f]+) -->/;
            const signals = (pr.comments || []).map(c => ({ m: MARK.exec(c.body || ''), at: c.createdAt })).filter(x => x.m);
            const signaledShas = new Set(signals.map(x => x.m[1]));
            const current = signals.filter(x => x.m[1] === pr.headRefOid);
            if (failing.length) {
              const names = failing.map(c => c.name).join(',');
              if (current.length) {
                const sinceMin = (Date.now() - new Date(current[0].at)) / 60000;
                if (sinceMin > Number(process.env.PENDING_MAX)) { action = 'escalated'; reason = `repair-stalled:${names}`; }
                else { action = 'held'; reason = 'repair-awaiting'; }
              }
              else if (signaledShas.size >= Number(process.env.MAX_REPAIRS)) { action = 'escalated'; reason = `repairs-exhausted:${names}`; }
              else { action = 'repair-signaled'; reason = `failing:${names}`; }
            }
            else if (pending.length && ageMin > Number(process.env.PENDING_MAX)) { action = 'escalated'; reason = 'pending-timeout'; }
            else if (pending.length) { action = 'held'; reason = 'pending'; }
            else if (pr.mergeable === 'MERGEABLE') {
              const base = checks.length ? 'green' : 'no-checks';
              // Review gate (issue #28): verdict markers live on the PR as
              // trusted-author comments (`<!-- ai-sdlc:review sha=… -->`).
              // A pending verdict holds the merge only up to
              // review.wait_max_minutes, then merges with `review_timeout`
              // recorded — review infra can never deadlock the pipeline
              // (Hermes PR_REVIEW_WAIT_MINUTES semantics). A blocked verdict
              // holds while the bounded fix pass owns the branch.
              const REVIEW_ON = ['ai', 'hybrid'].includes((process.env.REVIEW_MODE || '').toLowerCase());
              const WAIT = Number(process.env.REVIEW_WAIT) || 15;
              const VMARK = /<!-- ai-sdlc:review sha=([0-9a-f]{7,40}) verdict=(clean|blocked|inconclusive) -->/;
              const FMARK = /<!-- ai-sdlc:review-fix attempt=(\d+) sha=([0-9a-f]{7,40})/;
              const tcomments = JSON.parse(fs.readFileSync('trusted-comments.json', 'utf8') || '[]');
              const vm = tcomments.map(c => ({ m: VMARK.exec(c.body || ''), at: c.created_at }))
                .filter(x => x.m && x.m[1] === pr.headRefOid);
              const fm = tcomments.map(c => ({ m: FMARK.exec(c.body || ''), at: c.created_at }))
                .filter(x => x.m && x.m[2] === pr.headRefOid);
              const EXT = (process.env.EXT || '').trim().toLowerCase();
              const match = (s) => { s = (s || '').toLowerCase(); return EXT && s && (s.includes(EXT) || EXT.startsWith(s)); };
              const extBad = checks.filter(c => match(c.name) && (c.bucket === 'fail' || c.bucket === 'cancel'));
              const extPending = checks.filter(c => match(c.name) && c.bucket === 'pending');
              const lastExt = new Map();
              const extReviews = JSON.parse(fs.readFileSync('ext-reviews.json', 'utf8') || '[]');
              for (const r of extReviews.filter(r => match(r.login))) lastExt.set(r.login, r);
              const extBlocking = extBad.length > 0 || [...lastExt.values()].some(r => r.state === 'CHANGES_REQUESTED');
              const headAt = new Date(((pr.commits || []).slice(-1)[0] || {}).committedDate || pr.createdAt);
              const headMin = (Date.now() - headAt) / 60000;
              const verdict = vm.length ? vm[vm.length - 1].m[2] : '';
              const vMin = vm.length ? (Date.now() - new Date(vm[vm.length - 1].at)) / 60000 : Infinity;
              const fMin = fm.length ? (Date.now() - new Date(fm[fm.length - 1].at)) / 60000 : Infinity;

              if (REVIEW_ON && extBlocking) {
                // The external reviewer wins over the AI verdict (fail-safe);
                // nothing re-reviews this head on its own → escalate at cap.
                if (headMin < WAIT) { action = 'held'; reason = 'external-review-blocking'; }
                else { action = 'escalated'; reason = 'external-review-blocking'; }
              }
              else if (REVIEW_ON && verdict === 'blocked') {
                // The fix pass stamps its marker at dispatch; a fix that
                // never lands escalates on the async-work cap (PENDING_MAX).
                if (fm.length && fMin < Number(process.env.PENDING_MAX)) { action = 'held'; reason = 'review-fix-running'; }
                else if (fm.length) { action = 'escalated'; reason = 'review-fix-stalled'; }
                else if (vMin < WAIT) { action = 'held'; reason = 'review-blocked'; }
                else { action = 'escalated'; reason = 'review-fix-not-dispatched'; }
              }
              else if (REVIEW_ON && (!verdict || extPending.length)) {
                if (headMin < WAIT) { action = 'held'; reason = !verdict ? 'review-pending' : 'external-review-pending'; }
                else { action = 'merged'; reason = `${base}+review_timeout`; }
              }
              else { action = 'merged'; reason = base; }
            }
            else { action = 'held'; reason = `mergeable=${pr.mergeable}`; }
          }
          console.log(`decision: ${action} (${reason})`);
          out('action', action); out('reason', reason);
          NODE

      - name: Merge on green
        if: steps.eval.outputs.action == 'merged'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          METHOD: ${{ steps.contract.outputs.merge_method }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" -R "$REPO" --"$METHOD" --delete-branch

      - name: Record review timeout
        if: steps.eval.outputs.action == 'merged' && contains(steps.eval.outputs.reason, 'review_timeout')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WAIT: ${{ (inputs.review_wait_minutes != -1 && toJSON(inputs.review_wait_minutes)) || steps.contract.outputs.review_wait_max_minutes || '15' }}
        run: |
          set -euo pipefail
          SHA=$(jq -r .headRefOid pr.json)
          # shellcheck disable=SC2016  # literal Markdown backticks
          printf '⏱️ **AI-SDLC:** merged past the review wait cap (%s min) — the pending review on head `%s` is recorded as `review_timeout`. Review infra can never stall merges beyond the cap (issue #28).\n' \
            "$WAIT" "${SHA:0:8}" > "$RUNNER_TEMP/review-timeout.md"
          gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/review-timeout.md"

      - name: Escalate to human
        if: steps.eval.outputs.action == 'escalated'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASON: ${{ steps.eval.outputs.reason }}
          ESCALATION: ${{ steps.contract.outputs.escalation_label }}
        run: |
          set -euo pipefail
          gh label create "$ESCALATION" -R "$REPO" --color D93F0B --description "AI-SDLC: escalated to human review" --force || true
          gh pr edit "$PR" -R "$REPO" --add-label "$ESCALATION"
          gh pr comment "$PR" -R "$REPO" --body "⚠️ **AI-SDLC merge gate escalated** — reason: \`$REASON\`. Human review required; remove \`$ESCALATION\` to hand control back."

      - name: Signal repair need
        if: steps.eval.outputs.action == 'repair-signaled'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REASON: ${{ steps.eval.outputs.reason }}
          MAX_REPAIRS: ${{ steps.contract.outputs.max_repairs }}
        run: |
          set -euo pipefail
          # Dispatch target: ai-sdlc-ci-repair.yml (bounded repair loop, issue #27).
          # This step only signals; wiring the repair call is the caller's job.
          SHA=$(jq -r .headRefOid pr.json)
          gh pr comment "$PR" -R "$REPO" --body "🔧 **AI-SDLC:** checks failing (\`$REASON\`) — dispatch a bounded repair pass via [\`ai-sdlc-ci-repair.yml\`](https://github.com/os-santiago/ai-sdlc/blob/main/.github/workflows/ai-sdlc-ci-repair.yml) (max $MAX_REPAIRS attempts, then \`needs-human\`; see docs/runtime.md: repair loop).
          <!-- ai-sdlc:repair-signal sha=$SHA -->"
