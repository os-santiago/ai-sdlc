# Declarative desired state. Local overrides live in deploy/local/values.yaml.
# Version 0.2 separates the old single-pod topology into five Deployments.
fullnameOverride: ""
nameOverride: ""
namespace: {create: false, name: ""}
image:
  repository: quay.io/os-santiago/ai-sdlc
  tag: unpublished
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount: {create: true, name: ""}
# Readiness probe timeout (seconds) of every runtime component. 0 omits the
# field, so the kubelet default (1 s) applies and installations recorded
# before this setting render unchanged. The installer sets 5 for new
# installations: /readyz bounds its own checks to 3 s, and a 1 s probe
# cancels a slow API or database read and reports it as a missing dependency.
probes: {readinessTimeoutSeconds: 0}
# Prometheus metrics (docs/operations/metrics.md). Off by default: nothing
# below renders and installations recorded before this setting render
# unchanged. Enabled, each runtime component also listens on port, serving
# only GET /metrics (bounded counters, never issue or model content), and a
# NetworkPolicy admits scrapeFrom to that port alone, never to the
# component's routes. Requires networkPolicy.enabled.
metrics:
  enabled: false
  port: 9090
  # NetworkPolicy peers that may scrape, required when enabled, for example
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}].
  scrapeFrom: []
  # A Prometheus Operator PodMonitor for the metrics port. Needs the
  # monitoring.coreos.com CRDs (OpenShift user workload monitoring has them).
  podMonitor: {enabled: false, interval: 30s}
runtime:
  intakePaused: false
  mode: maintenance
  # Administrative first-install exclusion; not a workflow pause/cleanup API.
  # Installer must prove no history or owned execution before stopping services.
  paused: false
candidate:
  credentialRevision: ""
  configJSON: ""
  apiServerCIDRs: []
verifier:
  digest: ""
# Sandbox RuntimeClass for every executor, reviewer and verification pod. Use
# the platform's standard sandbox class (for example gvisor on GKE Sandbox,
# kata on OpenShift sandboxed containers, kata-mshv-vm-isolation on AKS Pod
# Sandboxing). The local kind installer creates ai-sdlc-offline. Controllers
# verify the class exists before they become ready; there is no unsandboxed
# fallback. The installer writes the same name into the execution and review
# configuration documents; the chart rejects a mismatch. The class's
# scheduling (nodeSelector, tolerations) is accepted as admission adds it.
sandbox:
  runtimeClassName: ai-sdlc-offline
  # Per-pod overhead headroom for a class with overhead.podFixed (Kata adds
  # one, for example cpu 250m and memory 350Mi). Each sandbox namespace quota
  # grows by it for every pod it admits, and the controllers refuse a class
  # whose overhead exceeds it. Empty: only a class without overhead is used.
  podOverhead: {cpu: "", memory: ""}
intake:
  configJSON: ""
  credentialSecret: ai-sdlc-github-client
authority:
  policyConfigMap: ai-sdlc-authority
  policyJSON: ""
  installationUID: ""
  identitySecretPrefix: ai-sdlc-identity
  databaseSecretPrefix: ai-sdlc-database
# Optional reviewed project manifest (ai-sdlc.project/v1) for a repository
# that is not a built-in reference. Its digest must be bound into the
# authority policy as projectSHA256; empty renders nothing.
project:
  manifestJSON: ""
  # Set from the migrator's project installation output; sizes the verifier
  # namespace for the manifest's three concurrent repository-tests runs.
  verifierQuota: {}
migrator:
  enabled: true
  digest: ""
  credentialsSecret: ai-sdlc-database-roles
logLevel: info
contract:
  inline: |
    spec: "1.0.0"
    autonomy:
      level: shadow
postgres:
  local:
    enabled: false
    image: docker.io/library/postgres:17-alpine@sha256:005c5c37db96c1e6652a79ea31f9886402fba81ac95dc2db897739121dd7f8f2
    storageSize: 2Gi
    storageClass: ""
  cloudNativePG:
    enabled: true
    clusterName: ai-sdlc-postgres
    instances: 1
    storageSize: 1Gi
  databaseURLSecret: {name: ai-sdlc-postgres-app, key: uri}
# Maintenance never invokes this engine or loads a model credential.
engine: scc
modelProvider:
  baseURL: https://integrate.api.nvidia.com/v1
  model: nvidia/llama-3.1-nemotron-70b-instruct
  workspaceDir: /workspaces/target-repo
  apiKeySecret: {name: ai-sdlc-model-provider, key: apiKey}
components:
  intake:
    name: intake
    digest: ""
    port: 8086
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  admissionController:
    name: admission-controller
    digest: ""
    port: 8081
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  orchestrator:
    name: orchestrator
    digest: ""
    port: 8082
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  worker:
    name: worker
    digest: ""
    port: 8083
    workspaceSizeLimit: 10Gi
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}
  releaseManager:
    name: release-manager
    digest: ""
    port: 8084
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  relay:
    name: relay
    digest: ""
    port: 8085
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
networkPolicy:
  enabled: true
  databaseEgressCIDRs: []
openshift:
  # OpenShift admission profile. When enabled, the runtime's and workloads'
  # ServiceAccounts may use the standard nonroot-v2 SCC (fixed non-root UID
  # 1000), and the transports accept only the exact annotations, MCS level and
  # default pull secret that OpenShift admission adds to a compiled pod.
  enabled: false
  route: {enabled: false, host: ""}

review:
  enabled: false
  configJSON: ""
  # Offer the reviewer model only the read-only tools the review response
  # policy accepts (the verifier's model gateway removes every other tool
  # definition). The installer sets it for new installations; absent or false
  # keeps the earlier rendering, so recorded installations render unchanged.
  narrowModelTools: false

publication:
  enabled: false
  credentialRevision: ""

merge:
  enabled: false
  configJSON: ""

build:
  enabled: false
  digest: ""
  configJSON: ""
  outerPolicyJSON: ""

# Separate process using the verifier image; installation must independently
# approve trust and provision/test the native pull-only registry identity first.
provenance:
  enabled: false
  trustJSON: ""
  registryCredentialSecret: ai-sdlc-provenance-registry
  credentialRevision: ""

# Explicit reviewed console target. Installing this capability does not unpause
# runtime replicas or remove either policy freeze.
release:
  enabled: false
  digest: ""
  targetJSON: ""
  browserProfileJSON: ""

# Completion backend adapter for the worker and verifier loopback model
# gateways. The worker/verifier contract never changes; only the adapter does.
# Upstream adapters use one fixed endpoint: plain HTTP is accepted only for a
# literal RFC 1918/ULA address, and egress is opened only to that CIDR and port.
# They benchmark the model at startup and stay unready until it passes.
modelGateway:
  # agent-cli: a local agent CLI as the completion model (Codex CLI wrapper).
  # openai: any OpenAI-compatible /v1/chat/completions endpoint.
  # anthropic: the Anthropic Messages API (/v1/messages); needs credentialSecret.
  adapter: agent-cli
  upstream:
    url: ""
    model: ""
    cidr: ""
    port: 8080
    # Installation ceiling for one upstream call; the startup benchmark derives
    # the actual timeout and refuses to become ready above this ceiling.
    seconds: 300
    # Optional Secret (key "credential") with the upstream API key.
    credentialSecret: ""
    # Send chat_template_kwargs.enable_thinking=false (llama.cpp/vLLM only).
    directAnswers: false
  # Planning envelope for the startup benchmark: the largest prompt and answer
  # one SCC step may need.
  benchmark:
    promptTokens: 16384
    completionTokens: 4096
  # Envelope for the verifier's gateway: reviewers read large candidates but
  # answer with a short verdict.
  reviewBenchmark:
    promptTokens: 16384
    completionTokens: 1024
