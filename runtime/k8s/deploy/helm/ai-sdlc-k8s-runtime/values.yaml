# Declarative desired state. Local overrides live in deploy/local/values.yaml.
# Version 0.2 separates the old single-pod topology into five Deployments.
fullnameOverride: ""
nameOverride: ""
namespace: {create: false, name: ""}
image:
  repository: quay.io/os-santiago/ai-sdlc
  tag: unpublished
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount: {create: true, name: ""}
runtime:
  intakePaused: false
  mode: maintenance
  # Administrative first-install exclusion; not a workflow pause/cleanup API.
  # Installer must prove no history or owned execution before stopping services.
  paused: false
candidate:
  credentialRevision: ""
  configJSON: ""
  apiServerCIDRs: []
verifier:
  digest: ""
intake:
  configJSON: ""
  credentialSecret: ai-sdlc-github-client
authority:
  policyConfigMap: ai-sdlc-authority
  policyJSON: ""
  installationUID: ""
  identitySecretPrefix: ai-sdlc-identity
  databaseSecretPrefix: ai-sdlc-database
migrator:
  enabled: true
  digest: ""
  credentialsSecret: ai-sdlc-database-roles
logLevel: info
contract:
  inline: |
    spec: "1.0.0"
    autonomy:
      level: shadow
postgres:
  local:
    enabled: false
    image: docker.io/library/postgres:17-alpine@sha256:005c5c37db96c1e6652a79ea31f9886402fba81ac95dc2db897739121dd7f8f2
    storageSize: 2Gi
    storageClass: ""
  cloudNativePG:
    enabled: true
    clusterName: ai-sdlc-postgres
    instances: 1
    storageSize: 1Gi
  databaseURLSecret: {name: ai-sdlc-postgres-app, key: uri}
# Maintenance never invokes this engine or loads a model credential.
engine: scc
modelProvider:
  baseURL: https://integrate.api.nvidia.com/v1
  model: nvidia/llama-3.1-nemotron-70b-instruct
  workspaceDir: /workspaces/target-repo
  apiKeySecret: {name: ai-sdlc-model-provider, key: apiKey}
components:
  intake:
    name: intake
    digest: ""
    port: 8086
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  admissionController:
    name: admission-controller
    digest: ""
    port: 8081
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  orchestrator:
    name: orchestrator
    digest: ""
    port: 8082
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  worker:
    name: worker
    digest: ""
    port: 8083
    workspaceSizeLimit: 10Gi
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}
  releaseManager:
    name: release-manager
    digest: ""
    port: 8084
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  relay:
    name: relay
    digest: ""
    port: 8085
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
networkPolicy:
  enabled: true
  databaseEgressCIDRs: []
openshift:
  route: {enabled: false, host: ""}

review:
  enabled: false
  configJSON: ""

publication:
  enabled: false
  credentialRevision: ""

merge:
  enabled: false
  configJSON: ""

build:
  enabled: false
  digest: ""
  configJSON: ""
  outerPolicyJSON: ""

# Separate process using the verifier image; installation must independently
# approve trust and provision/test the native pull-only registry identity first.
provenance:
  enabled: false
  trustJSON: ""
  registryCredentialSecret: ai-sdlc-provenance-registry
  credentialRevision: ""

# Explicit reviewed console target. Installing this capability does not unpause
# runtime replicas or remove either policy freeze.
release:
  enabled: false
  digest: ""
  targetJSON: ""
  browserProfileJSON: ""
