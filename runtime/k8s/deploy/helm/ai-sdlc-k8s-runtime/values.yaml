# Default values for ai-sdlc-k8s-runtime.

namespace:
  create: true
  name: ai-sdlc-runtime

image:
  registry: ghcr.io/os-santiago
  tag: development
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

# Inline .ai-sdlc.yaml mounted read-only into every component at
# /etc/ai-sdlc/contract/.ai-sdlc.yaml (AI_SDLC_CONTRACT_PATH). Production
# deployments SHOULD source this from the target repo via GitOps rather
# than `helm --set` — see ../../../docs/onboarding.md. The shadow-level
# placeholder below is intentionally conservative: it only observes, never
# mutates, until a real contract is wired in.
contract:
  inline: |
    spec: "1.0.0"
    autonomy:
      level: shadow

logLevel: info

components:
  admissionController:
    image: ai-sdlc-admission-controller
    port: 8081
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  orchestrator:
    image: ai-sdlc-orchestrator
    port: 8082
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}
  worker:
    image: ai-sdlc-worker
    port: 8083
    resources:
      requests: {cpu: 250m, memory: 256Mi}
      limits: {cpu: "2", memory: 2Gi}
    workspaceSizeLimit: 10Gi
  releaseManager:
    image: ai-sdlc-release-manager
    port: 8084
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 250m, memory: 128Mi}

networkPolicy:
  enabled: true
  allowedEgressPorts: [443, 4222, 5432, 4317]

# OpenShift-only. Ignored (and safe to leave enabled: true) on vanilla
# Kubernetes clusters that lack the route.openshift.io/v1 API — the
# template guards on .Capabilities.APIVersions.
openshift:
  route:
    enabled: false
    host: ""
