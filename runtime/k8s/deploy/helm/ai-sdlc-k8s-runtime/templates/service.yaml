{{- range $key, $component := .Values.components }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-{{ $component.name }}
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" $ }}
spec:
  type: ClusterIP
  selector:
    {{- include "ai-sdlc-k8s-runtime.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
  ports:
    - {name: http, port: {{ $component.port }}, targetPort: http}
{{- end }}
