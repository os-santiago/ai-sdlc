{{- if .Values.metrics.enabled }}
{{- $port := int .Values.metrics.port }}
{{- $taken := list 8087 8088 8089 8090 8787 }}
{{- $all := list "verifier" "build-controller" "provenance-verifier" "deployer" }}
{{- range .Values.components }}
{{- $taken = append $taken (int .port) }}
{{- $all = append $all .name }}
{{- end }}
{{- if has $port $taken }}
{{- fail "metrics.port must differ from every component and sidecar port" }}
{{- end }}
{{- if not .Values.metrics.scrapeFrom }}
{{- fail "metrics.scrapeFrom must name the peers allowed to scrape; an empty list would admit every source" }}
{{- end }}
{{- /* Select only pods another policy already isolates for ingress, so this
policy only adds the metrics port: every component under the internal
policy, and the build controller, provenance verifier and deployer, which
always carry their own. */}}
{{- $selected := ternary $all (list "build-controller" "provenance-verifier" "deployer") .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-metrics
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: {{ toJson $selected }}}
  policyTypes: [Ingress]
  ingress:
    - from:{{ toYaml .Values.metrics.scrapeFrom | nindent 8 }}
      ports: [{protocol: TCP, port: metrics}]
{{- if .Values.metrics.podMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - {key: app.kubernetes.io/component, operator: In, values: {{ toJson $all }}}
  podMetricsEndpoints:
    - {port: metrics, path: /metrics, scheme: http, interval: {{ .Values.metrics.podMonitor.interval | quote }}}
{{- end }}
{{- end }}
