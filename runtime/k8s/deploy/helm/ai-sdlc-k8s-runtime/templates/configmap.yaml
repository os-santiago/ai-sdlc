apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-config
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
data:
  AI_SDLC_ENVIRONMENT: {{ .Release.Namespace | default "default" | quote }}
  AI_SDLC_AUTHORITY_POLICY_PATH: /etc/ai-sdlc/authority/policy.json
  AI_SDLC_IDENTITY_PATH: /etc/ai-sdlc/identity/identity.json
  AI_SDLC_MERGE: {{ .Values.merge.enabled | quote }}
  AI_SDLC_PUBLICATION: {{ .Values.publication.enabled | quote }}
  AI_SDLC_INDEPENDENT_REVIEW: {{ .Values.review.enabled | quote }}
  AI_SDLC_RUNTIME_MODE: {{ .Values.runtime.mode | quote }}
  AI_SDLC_INTAKE_CONFIG_PATH: /etc/ai-sdlc/intake/config.json
  AI_SDLC_LOG_LEVEL: {{ .Values.logLevel | quote }}
  {{- $routes := dict "admit-issue" (printf "http://%s-admission-controller:%v/internal/admit-issue" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.admissionController.port) "plan-admission" (printf "http://%s-orchestrator:%v/internal/plan-admission" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.orchestrator.port) }}
  {{- if has .Values.runtime.mode (list "candidate" "verification") }}
  {{- $_ := set $routes "execute-work" (printf "http://%s-worker:%v/internal/execute-work" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.worker.port) }}
  {{- end }}
  {{- if eq .Values.runtime.mode "verification" }}
  {{- $_ := set $routes "verify-artifact" (printf "http://%s-verifier:8087/internal/verify-artifact" (include "ai-sdlc-k8s-runtime.fullname" .)) }}
  {{- end }}
  {{- if .Values.publication.enabled }}
  {{- $_ := set $routes "publish-candidate" (printf "http://%s-release-manager:%v/internal/publish-candidate" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.releaseManager.port) }}
  {{- end }}
  AI_SDLC_RELAY_ROUTES: {{ $routes | toJson | quote }}
  {{- if has .Values.runtime.mode (list "candidate" "verification") }}
  AI_SDLC_EXECUTION_CONFIG_PATH: /etc/ai-sdlc/execution/config.json
  {{- end }}
  AI_SDLC_CONTRACT_PATH: /etc/ai-sdlc/contract/.ai-sdlc.yaml
---
# Prefer sourcing this from the target repo via GitOps (docs/onboarding.md)
# over `helm --set contract.inline=...` — the contract is the pipeline's
# single source of policy truth and should go through the same review as
# any other .ai-sdlc.yaml change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-contract
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
data:
  .ai-sdlc.yaml: |
    {{- .Values.contract.inline | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-adev
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
data:
  ai-sdlc.yaml: |
    {{- .Files.Get "files/adev-profile.yaml" | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.authority.policyConfigMap }}
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
  annotations:
    ai-sdlc.io/cluster-uid: {{ .Values.authority.installationUID | quote }}
data:
  policy.json: {{ .Values.authority.policyJSON | quote }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-intake
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
data:
  config.json: {{ .Values.intake.configJSON | quote }}

{{- if has .Values.runtime.mode (list "candidate" "verification") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-execution
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
data:
  config.json: {{ .Values.candidate.configJSON | quote }}
{{- end }}
