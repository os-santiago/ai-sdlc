apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-config
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
data:
  AI_SDLC_ENVIRONMENT: {{ .Release.Namespace | default "default" | quote }}
  AI_SDLC_LOG_LEVEL: {{ .Values.logLevel | quote }}
  AI_SDLC_CONTRACT_PATH: /etc/ai-sdlc/contract/.ai-sdlc.yaml
---
# Prefer sourcing this from the target repo via GitOps (docs/onboarding.md)
# over `helm --set contract.inline=...` — the contract is the pipeline's
# single source of policy truth and should go through the same review as
# any other .ai-sdlc.yaml change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-contract
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
data:
  .ai-sdlc.yaml: |
    {{- .Values.contract.inline | nindent 4 }}
