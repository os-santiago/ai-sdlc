apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-config
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
data:
  AI_SDLC_ENVIRONMENT: {{ .Release.Namespace | default "default" | quote }}
  AI_SDLC_RUNTIME_MODE: {{ .Values.runtime.mode | quote }}
  AI_SDLC_LOG_LEVEL: {{ .Values.logLevel | quote }}
  AI_SDLC_RELAY_ROUTES: {{ dict "IssueAdmissionDecided.v1" (printf "http://%s-orchestrator:%v/v1/plans/events/issue-admission-decided" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.orchestrator.port) "WorkItemReady.v1" (printf "http://%s-worker:%v/v1/attempts/dispatch" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.worker.port) "ImplementationAttemptDecided.v1" (printf "http://%s-orchestrator:%v/v1/plans/events/implementation-attempt-decided" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.orchestrator.port) "ReleaseGateDecided.v1" (printf "http://%s-orchestrator:%v/v1/plans/events/release-gate-decided" (include "ai-sdlc-k8s-runtime.fullname" .) .Values.components.orchestrator.port) | toJson | quote }}
  AI_SDLC_CONTRACT_PATH: /etc/ai-sdlc/contract/.ai-sdlc.yaml
---
# Prefer sourcing this from the target repo via GitOps (docs/onboarding.md)
# over `helm --set contract.inline=...` — the contract is the pipeline's
# single source of policy truth and should go through the same review as
# any other .ai-sdlc.yaml change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-contract
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
data:
  .ai-sdlc.yaml: |
    {{- .Values.contract.inline | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-adev
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
data:
  ai-sdlc.yaml: |
    {{- .Files.Get "files/adev-profile.yaml" | nindent 4 }}
