{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-internal
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: relay
      ports:
        {{- range .Values.components }}
        - {protocol: TCP, port: {{ .port }}}
        {{- end }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 5432}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels:
              {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
        {{- range .Values.components }}
        - {protocol: TCP, port: {{ .port }}}
        {{- end }}
    {{- range .Values.networkPolicy.databaseEgressCIDRs }}
    - to: [{ipBlock: {cidr: {{ . | quote }}}}]
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
{{- end }}
