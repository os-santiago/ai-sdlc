{{- range $key, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-{{ $component.name }}
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" $ }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "ai-sdlc-k8s-runtime.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component.name }}
  template:
    metadata:
      labels:
        {{- include "ai-sdlc-k8s-runtime.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component.name }}
      annotations:
        {{- if and (eq $key "releaseManager") $.Values.publication.enabled }}
        checksum/review-config: {{ $.Values.review.configJSON | sha256sum }}
        ai-sdlc.io/publication-credential-revision: {{ $.Values.publication.credentialRevision | quote }}
        {{- end }}
        {{- if and (eq $key "releaseManager") $.Values.merge.enabled }}
        checksum/merge-policy: {{ $.Values.merge.configJSON | sha256sum }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if and (eq $key "worker") (has $.Values.runtime.mode (list "candidate" "verification")) }}
        ai-sdlc.io/model-credential-revision: {{ $.Values.candidate.credentialRevision | quote }}
        {{- end }}
    spec:
      {{- if and (eq $key "worker") (has $.Values.runtime.mode (list "candidate" "verification")) }}
      terminationGracePeriodSeconds: 60
      serviceAccountName: ai-sdlc-execution-controller
      {{- else }}
      serviceAccountName: {{ include "ai-sdlc-k8s-runtime.serviceAccountName" $ }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component.name }}
          image: "{{ $.Values.image.repository }}{{ if $component.digest }}@{{ $component.digest }}{{ else }}:{{ $component.name }}-{{ $.Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-config}
          env:
            - {name: AI_SDLC_HTTP_ADDRESS, value: ":{{ $component.port }}"}
            {{- if and (eq $key "intake") (has $.Values.runtime.mode (list "shadow" "candidate" "verification")) }}
            - {name: AI_SDLC_GITHUB_CREDENTIAL_PATH, value: /etc/ai-sdlc/github/credential.json}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ printf "%s-%s" $.Values.authority.databaseSecretPrefix $component.name }}, key: uri}
            {{- if eq $key "worker" }}
            - {name: AI_SDLC_ENGINE, value: {{ $.Values.engine | quote }}}
            - {name: AI_SDLC_PROVIDER_BASE_URL, value: {{ $.Values.modelProvider.baseURL | quote }}}
            - {name: AI_SDLC_MODEL, value: {{ $.Values.modelProvider.model | quote }}}
            - {name: AI_SDLC_WORKSPACE_DIR, value: {{ $.Values.modelProvider.workspaceDir | quote }}}
            - {name: AI_SDLC_ADEV_BUNDLE_PATH, value: /etc/ai-sdlc/policy/ai-sdlc.yaml}
            - {name: AI_SDLC_ADEV_BUNDLE_SHA256, value: {{ $.Files.Get "files/adev-profile.yaml" | sha256sum | quote }}}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $component.port }}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            {{- if and $.Values.build.enabled (has $key (list "releaseManager" "relay")) }}
            - {name: build-config, mountPath: /etc/ai-sdlc/build, readOnly: true}
            - {name: outer-policy, mountPath: /etc/ai-sdlc/outer-policy, readOnly: true}
            {{- end }}
            {{- if and (or (has $key (list "worker" "orchestrator")) (and (eq $key "releaseManager") $.Values.publication.enabled)) (has $.Values.runtime.mode (list "candidate" "verification")) }}
            - {name: execution, mountPath: /etc/ai-sdlc/execution, readOnly: true}
            {{- end }}
            {{- if and (eq $key "worker") (has $.Values.runtime.mode (list "candidate" "verification")) }}
            - {name: kubernetes, mountPath: /var/run/ai-sdlc/kubernetes, readOnly: true}
            - {name: model-client, mountPath: /var/run/ai-sdlc/model, readOnly: true}
            {{- end }}
            - {name: contract, mountPath: /etc/ai-sdlc/contract, readOnly: true}
            - {name: authority, mountPath: /etc/ai-sdlc/authority, readOnly: true}
            - {name: identity, mountPath: /etc/ai-sdlc/identity, readOnly: true}
            {{- if and (eq $key "releaseManager") $.Values.publication.enabled }}
            - {name: publication-client, mountPath: /etc/ai-sdlc/publication, readOnly: true}
            - {name: review-config, mountPath: /etc/ai-sdlc/review, readOnly: true}
            {{- end }}
            {{- if and (eq $key "releaseManager") $.Values.merge.enabled }}
            - {name: merge-policy, mountPath: /etc/ai-sdlc/merge, readOnly: true}
            {{- end }}
            - {name: intake-config, mountPath: /etc/ai-sdlc/intake, readOnly: true}
            {{- if and (eq $key "intake") (has $.Values.runtime.mode (list "shadow" "candidate" "verification")) }}
            - {name: github-client, mountPath: /etc/ai-sdlc/github, readOnly: true}
            {{- end }}
            {{- if eq $key "worker" }}
            - {name: workspaces, mountPath: /workspaces}
            - {name: adev, mountPath: /etc/ai-sdlc/policy, readOnly: true}
            {{- end }}
        {{- if and (eq $key "worker") (has $.Values.runtime.mode (list "candidate" "verification")) }}
        - name: model-gateway
          image: "{{ $.Values.image.repository }}@{{ $component.digest }}"
          command: [python3, /opt/ai-sdlc/model/codex_gateway.py]
          workingDir: /opt/ai-sdlc/model
          env:
            - {name: TMPDIR, value: /model-home/tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - name: CODEX_WRAPPER_TOKEN
              valueFrom: {secretKeyRef: {name: ai-sdlc-model-client, key: token}}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi, ephemeral-storage: 256Mi}
          volumeMounts:
            - {name: model-auth, mountPath: /var/run/ai-sdlc/codex, readOnly: true}
            - {name: model-home, mountPath: /model-home}
        {{- end }}
      volumes:
        {{- if and $.Values.build.enabled (has $key (list "releaseManager" "relay")) }}
        - name: build-config
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-build}
        - name: outer-policy
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-outer-policy}
        {{- end }}
        {{- if and (or (has $key (list "worker" "orchestrator")) (and (eq $key "releaseManager") $.Values.publication.enabled)) (has $.Values.runtime.mode (list "candidate" "verification")) }}
        - name: execution
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-execution}
        {{- end }}
        {{- if and (eq $key "worker") (has $.Values.runtime.mode (list "candidate" "verification")) }}
        - name: model-client
          secret: {secretName: ai-sdlc-model-client, defaultMode: 0440}
        - name: model-auth
          secret: {secretName: ai-sdlc-codex-auth, defaultMode: 0440}
        - name: model-home
          emptyDir: {sizeLimit: 128Mi}
        - name: kubernetes
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if and (eq $key "releaseManager") $.Values.publication.enabled }}
        - name: publication-client
          secret: {secretName: ai-sdlc-publication-client, defaultMode: 0440}
        - name: review-config
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-review}
        {{- end }}
        {{- if and (eq $key "releaseManager") $.Values.merge.enabled }}
        - name: merge-policy
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-merge-policy}
        {{- end }}
        - name: intake-config
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-intake}
        {{- if and (eq $key "intake") (has $.Values.runtime.mode (list "shadow" "candidate" "verification")) }}
        - name: github-client
          secret: {secretName: {{ $.Values.intake.credentialSecret }}, defaultMode: 0440}
        {{- end }}
        - name: authority
          configMap: {name: {{ $.Values.authority.policyConfigMap }}}
        - name: identity
          secret:
            secretName: {{ printf "%s-%s" $.Values.authority.identitySecretPrefix $component.name }}
            defaultMode: 0440
        - name: contract
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-contract}
        {{- if eq $key "worker" }}
        - name: workspaces
          emptyDir: {sizeLimit: {{ $.Values.components.worker.workspaceSizeLimit }}}
        - name: adev
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-adev}
        {{- end }}
{{- end }}
