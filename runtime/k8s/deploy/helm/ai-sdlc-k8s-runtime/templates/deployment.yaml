{{- range $key, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-{{ $component.name }}
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" $ }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component.name }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "ai-sdlc-k8s-runtime.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component.name }}
  template:
    metadata:
      labels:
        {{- include "ai-sdlc-k8s-runtime.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component.name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "ai-sdlc-k8s-runtime.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component.name }}
          image: "{{ $.Values.image.repository }}{{ if $component.digest }}@{{ $component.digest }}{{ else }}:{{ $component.name }}-{{ $.Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-config}
          env:
            - {name: AI_SDLC_HTTP_ADDRESS, value: ":{{ $component.port }}"}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ include "ai-sdlc-k8s-runtime.databaseSecretName" $ }}, key: {{ include "ai-sdlc-k8s-runtime.databaseSecretKey" $ }}}
            {{- if eq $key "worker" }}
            - {name: AI_SDLC_ENGINE, value: {{ $.Values.engine | quote }}}
            - {name: AI_SDLC_PROVIDER_BASE_URL, value: {{ $.Values.modelProvider.baseURL | quote }}}
            - {name: AI_SDLC_MODEL, value: {{ $.Values.modelProvider.model | quote }}}
            - {name: AI_SDLC_WORKSPACE_DIR, value: {{ $.Values.modelProvider.workspaceDir | quote }}}
            - {name: AI_SDLC_ADEV_BUNDLE_PATH, value: /etc/ai-sdlc/policy/ai-sdlc.yaml}
            - {name: AI_SDLC_ADEV_BUNDLE_SHA256, value: {{ $.Files.Get "files/adev-profile.yaml" | sha256sum | quote }}}
            {{- if ne $.Values.runtime.mode "maintenance" }}
            - name: MODEL_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ $.Values.modelProvider.apiKeySecret.name }}, key: {{ $.Values.modelProvider.apiKeySecret.key }}}
            {{- end }}
            {{- end }}
          ports:
            - {name: http, containerPort: {{ $component.port }}}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: contract, mountPath: /etc/ai-sdlc/contract, readOnly: true}
            {{- if eq $key "worker" }}
            - {name: workspaces, mountPath: /workspaces}
            - {name: adev, mountPath: /etc/ai-sdlc/policy, readOnly: true}
            {{- end }}
      volumes:
        - name: contract
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-contract}
        {{- if eq $key "worker" }}
        - name: workspaces
          emptyDir: {sizeLimit: {{ $.Values.components.worker.workspaceSizeLimit }}}
        - name: adev
          configMap: {name: {{ include "ai-sdlc-k8s-runtime.fullname" $ }}-adev}
        {{- end }}
{{- end }}
