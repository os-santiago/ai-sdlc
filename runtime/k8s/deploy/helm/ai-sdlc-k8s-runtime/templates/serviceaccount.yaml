{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.serviceAccountName" . }}
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
  labels:
    {{- include "ai-sdlc-k8s-runtime.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
