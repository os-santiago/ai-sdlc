{{- if .Values.postgres.local.enabled }}
{{- if .Values.postgres.cloudNativePG.enabled }}{{ fail "Choose local PostgreSQL OR CloudNativePG, not both" }}{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-postgres
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
spec:
  clusterIP: None
  selector:
    {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-postgres
  namespace: {{ include "ai-sdlc-k8s-runtime.namespace" . }}
spec:
  serviceName: {{ include "ai-sdlc-k8s-runtime.fullname" . }}-postgres
  replicas: 1
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels:
      {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "ai-sdlc-k8s-runtime.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.local.image | quote }}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_DB, value: ai_sdlc}
            - {name: POSTGRES_USER, value: ai_sdlc}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "ai-sdlc-k8s-runtime.databaseSecretName" . }}, key: password}
          ports: [{name: postgres, containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, ai_sdlc, -d, ai_sdlc]}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.local.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgres.local.storageSize }}}
{{- end }}
