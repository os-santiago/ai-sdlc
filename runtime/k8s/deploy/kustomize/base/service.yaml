apiVersion: v1
kind: Service
metadata:
  name: ai-sdlc-k8s-runtime
  namespace: ai-sdlc-runtime
spec:
  selector:
    app.kubernetes.io/name: ai-sdlc-k8s-runtime
  ports:
    - {name: admission, port: 8081, targetPort: admission}
    - {name: orchestrator, port: 8082, targetPort: orchestrator}
    - {name: worker, port: 8083, targetPort: worker}
    - {name: release, port: 8084, targetPort: release}
    - {name: relay, port: 8085, targetPort: relay}
