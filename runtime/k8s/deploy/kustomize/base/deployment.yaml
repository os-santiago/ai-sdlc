apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sdlc-k8s-runtime
  namespace: ai-sdlc-runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-k8s-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-sdlc-k8s-runtime
    spec:
      serviceAccountName: ai-sdlc-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admission-controller
          image: ghcr.io/os-santiago/ai-sdlc-admission-controller:development
          envFrom:
            - configMapRef:
                name: ai-sdlc-k8s-runtime-config
          env:
            - name: AI_SDLC_HTTP_ADDRESS
              value: :8081
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: ai-sdlc-postgres-app, key: uri}
          ports:
            - name: admission
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /readyz, port: admission}
          livenessProbe:
            httpGet: {path: /healthz, port: admission}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: contract, mountPath: /etc/ai-sdlc/contract, readOnly: true}
        - name: orchestrator
          image: ghcr.io/os-santiago/ai-sdlc-orchestrator:development
          envFrom:
            - configMapRef: {name: ai-sdlc-k8s-runtime-config}
          env:
            - name: AI_SDLC_HTTP_ADDRESS
              value: :8082
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: ai-sdlc-postgres-app, key: uri}
          ports:
            - name: orchestrator
              containerPort: 8082
          readinessProbe:
            httpGet: {path: /readyz, port: orchestrator}
          livenessProbe:
            httpGet: {path: /healthz, port: orchestrator}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
        - name: worker
          image: ghcr.io/os-santiago/ai-sdlc-worker:development
          envFrom:
            - configMapRef: {name: ai-sdlc-k8s-runtime-config}
          env:
            - name: AI_SDLC_HTTP_ADDRESS
              value: :8083
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: ai-sdlc-postgres-app, key: uri}
            - name: AI_SDLC_ENGINE
              value: stub # "scc" is reserved for the real sc-agent-cli subprocess engine (ADR-0005) — not implemented yet.
          ports:
            - name: worker
              containerPort: 8083
          readinessProbe:
            httpGet: {path: /readyz, port: worker}
          livenessProbe:
            httpGet: {path: /healthz, port: worker}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - {name: contract, mountPath: /etc/ai-sdlc/contract, readOnly: true}
        - name: release-manager
          image: ghcr.io/os-santiago/ai-sdlc-release-manager:development
          envFrom:
            - configMapRef: {name: ai-sdlc-k8s-runtime-config}
          env:
            - name: AI_SDLC_HTTP_ADDRESS
              value: :8084
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: ai-sdlc-postgres-app, key: uri}
          ports:
            - name: release
              containerPort: 8084
          readinessProbe:
            httpGet: {path: /readyz, port: release}
          livenessProbe:
            httpGet: {path: /healthz, port: release}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: contract, mountPath: /etc/ai-sdlc/contract, readOnly: true}
        # relay (ADR-0005): the 5th container, co-located in this pod so it
        # reaches the other four over localhost (see internal/outbox.
        # DefaultRoutes) with no NetworkPolicy egress rule needed for that
        # traffic. Its only external dependency is Postgres.
        - name: relay
          image: ghcr.io/os-santiago/ai-sdlc-relay:development
          envFrom:
            - configMapRef: {name: ai-sdlc-k8s-runtime-config}
          env:
            - name: AI_SDLC_HTTP_ADDRESS
              value: :8085
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: ai-sdlc-postgres-app, key: uri}
          ports:
            - name: relay
              containerPort: 8085
          readinessProbe:
            httpGet: {path: /readyz, port: relay}
          livenessProbe:
            httpGet: {path: /healthz, port: relay}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      volumes:
        - name: workspaces
          emptyDir:
            sizeLimit: 10Gi
        - name: contract
          configMap:
            name: ai-sdlc-contract
