apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ai-sdlc-runtime
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane-egress
  namespace: ai-sdlc-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-sdlc-k8s-runtime
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:
        - {protocol: TCP, port: 443}   # GitHub API / App token minting / model provider
        - {protocol: TCP, port: 5432}  # Postgres (CloudNativePG Cluster service) — durable state + outbox, ADR-0005
        - {protocol: TCP, port: 4317}  # OpenTelemetry collector
    # No egress rule is needed between admission-controller/orchestrator/
    # worker/release-manager/relay: deployment.yaml co-locates all five as
    # containers in one pod, so that traffic is loopback and never crosses
    # a NetworkPolicy boundary (ADR-0005).
