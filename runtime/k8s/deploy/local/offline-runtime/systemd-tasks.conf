# AI-SDLC offline runtime: gVisor runs every container of a pod inside the
# systemd scope of the pod's first container, and systemd caps each container
# scope at DefaultTasksMax (by default 15% of the node pid limit: 307 under
# podman's 2048, where a sandboxed Maven build-test, which peaked at 603 tasks,
# failed). 37.5% follows the node container's pid limit (tools/kind_nodes.py):
# 768 at 2048, 3072 at the installer default of 8192. It stays well below the
# node limit, so no scope can exhaust the node, and at or above the kubelet
# podPidsLimit (kubelet-pods.json), so a sandboxed pod is bounded by its pod
# limit rather than by its first container's scope. The node pid budget (CI
# quotas, one verification run, the node baseline) is checked by the installer
# against runtime/k8s/deploy/local/node-resources.json.
[Manager]
DefaultTasksMax=37.5%
