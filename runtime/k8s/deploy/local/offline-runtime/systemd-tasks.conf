# AI-SDLC offline runtime: gVisor runs every container of a pod inside the
# systemd scope of the pod's first container, and systemd caps each container
# scope at DefaultTasksMax (15% of the node pid limit: 307 under podman's 2048).
# A sandboxed Maven build-test peaked at 603 tasks; 768 leaves a 27% margin.
# Every pod is also bounded by the kubelet podPidsLimit (kubelet-pods.json),
# and the CI namespace runs at most two pods (ResourceQuota), so CI pods hold
# at most 2 x 768 = 1536 pids, 75% of a 2048 node limit.
[Manager]
DefaultTasksMax=768
