# Shared Maven repository cache. Pull-request runs mount it read-only as a
# Maven local-repository tail; only an explicit warm run on the current base
# branch head mounts it writable (docs/operations/tekton-ci.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-sdlc-ci-maven-cache
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 8Gi
