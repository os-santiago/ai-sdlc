# PipelineRuns execute candidate code. Their pods receive no Kubernetes API
# token and the account has no Role or RoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sdlc-ci-runner
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
automountServiceAccountToken: false
