# PipelineRuns execute candidate code. Their pods receive no Kubernetes API
# token and the account has no Role or RoleBinding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-sdlc-ci-runner
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
automountServiceAccountToken: false
---
# Any pod created without naming an account would use default: it gets no
# token either.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ai-sdlc-ci
automountServiceAccountToken: false
