# Clone one immutable commit, then build and test one Maven module. Create one
# PipelineRun per module (tools/tekton_ci_run.py renders and validates them).
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ai-sdlc-maven-ci
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
spec:
  description: Clone a pull-request head at an immutable SHA and run mvn verify for one module.
  params:
    - name: repository
      type: string
    - name: revision
      type: string
    - name: module
      type: string
      default: "."
    - name: services
      type: string
      default: none
    - name: maven-args
      type: array
      default: []
    - name: maven-mirror-url
      type: string
      default: ""
  workspaces:
    - name: source
    - name: maven-cache
      optional: true
    - name: maven-cache-writable
      optional: true
  tasks:
    - name: clone
      taskRef:
        name: ai-sdlc-git-clone
      params:
        - name: repository
          value: $(params.repository)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source
    - name: verify
      runAfter: [clone]
      taskRef:
        name: ai-sdlc-maven-verify
      params:
        - name: module
          value: $(params.module)
        - name: services
          value: $(params.services)
        - name: maven-args
          value: ["$(params.maven-args[*])"]
        - name: maven-mirror-url
          value: $(params.maven-mirror-url)
      workspaces:
        - name: source
          workspace: source
        - name: maven-cache
          workspace: maven-cache
        - name: maven-cache-writable
          workspace: maven-cache-writable
  results:
    - name: commit
      value: $(tasks.clone.results.commit)
    - name: summary
      value: $(tasks.verify.results.summary)
