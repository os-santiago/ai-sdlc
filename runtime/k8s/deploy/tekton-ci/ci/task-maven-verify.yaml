# Build and test one Maven module of a checked-out commit with a pinned JDK and
# Maven, then publish a bounded summary of the Surefire and Failsafe reports.
#
# Test services are Tekton sidecars that start only when the services
# parameter names them; otherwise they idle. They listen on the pod's loopback
# interface only and use throwaway, trust-authenticated databases that exist
# for the life of the pod.
#
# Dependency cache: bind maven-cache (read-only) for pull-request runs. Maven
# then resolves from that cache as a read-only local-repository tail and writes
# new downloads to a pod-local head that disappears with the pod, so a
# candidate cannot poison the shared cache. Bind maven-cache-writable instead
# only for a trusted warm run on the current base-branch head.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ai-sdlc-maven-verify
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
    # Tekton copies Task labels to pods; network-policy.yaml selects on it.
    ai-sdlc.io/ci-egress: public-https
spec:
  description: Run mvn verify for one module and summarize its test reports.
  params:
    - name: module
      type: string
      default: "."
      description: Module directory relative to the repository root.
    - name: services
      type: string
      default: none
      description: Comma-separated test services to start (none, postgres).
    - name: maven-args
      type: array
      default: []
      description: Extra Maven arguments, passed as separate argv entries.
    - name: maven-mirror-url
      type: string
      default: ""
      description: Optional Maven repository proxy URL (mirrorOf *); empty uses Maven Central.
  workspaces:
    - name: source
      description: Contains the checkout under source/.
    - name: maven-cache
      optional: true
      readOnly: true
      description: Shared Maven cache, read-only tail for untrusted runs.
    - name: maven-cache-writable
      optional: true
      description: Shared Maven cache, writable; trusted warm runs only.
  results:
    - name: summary
      description: JSON summary of the Maven exit code and test report counts.
  volumes:
    - name: home
      emptyDir:
        sizeLimit: 8Gi
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
    - name: postgres-data
      emptyDir:
        sizeLimit: 2Gi
    - name: postgres-run
      emptyDir:
        sizeLimit: 16Mi
  stepTemplate:
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
      - name: home
        mountPath: /home/ci
      - name: tmp
        mountPath: /tmp
    env:
      - name: HOME
        value: /home/ci
      - name: MODULE
        value: $(params.module)
      - name: SERVICES
        value: $(params.services)
      - name: SOURCE
        value: $(workspaces.source.path)/source
  sidecars:
    - name: postgres
      image: docker.io/library/postgres@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
      env:
        - name: SERVICES
          value: $(params.services)
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          value: ci
        - name: POSTGRES_DB
          value: ci
        # Loopback-only, single-pod, throwaway database: no credential exists.
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'case ",$SERVICES," in *,postgres,*) exec pg_isready -q -h 127.0.0.1 -U ci -d ci;; *) exit 0;; esac'
        periodSeconds: 2
        failureThreshold: 60
      script: |
        #!/bin/sh
        case ",$SERVICES," in
          *,postgres,*)
            exec docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -c fsync=off \
              -c synchronous_commit=off -c full_page_writes=off;;
          *) exec sleep 86400;;
        esac
  steps:
    # The pinned kind network-policy agent was observed to leave a new pod
    # unrestricted for its first seconds. Candidate code (Maven plugins and
    # tests) must not start before the namespace policy is enforced, so this
    # step requires repeated denial of the Kubernetes API Service first. Only
    # a connect timeout or refusal counts as denial; any other outcome resets.
    - name: egress-gate
      image: docker.io/library/maven@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
      computeResources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 200m
          memory: 64Mi
      script: |
        #!/bin/sh
        set -u
        [ -n "${KUBERNETES_SERVICE_HOST:-}" ] && [ -n "${KUBERNETES_SERVICE_PORT:-}" ] \
          || { echo 'no Kubernetes Service address to probe' >&2; exit 1; }
        target="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT/"
        denied=0
        attempt=0
        while [ "$attempt" -lt 90 ]; do
          attempt=$((attempt + 1))
          code=0
          curl -sk -o /dev/null --connect-timeout 2 --max-time 3 "$target" || code=$?
          case "$code" in 7|28) denied=$((denied + 1));; *) denied=0;; esac
          if [ "$denied" -ge 3 ]; then
            echo "Network policy enforced after $attempt probes"
            exit 0
          fi
          sleep 1
        done
        echo 'network policy is not enforced: the Kubernetes API stays reachable' >&2
        exit 1
    - name: maven
      image: docker.io/library/maven@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
      onError: continue
      computeResources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 6Gi
      env:
        - name: MAVEN_CONFIG
          value: ""
        - name: MAVEN_OPTS
          value: -Xmx1g
        - name: MAVEN_MIRROR_URL
          value: $(params.maven-mirror-url)
        - name: CACHE_READONLY_BOUND
          value: $(workspaces.maven-cache.bound)
        - name: CACHE_READONLY
          value: $(workspaces.maven-cache.path)
        - name: CACHE_WRITABLE_BOUND
          value: $(workspaces.maven-cache-writable.bound)
        - name: CACHE_WRITABLE
          value: $(workspaces.maven-cache-writable.path)
        # Tests run without a container engine: Dev Services and
        # Testcontainers cannot start containers, so services come from
        # sidecars configured below.
        - name: QUARKUS_DEVSERVICES_ENABLED
          value: "false"
        - name: TESTCONTAINERS_RYUK_DISABLED
          value: "true"
      args: ["$(params.maven-args[*])"]
      script: |
        #!/bin/sh
        set -eu
        case "$MODULE" in
          .) ;;
          *) printf '%s' "$MODULE" | grep -Eqx '[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*' \
               || { echo 'module must be a relative directory' >&2; exit 2; }
             case "/$MODULE/" in */./*|*/../*) echo 'module must be a relative directory' >&2; exit 2;; esac;;
        esac
        printf '%s' "$SERVICES" | grep -Eqx '(none|postgres)(,(none|postgres))*' \
          || { echo 'unsupported services value' >&2; exit 2; }
        [ -f "$SOURCE/$MODULE/pom.xml" ] || { echo "no pom.xml in $MODULE" >&2; exit 2; }
        mkdir -p "$HOME/.m2"
        settings="$HOME/.m2/settings.xml"
        if [ -n "$MAVEN_MIRROR_URL" ]; then
          printf '%s' "$MAVEN_MIRROR_URL" | grep -Eqx 'https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?' \
            || { echo 'invalid Maven mirror URL' >&2; exit 2; }
          printf '%s\n' '<settings><mirrors><mirror><id>ai-sdlc-proxy</id><mirrorOf>*</mirrorOf>' \
            "<url>$MAVEN_MIRROR_URL</url></mirror></mirrors></settings>" > "$settings"
        else
          printf '%s\n' '<settings/>' > "$settings"
        fi
        if [ "$CACHE_WRITABLE_BOUND" = true ]; then
          set -- "-Dmaven.repo.local=$CACHE_WRITABLE/repository" "$@"
        elif [ "$CACHE_READONLY_BOUND" = true ] && [ -d "$CACHE_READONLY/repository" ]; then
          set -- "-Dmaven.repo.local=$HOME/repository" \
            "-Dmaven.repo.local.tail=$CACHE_READONLY/repository" \
            -Dmaven.repo.local.tail.ignoreAvailability=true "$@"
        else
          set -- "-Dmaven.repo.local=$HOME/repository" "$@"
        fi
        case ",$SERVICES," in
          *,postgres,*)
            export QUARKUS_DATASOURCE_USERNAME=ci
            export QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://127.0.0.1:5432/ci
            export QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://127.0.0.1:5432/ci;;
        esac
        cd "$SOURCE/$MODULE"
        echo "Maven verify for module $MODULE (services: $SERVICES)"
        exec mvn -B -ntp -s "$settings" "$@" verify
    - name: summarize
      image: docker.io/library/maven@sha256:93b8a14ea2f412782e4e842651273b4d903e35cc496284f178fbbe2d67d00976
      computeResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      env:
        - name: MAVEN_EXIT_CODE_PATH
          value: $(steps.step-maven.exitCode.path)
        - name: RESULT
          value: $(results.summary.path)
      script: |
        #!/bin/sh
        set -eu
        code="$(cat "$MAVEN_EXIT_CODE_PATH" 2>/dev/null || echo 255)"
        printf '%s' "$code" | grep -Eqx '[0-9]{1,3}' || code=255
        # Sum one numeric attribute of a report's <testsuite> header.
        count() { printf '%s' "$header" | sed -n "s/.* $1=\"\([0-9]\{1,9\}\)\".*/\1/p"; }
        reports=0 tests=0 failures=0 errors=0 skipped=0
        for report in "$SOURCE/$MODULE"/target/surefire-reports/TEST-*.xml \
                      "$SOURCE/$MODULE"/target/failsafe-reports/TEST-*.xml; do
          [ -f "$report" ] || continue
          header="$(grep -m1 -o '<testsuite [^>]*>' "$report" || true)"
          [ -n "$header" ] || continue
          reports=$((reports + 1))
          value="$(count tests)"; tests=$((tests + ${value:-0}))
          value="$(count failures)"; failures=$((failures + ${value:-0}))
          value="$(count errors)"; errors=$((errors + ${value:-0}))
          value="$(count skipped)"; skipped=$((skipped + ${value:-0}))
        done
        module="$MODULE"
        printf '%s' "$module" | grep -Eqx '[A-Za-z0-9_./-]{1,200}' || module=invalid
        printf '{"module":"%s","mavenExitCode":%d,"reports":%d,"tests":%d,"failures":%d,"errors":%d,"skipped":%d}' \
          "$module" "$code" "$reports" "$tests" "$failures" "$errors" "$skipped" > "$RESULT"
        cat "$RESULT"; echo
        [ "$code" -eq 0 ] || { echo "Maven exited with $code" >&2; exit 1; }
