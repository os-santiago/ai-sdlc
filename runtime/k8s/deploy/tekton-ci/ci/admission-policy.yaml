# Admission control for PipelineRuns in ai-sdlc-ci: only the catalog
# pipelines, only the token-free runner account, no egress label (labels
# propagate from the PipelineRun to its pods, where network-policy.yaml reads
# them), and only the reviewed workspace bindings: a fresh source claim
# without a data source, and a repository cache that is read-only except for
# maven-dependencies. Writing a cache (maven-dependencies) is limited to
# cluster administrators; that its revision is the current base-branch head
# and its claim belongs to its repository is checked by the caller
# (tools/tekton_ci_run.py, internal/tektontasks), because admission can
# neither read GitHub nor compute the claim digest. Tekton accepts no inline
# specifications (feature flag), so a run cannot bring its own tasks. Pod
# templates and per-task overrides are allowlisted field by field: env,
# volumes, DNS or host aliases there would let a run reshape candidate pods
# (for example fake the address the egress gate probes, or load a candidate
# file with NODE_OPTIONS). RBAC must never grant create on TaskRuns, CustomRuns
# or Pods in ai-sdlc-ci: this policy covers PipelineRuns only, because the
# Tekton controller creates the TaskRuns and Pods itself.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ai-sdlc-ci-pipelineruns
  labels:
    app.kubernetes.io/part-of: ai-sdlc
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [tekton.dev]
        apiVersions: ["*"]
        operations: [CREATE]
        resources: [pipelineruns]
  validations:
    - expression: >-
        object.spec.all(k, k in ['pipelineRef', 'params', 'timeouts', 'taskRunTemplate', 'workspaces', 'taskRunSpecs'])
      message: only reviewed PipelineRun fields may be set
    - expression: >-
        !has(object.spec.taskRunTemplate) || object.spec.taskRunTemplate.all(k, k in ['serviceAccountName', 'podTemplate'])
      message: taskRunTemplate allows only serviceAccountName and podTemplate
    - expression: >-
        (!has(object.spec.taskRunTemplate) || !has(object.spec.taskRunTemplate.podTemplate) ||
         (object.spec.taskRunTemplate.podTemplate.all(k, k in ['automountServiceAccountToken', 'securityContext', 'runtimeClassName']) &&
          (!has(object.spec.taskRunTemplate.podTemplate.runtimeClassName) ||
           object.spec.taskRunTemplate.podTemplate.runtimeClassName in ['ai-sdlc-offline']))) &&
        (!has(object.spec.taskRunSpecs) || object.spec.taskRunSpecs.all(s,
          s.all(k, k in ['pipelineTaskName', 'podTemplate', 'stepSpecs', 'sidecarSpecs', 'computeResources', 'metadata']) &&
          (!has(s.podTemplate) ||
           (s.podTemplate.all(k, k in ['automountServiceAccountToken', 'securityContext', 'runtimeClassName']) &&
            (!has(s.podTemplate.runtimeClassName) || s.podTemplate.runtimeClassName in ['ai-sdlc-offline']))) &&
          (!has(s.stepSpecs) || s.stepSpecs.all(x, x.all(k, k in ['name', 'computeResources']))) &&
          (!has(s.sidecarSpecs) || s.sidecarSpecs.all(x, x.all(k, k in ['name', 'computeResources'])))))
      message: pod templates allow only automountServiceAccountToken, securityContext and the offline runtime class; step and sidecar overrides only computeResources
    - expression: >-
        has(object.spec.pipelineRef) && has(object.spec.pipelineRef.name) &&
        object.spec.pipelineRef.name in ['ai-sdlc-maven-build-test', 'ai-sdlc-maven-dependencies', 'ai-sdlc-npm-lock-update']
      message: only the reviewed catalog pipelines may run
    - expression: >-
        has(object.spec.taskRunTemplate) && has(object.spec.taskRunTemplate.serviceAccountName) &&
        object.spec.taskRunTemplate.serviceAccountName == 'ai-sdlc-ci-runner' &&
        (!has(object.spec.taskRunTemplate.podTemplate) ||
         !has(object.spec.taskRunTemplate.podTemplate.automountServiceAccountToken) ||
         object.spec.taskRunTemplate.podTemplate.automountServiceAccountToken == false)
      message: runs use the token-free ai-sdlc-ci-runner account
    - expression: >-
        !has(object.spec.taskRunSpecs) || object.spec.taskRunSpecs.all(s,
          (!has(s.serviceAccountName) || s.serviceAccountName == 'ai-sdlc-ci-runner') &&
          (!has(s.podTemplate) || !has(s.podTemplate.automountServiceAccountToken) ||
           s.podTemplate.automountServiceAccountToken == false))
      message: per-task overrides keep the token-free runner account
    - expression: >-
        (!has(object.metadata.labels) || !('ai-sdlc.io/ci-egress' in object.metadata.labels)) &&
        (!has(object.spec.taskRunSpecs) || object.spec.taskRunSpecs.all(s,
          !has(s.metadata) || !has(s.metadata.labels) || !('ai-sdlc.io/ci-egress' in s.metadata.labels)))
      message: egress labels come only from the reviewed Tasks
    - expression: >-
        object.spec.pipelineRef.name != 'ai-sdlc-maven-dependencies' ||
        request.userInfo.groups.exists(g, g == 'system:masters' || g == 'kubeadm:cluster-admins')
      message: only cluster administrators may run maven-dependencies, which writes a shared cache
    - expression: >-
        object.spec.pipelineRef.name != 'ai-sdlc-maven-build-test' ||
        (has(object.spec.taskRunSpecs) && object.spec.taskRunSpecs.exists(s,
          s.pipelineTaskName == 'build-test' && has(s.podTemplate) && has(s.podTemplate.runtimeClassName) &&
          s.podTemplate.runtimeClassName == 'ai-sdlc-offline'))
      message: maven-build-test runs candidate code only under the ai-sdlc-offline sandbox
    - expression: >-
        !has(object.spec.workspaces) || object.spec.workspaces.all(w,
          (w.name == 'source' && w.all(k, k in ['name', 'volumeClaimTemplate']) && has(w.volumeClaimTemplate.spec) &&
           w.volumeClaimTemplate.spec.all(k, k in ['accessModes', 'resources'])) ||
          (w.name == 'maven-cache' && w.all(k, k in ['name', 'persistentVolumeClaim']) && has(w.persistentVolumeClaim) &&
           w.persistentVolumeClaim.claimName.startsWith('ai-sdlc-ci-maven-cache-') &&
           (object.spec.pipelineRef.name == 'ai-sdlc-maven-dependencies' ||
            (has(w.persistentVolumeClaim.readOnly) && w.persistentVolumeClaim.readOnly == true))))
      message: workspaces are a fresh source claim and a repository cache, read-only except for maven-dependencies
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ai-sdlc-ci-pipelineruns
  labels:
    app.kubernetes.io/part-of: ai-sdlc
spec:
  policyName: ai-sdlc-ci-pipelineruns
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ai-sdlc-ci
