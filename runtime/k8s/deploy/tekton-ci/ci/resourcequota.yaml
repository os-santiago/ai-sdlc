# Pod-count bounds in the CI namespace, so CI pods stay within the kind node's
# pid limit next to the node's own baseline. The pods values below are the
# defaults; ./install.sh local --tekton-ci-candidate-pods/--tekton-ci-fetch-pods
# sets them and refuses counts the node pid budget cannot hold
# (tools/kind_nodes.py, runtime/k8s/deploy/local/node-resources.json):
#
#   measured node peak without CI  ~1100 pids
#   one verification run           3 x 768 (candidate or verification profile)
#   each candidate-code pod         768 (kubelet podPidsLimit; sandboxed
#                                        build-test measured at 603)
#   each fetch pod                  768 (counted at its podPidsLimit bound;
#                                        trusted inputs only: checkout,
#                                        maven-dependencies on the base head,
#                                        npm with scripts disabled)
#   defaults                        4940 of the installer's 8192 node limit
#
# Candidate code runs only in build-test pods, which carry the
# ai-sdlc-ci-candidate PriorityClass (admission requires it). Every other CI
# pod is a fetch pod. Tekton keeps a refused task pod pending and creates it
# when a pod ends.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-sdlc-ci-candidate-pods
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
spec:
  hard:
    pods: "1"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [ai-sdlc-ci-candidate]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ai-sdlc-ci-fetch-pods
  namespace: ai-sdlc-ci
  labels:
    app.kubernetes.io/part-of: ai-sdlc
spec:
  hard:
    pods: "1"
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: NotIn
        values: [ai-sdlc-ci-candidate]
---
# Marks candidate-code pods for the quota above. It never preempts and does
# not raise scheduling priority.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: ai-sdlc-ci-candidate
  labels:
    app.kubernetes.io/part-of: ai-sdlc
value: 0
preemptionPolicy: Never
globalDefault: false
description: AI-SDLC CI pods that run candidate code (build-test); bounded to one at a time by a ResourceQuota.
