# Archetype: internal app — aggressive ceiling.
# Full autonomy up to auto-merge-all: any non-critical PR merges itself on
# green. critical still requires pr:risk-accepted. Deploy intentionally left
# out of scope (deploys_to staging, but level stops at auto-merge-all —
# raise to auto-deploy only with a verified rollback path).
spec: "1.0.0"

repo:
  archetype: app
  primary_language: javascript
  deploys_to: staging

autonomy:
  level: auto-merge-all
  merge_requires_checks: true
  freeze_env: AI_SDLC_FREEZE

triggers:
  issue_label: ready-to-implement
  skip_labels:
    - epic
    - wontfix
    - invalid
    - duplicate
    - question
    - dependencies
    - needs-human
  authorized_labelers:
    - Axel-DaMage

verify:
  commands:
    - npm test
  required_checks:
    - sanity
  timeout_seconds: 600

# Dependency-update worker (issue #177): internal app = aggressive.
# Latest-target scans, patch+minor auto-land — majors still flag human.
dependencies:
  enabled: true
  ecosystems: [npm]
  cadence: daily
  min_release_age_days: 7
  target: latest
  include_dev: true
  auto_kinds: [patch, minor]
  max_updates: 20
  branch: chore/dep-updates
  labels: [dependencies, ai-sdlc]
  egress_profile: npm-vet

review:
  mode: hybrid            # AI reviews every PR; humans spot-check
  ai_reviewer:
    model: auto/best-reasoning
    inline_comments: true
    incremental: true
  risk_labels:
    - pr:risk-low
    - pr:risk-medium
    - pr:risk-high
    - pr:risk-critical
    - pr:risk-accepted
  critical_requires_acceptance: true

merge:
  method: squash
  delete_branch: true
  max_repairs: 5           # internal velocity > bounded repair count
  pending_max_minutes: 45
  grace_minutes: 5
  skip_labels:
    - needs-human
    - hold
    - do-not-merge
    - wip

model:
  primary: auto/best-coding
  fallback: auto/best-fast
  routing_hints:
    docs_tasks: auto/best-fast
    refactor_tasks: auto/best-reasoning

engine:
  name: scc
  max_steps: 400
  max_seconds: 1500
  flags:
    - --no-commit
    - --audit-log
    - --summary-file
    - --prompt-file

# Per-stage engine + model selection (issues #205, #171;
# spec/model-routing.md): each stage key is a task class. The
# stage-definition object carries `engine` and/or `model` — a missing
# engine falls back to engine.name (scc), a missing model to
# model.primary. Spend capability where it pays: cheap models on
# mechanical classes, frontier reasoning on review/repair.
engines:
  intake:
    model: auto/best-fast            # cheap class, default adapter
  implement: scc                     # shorthand — model.primary (best-coding)
  review:
    engine: scc
    model: auto/best-reasoning       # frontier class; review.ai_reviewer.model
                                     # would still outrank this for the reviewer
  ci-repair:
    model: auto/best-reasoning

escalation:
  label: needs-human
  contacts:
    - "@Axel-DaMage"
  notify_channels:
    - discord:ops
  # Failure-class → notification route map (spec/risk-taxonomy.md). Unknown
  # classes fall back to `default` — alerting is never silent.
  routes:
    security:          {mentions: ["@Axel-DaMage", "my-org/security-team"], labels: ["priority:P0"], channel: discord:ops}
    contract-error:    {mentions: ["@Axel-DaMage"], labels: ["priority:P0"], channel: issue-comment}
    supply-chain:      {mentions: ["my-org/security-team"], labels: ["priority:P1"], channel: issue-comment}
    verify-failure:    {mentions: ["@Axel-DaMage"], labels: ["priority:P1"], channel: discord:ops}
    default:           {mentions: ["@Axel-DaMage"], channel: issue-comment}
