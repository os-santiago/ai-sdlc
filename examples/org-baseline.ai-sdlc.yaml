# org-baseline.ai-sdlc.yaml — org-wide floor template (spec/org-policy.md)
#
# Host in a designated org repo (e.g. <org>/.ai-sdlc) and reference it from
# consumers via the load-config `org-config` input:
#   org_config: <org>/.ai-sdlc            # .ai-sdlc.yaml on the default branch
#   org_config: <org>/policy/baseline.yaml@v1
#
# Merge model: the baseline sits between runtime defaults and the repo
# contract — guard-rail lists union (org entries can never be dropped),
# maps merge key-wise, scalars are inherited unless the repo sets them,
# and autonomy.level clamps to this ceiling.
spec: "1.0.0"

autonomy:
  level: auto-merge-low                # ceiling: repos may tighten, never loosen

review:
  critical_requires_acceptance: true   # pr:risk-critical always needs pr:risk-accepted

# Supply-chain floor for the dep-update worker (issue #177): the pin below
# takes this value outright for every non-exempt repo — the release-age
# gate cannot be relaxed below the org floor.
dependencies:
  min_release_age_days: 14

verify:
  # Org-mandated gates (union field — repos may add checks but can never
  # drop these). ai-sdlc-security is the deterministic supply-chain
  # security gate (epic #87; spec/org-policy.md — Security Gate): a
  # blocking finding fails the check and holds the merge.
  required_checks:
    - ai-sdlc-security

# Security gate floor (epic #87). Org-declared values are clamps: repos
# may tighten — a lower min_severity, a stricter severity_matrix outcome,
# a higher scan mode, enabling the gate where the org left it off — but
# can never loosen them. Calibration: docs/security/gate-calibration.md.
security:
  enabled: true
  min_severity: high            # findings >= high are blocking-class
  block_on_secret: true         # credential material always blocks
  secrets_scan: enforce         # gitleaks-class scan — repos cannot silence it
  dependency_audit: enforce     # osv-scanner-class audit — repos cannot weaken it
  license_check: report         # license observations stay advisory (org may raise to enforce)
  sbom:                         # SBOM evidence (issue #92 — never blocks the gate)
    enabled: true
    format: cyclonedx
    attach_to: [pr, release]    # union-additive: repos may attach more, never fewer
  severity_matrix:              # pr:risk-* tier → gate outcome
    pr:risk-low: report-only
    pr:risk-medium: report-only
    pr:risk-high: blocking-if-fix-available     # blocks when a fix exists
    pr:risk-critical: blocking-if-fix-available # blocks when a fix exists

policy_floor:
  # Fields repos cannot relax. Pinned scalars take the org value outright;
  # union fields keep org entries; autonomy.level stays a ceiling.
  pin:
    - autonomy.level
    - review.critical_requires_acceptance
    - merge.skip_labels
    - triggers.skip_labels
    - verify.required_checks
    - dependencies.min_release_age_days
    # Security gate floors (epic #87): clamps enforce themselves whenever
    # the baseline sets the field — these pins record the floor in the
    # resolved contract's pinned/enforced audit trail.
    - security.enabled
    - security.min_severity
    - security.block_on_secret
    - security.secrets_scan
    - security.dependency_audit
    - security.license_check
    - security.sbom.enabled
    - security.sbom.format        # scalar pin — org format stands outright
    - security.sbom.attach_to
    - security.severity_matrix.pr:risk-high
    - security.severity_matrix.pr:risk-critical
    - release.provenance
    - release.signing
  # Repos the baseline skips entirely (owner/repo or bare repo name).
  exempt:
    - owner/exempt-repo

# Release provenance floor (issues #100/#103): org-mandated posture — repos
# cannot publish unattested/unsigned release artifacts under this baseline.
release:
  provenance: attest
  signing: cosign-keyless
